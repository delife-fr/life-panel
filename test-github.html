<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test synchro GitHub</title>
<!--
  Page de test pour LIFE PANEL (27/09/2026) : lire et écrire un petit fichier JSON dans un dépôt GitHub PRIVÉ,
  depuis le PC et depuis le téléphone, sans rien redemander à chaque visite, avec détection des conflits
  (GitHub refuse d'écrire si le fichier a changé depuis la dernière lecture). Indépendante de LIFE PANEL.
  La clé GitHub reste dans ce navigateur (stockage local du site) ; elle n'apparaît jamais dans le rapport.
-->
<style>
:root{color-scheme:dark;--fond:#1b1b1d;--carte:#232326;--champ:#19191c;--trait:#34343a;--trait-doux:#2b2b30;
  --texte:#f1f1f2;--texte-doux:#a9a9b1;--texte-faible:#7d7d86;--bleu:#3987e5;--i-vert:#4ec89b;--i-jaune:#e5b54a;--i-rouge:#ff6b6b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sous{color:var(--texte-doux);margin:0 0 18px;font-size:14px}
.carte{background:var(--carte);border:1px solid var(--trait-doux);border-radius:14px;padding:16px;margin:0 0 14px}
.carte h2{font-size:15px;margin:0 0 12px}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px;margin:0 0 12px}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--texte-doux);min-width:0}
input[type=text],input[type=password]{font:inherit;font-size:15px;color:var(--texte);background:var(--champ);border:1px solid var(--trait);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
.boutons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--trait);background:#2c2c31;color:var(--texte);padding:9px 14px;min-height:40px}
button.p{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.etat{font-size:13.5px;margin:10px 0 0;color:var(--texte-doux)}
.ok{color:var(--i-vert)} .ko{color:var(--i-rouge)} .att{color:var(--i-jaune)}
.aide{font-size:13px;color:var(--texte-faible);margin:10px 0 0}
ul.liste{list-style:none;margin:0 0 12px;padding:0}
ul.liste li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--trait-doux);min-width:0}
ul.liste li:first-child{border-top:0}
.corps{flex:1;min-width:0}
.nom{display:block;overflow-wrap:anywhere}
.meta{display:block;font-size:12.5px;color:var(--texte-faible)}
li button{flex-shrink:0;min-height:34px;padding:5px 10px;font-size:13px}
.vide{color:var(--texte-faible);font-size:14px;padding:6px 2px}
form.ajout{display:flex;gap:8px;margin:0 0 12px}
form.ajout input{flex:1}
label.case{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--texte-doux);margin:12px 0 0}
.alerte{border:1px solid #e5b54a66;background:#e5b54a14;border-radius:12px;padding:12px 14px;margin:12px 0 0}
.alerte p{margin:0 0 10px;font-size:14px}
a{color:#7ab0f0}
textarea{display:block;width:100%;min-height:220px;background:var(--champ);color:var(--texte);border:1px solid var(--trait);border-radius:10px;padding:10px;font:12.5px/1.5 var(--mono);resize:vertical}
</style>
</head>
<body>
<main>
  <h1>Test synchro GitHub</h1>
  <p class="sous">Page de test indépendante de LIFE PANEL : elle lit et écrit un petit fichier JSON dans ton dépôt privé. Ta clé reste dans ce navigateur.</p>

  <section class="carte">
    <h2>1. Connexion</h2>
    <div class="champs">
      <label class="champ">Pseudo GitHub<input type="text" id="owner" autocomplete="off" spellcheck="false" placeholder="delife-fr"></label>
      <label class="champ">Dépôt privé<input type="text" id="repo" autocomplete="off" spellcheck="false" placeholder="life-panel-donnees"></label>
      <label class="champ">Fichier<input type="text" id="chemin" autocomplete="off" spellcheck="false" value="test.json"></label>
      <label class="champ">Nom de cet appareil<input type="text" id="appareil" autocomplete="off" spellcheck="false"></label>
      <label class="champ">Clé GitHub<input type="password" id="jeton" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
    </div>
    <div class="boutons">
      <button class="p" id="connecter" type="button">Enregistrer et se connecter</button>
      <button id="oublier" type="button">Oublier la clé</button>
    </div>
    <p class="etat" id="etatCnx">Pas encore connecté.</p>
  </section>

  <section class="carte" id="zone" hidden>
    <h2>2. Fichier <span id="nomFichier"></span></h2>
    <ul class="liste" id="elements"></ul>
    <form class="ajout" id="ajout"><input type="text" id="texte" placeholder="Nouvel élément de test" autocomplete="off"><button type="submit">Ajouter</button></form>
    <div class="boutons">
      <button class="p" id="enregistrer" type="button">Enregistrer sur GitHub</button>
      <button id="relire" type="button">Relire depuis GitHub</button>
    </div>
    <label class="case"><input type="checkbox" id="auto" checked> Enregistrer automatiquement 3 secondes après la dernière modification</label>
    <p class="etat" id="etatFichier"></p>
    <div class="alerte" id="conflit" hidden></div>
    <p class="aide"><a id="historique" target="_blank" rel="noopener" href="#">Voir l'historique du fichier sur GitHub</a></p>
  </section>

  <section class="carte">
    <h2>Rapport</h2>
    <textarea id="rapport" readonly aria-label="Rapport du test"></textarea>
    <div class="boutons" style="margin-top:10px"><button id="copier" type="button">Copier le rapport</button></div>
  </section>
</main>

<script>
'use strict';
const API = window.__API_GITHUB__ || 'https://api.github.com';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const heure = (d = new Date()) => d.toLocaleTimeString('fr-FR');
const court = sha => String(sha || '').slice(0, 7);
const taille = o => o < 1024 ? o + ' o' : (o / 1024).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' ko';
const clone = x => JSON.parse(JSON.stringify(x));

/* ---------- Rapport (la clé n'y figure jamais) ---------- */
const journalLignes = [];
function navigateur(){
  const u = navigator.userAgent; let m, n = 'navigateur inconnu';
  if((m = u.match(/OPR\/(\d+)/))) n = 'Opera ' + m[1];
  else if((m = u.match(/EdgA?\/(\d+)/))) n = 'Edge ' + m[1];
  else if((m = u.match(/SamsungBrowser\/(\d+)/))) n = 'Samsung Internet ' + m[1];
  else if((m = u.match(/Chrome\/(\d+)/))) n = 'Chrome ' + m[1];
  else if((m = u.match(/Firefox\/(\d+)/))) n = 'Firefox ' + m[1];
  const os = (m = u.match(/Android ([\d.]+)/)) ? 'Android ' + m[1] : /Windows/.test(u) ? 'Windows' : /Mac OS X/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : 'système inconnu';
  return n + ' sur ' + os;
}
function journal(t){ journalLignes.push(heure() + '  ' + t); majRapport(); }
function majRapport(){
  $('rapport').value = ['TEST SYNCHRO GITHUB — ' + new Date().toLocaleDateString('fr-FR'), 'Navigateur : ' + navigateur(),
    'Appareil : ' + (cfg.appareil || '?') + ' · dépôt : ' + (cfg.owner && cfg.repo ? cfg.owner + '/' + cfg.repo : '?') + ' · fichier : ' + (cfg.chemin || '?'), '', ...journalLignes].join('\n');
}
$('copier').onclick = async () => {
  const b = $('copier'), t = $('rapport').value; let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch{
    try { $('rapport').focus(); $('rapport').select(); ok = document.execCommand('copy'); } catch{ ok = false; }
  }
  b.textContent = ok ? 'Copié !' : 'Copie impossible : sélectionne le texte à la main';
  setTimeout(() => { b.textContent = 'Copier le rapport'; }, 2500);
};
window.addEventListener('error', e => journal('Erreur de la page : ' + e.message));
window.addEventListener('unhandledrejection', e => journal('Erreur de la page : ' + (e.reason && (e.reason.name + ' — ' + e.reason.message) || e.reason)));

/* ---------- Réglages (gardés dans ce navigateur) ---------- */
const CLE = 'test-github-reglages';
function lireCfg(){ try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch{ return {}; } }
function ecrireCfg(){ try { localStorage.setItem(CLE, JSON.stringify(cfg)); return true; } catch(e){ journal('Réglages non mémorisés dans ce navigateur (' + e.name + ')'); return false; } }
let cfg = lireCfg();

/* ---------- Texte ↔ base64 (UTF-8 : accents et émojis compris) ---------- */
function versBase64(txt){
  const o = new TextEncoder().encode(txt); let b = '';
  for(let i = 0; i < o.length; i += 0x8000) b += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000));
  return btoa(b);
}
function depuisBase64(b64){
  const b = atob(String(b64).replace(/\s/g, '')), o = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i);
  return new TextDecoder().decode(o);
}

/* ---------- Appels à GitHub (jamais de cache : on veut toujours la dernière version) ---------- */
async function gh(chemin, {method = 'GET', corps = null, brut = false} = {}){
  const h = {'Authorization':'Bearer ' + cfg.jeton, 'Accept':brut ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  if(corps) h['Content-Type'] = 'application/json';
  const r = await fetch(API + chemin, {method, cache:'no-store', headers:h, body:corps ? JSON.stringify(corps) : null});
  const texte = await r.text(); let donnees = null;
  if(!brut){ try { donnees = texte ? JSON.parse(texte) : null; } catch{ donnees = null; } }
  return {statut:r.status, ok:r.ok, donnees, texte};
}
const enc = encodeURIComponent;
const cheminDepot = () => '/repos/' + enc(cfg.owner) + '/' + enc(cfg.repo);
const cheminFichier = () => cheminDepot() + '/contents/' + cfg.chemin.split('/').map(enc).join('/');

/* ---------- Données de test ---------- */
const neuf = () => ({version:1, maj:'', appareil:'', elements:[]});
function normaliser(d){
  const o = d && typeof d === 'object' ? d : {};
  return {version:1, maj:String(o.maj || ''), appareil:String(o.appareil || ''),
    elements:(Array.isArray(o.elements) ? o.elements : []).filter(x => x && typeof x === 'object')
      .map(x => ({id:String(x.id || uid()), texte:String(x.texte || ''), appareil:String(x.appareil || ''), quand:String(x.quand || '')}))};
}
let distant;          /* dernière version connue sur GitHub : {sha, donnees} ; null = fichier absent ; undefined = pas encore lu */
let local = null;     /* données affichées ici */
let modifie = false, minuterie = null, occupe = false, connecte = false, echecReseau = false;

/* ---------- Affichage ---------- */
function afficher(){
  $('zone').hidden = !connecte;
  if(!connecte) return;
  $('nomFichier').textContent = '« ' + cfg.chemin + ' »';
  $('historique').href = 'https://github.com/' + enc(cfg.owner) + '/' + enc(cfg.repo) + '/commits/' + enc(cfg.branche || 'main') + '/' + cfg.chemin.split('/').map(enc).join('/');
  const el = local ? local.elements : [];
  $('elements').innerHTML = el.length ? el.map(x => `<li><span class="corps"><span class="nom">${esc(x.texte)}</span>
      <span class="meta">ajouté sur ${esc(x.appareil || '?')}${x.quand ? ' · ' + esc(new Date(x.quand).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})) : ''}</span></span>
      <button type="button" data-suppr="${esc(x.id)}">Supprimer</button></li>`).join('')
    : '<li class="vide">Aucun élément pour l\'instant.</li>';
  const e = $('etatFichier');
  if(echecReseau && modifie) e.innerHTML = '<span class="att">Pas de réseau : tes modifications sont gardées ici et partiront au retour du réseau.</span>';
  else if(modifie) e.innerHTML = '<span class="att">Modifié ici, pas encore enregistré' + ($('auto').checked ? ' (enregistrement dans quelques secondes)' : '') + '.</span>';
  else if(distant === null) e.innerHTML = '<span class="att">Le fichier n\'existe pas encore sur GitHub : il sera créé au premier enregistrement.</span>';
  else if(distant) e.innerHTML = `<span class="ok">À jour avec GitHub</span> · version ${esc(court(distant.sha))}${distant.donnees.appareil ? ' · dernier enregistrement par ' + esc(distant.donnees.appareil) : ''}${distant.donnees.maj ? ' à ' + esc(heure(new Date(distant.donnees.maj))) : ''}`;
  else e.textContent = '';
}
$('elements').onclick = ev => {
  const b = ev.target.closest('[data-suppr]'); if(!b || !local) return;
  const x = local.elements.find(y => y.id === b.dataset.suppr); if(!x) return;
  local.elements = local.elements.filter(y => y !== x);
  journal('Supprimé ici : « ' + x.texte + ' »'); changer();
};
$('ajout').onsubmit = ev => {
  ev.preventDefault();
  const t = $('texte').value.trim(); if(!t || !local) return;
  local.elements.push({id:uid(), texte:t, appareil:cfg.appareil, quand:new Date().toISOString()});
  $('texte').value = ''; journal('Ajouté ici : « ' + t + ' »'); changer();
};
function changer(){
  modifie = true; afficher();
  clearTimeout(minuterie);
  if($('auto').checked) minuterie = setTimeout(() => enregistrer({auto:true}), 3000);
}
$('auto').onchange = () => { journal('Enregistrement automatique : ' + ($('auto').checked ? 'activé' : 'désactivé')); if($('auto').checked && modifie) changer(); else afficher(); };

/* ---------- Connexion ---------- */
function lireChamps(){
  cfg.owner = $('owner').value.trim(); cfg.repo = $('repo').value.trim(); cfg.chemin = $('chemin').value.trim().replace(/^\/+/, '') || 'test.json';
  cfg.appareil = $('appareil').value.trim() || cfg.appareil; cfg.jeton = $('jeton').value.trim();
}
function remplirChamps(){
  $('owner').value = cfg.owner || ''; $('repo').value = cfg.repo || ''; $('chemin').value = cfg.chemin || 'test.json';
  $('appareil').value = cfg.appareil || (/Android|iPhone|iPad/.test(navigator.userAgent) ? 'Téléphone' : 'PC'); $('jeton').value = cfg.jeton || '';
}
function etatCnx(html){ $('etatCnx').innerHTML = html; }
async function connecter({auto = false} = {}){
  if(!auto) lireChamps();
  cfg.appareil = cfg.appareil || $('appareil').value.trim() || 'Appareil';
  if(!/^[A-Za-z0-9-]{1,39}$/.test(cfg.owner || '')){ etatCnx('<span class="ko">Pseudo GitHub invalide.</span>'); return; }
  if(!/^[A-Za-z0-9._-]{1,100}$/.test(cfg.repo || '')){ etatCnx('<span class="ko">Nom de dépôt invalide.</span>'); return; }
  if(/(^|\/)\.\.?(\/|$)/.test(cfg.chemin) || !/\.json$/i.test(cfg.chemin)){ etatCnx('<span class="ko">Le fichier doit finir par .json (ex. test.json).</span>'); return; }
  if(!cfg.jeton){ etatCnx('<span class="ko">Colle ta clé GitHub.</span>'); return; }
  ecrireCfg();
  etatCnx('Connexion…');
  const t0 = performance.now(); let r;
  try { r = await gh(cheminDepot()); }
  catch(e){ etatCnx('<span class="ko">Pas de réponse de GitHub (réseau ?).</span>'); journal('Connexion : pas de réponse (' + e.name + ')'); return; }
  const ms = Math.round(performance.now() - t0);
  if(r.statut === 401){ etatCnx('<span class="ko">Clé refusée : mal copiée ou expirée.</span>'); journal('Connexion : clé refusée (401)'); return; }
  if(r.statut === 404 || r.statut === 403){ etatCnx('<span class="ko">Dépôt introuvable : vérifie le pseudo, le nom du dépôt, et que la clé a bien accès à ce dépôt.</span>'); journal('Connexion : dépôt introuvable ou non autorisé (' + r.statut + ')'); return; }
  if(!r.ok){ etatCnx('<span class="ko">Réponse inattendue de GitHub (' + r.statut + ').</span>'); journal('Connexion : réponse ' + r.statut); return; }
  cfg.branche = (r.donnees && r.donnees.default_branch) || 'main'; ecrireCfg();
  const prive = !!(r.donnees && r.donnees.private);
  etatCnx(`<span class="ok">Connecté à ${esc(cfg.owner)}/${esc(cfg.repo)}</span> · ${prive ? '<span class="ok">dépôt privé</span>' : '<span class="ko">ATTENTION : dépôt PUBLIC, tout le monde peut lire ce fichier</span>'}`);
  journal((auto ? 'Connexion automatique (rien à saisir)' : 'Connexion') + ' : dépôt ' + (prive ? 'privé' : 'PUBLIC') + ', en ' + ms + ' ms');
  connecte = true; afficher();
  await relire();
}
$('connecter').onclick = () => connecter();
$('appareil').onchange = () => { const n = $('appareil').value.trim(); if(!n) return; cfg.appareil = n; ecrireCfg(); majRapport(); journal('Nom de cet appareil : ' + n); };
$('oublier').onclick = () => {
  cfg.jeton = ''; ecrireCfg(); $('jeton').value = ''; connecte = false; afficher();
  etatCnx('Clé effacée de ce navigateur.'); journal('Clé effacée de ce navigateur');
};

/* ---------- Lecture ---------- */
async function lireDistant(){
  const r = await gh(cheminFichier());
  if(r.statut === 404) return {absent:true};
  if(!r.ok) throw new Error('réponse ' + r.statut);
  let texte = r.donnees.content ? depuisBase64(r.donnees.content) : '';
  if(!r.donnees.content && r.donnees.size > 0){ const b = await gh(cheminFichier(), {brut:true}); if(!b.ok) throw new Error('réponse ' + b.statut); texte = b.texte; }   /* plus de 1 Mo */
  let d; try { d = JSON.parse(texte); } catch{ throw new Error('le fichier n\'est pas un JSON valide'); }
  return {sha:r.donnees.sha, donnees:normaliser(d), taille:r.donnees.size};
}
async function relire({retour = false} = {}){
  if(occupe || !connecte) return;
  occupe = true; const t0 = performance.now();
  try {
    const v = await lireDistant(), ms = Math.round(performance.now() - t0);
    if(v.absent){
      distant = null; if(!local) local = neuf();
      journal('Lecture : le fichier n\'existe pas encore (' + ms + ' ms)');
    } else {
      const change = !distant || distant.sha !== v.sha;
      distant = {sha:v.sha, donnees:v.donnees};
      if(!modifie) local = clone(v.donnees);
      journal((retour ? 'Relecture au retour sur la page' : 'Lecture') + ' : version ' + court(v.sha) + ', ' + v.donnees.elements.length + ' élément(s), ' + taille(v.taille) + ', en ' + ms + ' ms'
        + (retour ? (change ? ' → NOUVELLE VERSION' + (v.donnees.appareil ? ' (enregistrée par ' + v.donnees.appareil + ')' : '') : ' → inchangée') : ''));
      if(change && modifie){ occupe = false; await conflit(v); return; }
    }
  } catch(e){ journal('Lecture impossible : ' + e.message); }
  occupe = false; afficher();
}
$('relire').onclick = () => relire();

/* ---------- Écriture ---------- */
async function enregistrer({auto = false} = {}){
  clearTimeout(minuterie);
  if(!modifie || !local || !connecte) return;
  if(occupe){ minuterie = setTimeout(() => enregistrer({auto}), 1000); return; }
  occupe = true;
  const donnees = {...local, maj:new Date().toISOString(), appareil:cfg.appareil};
  const texte = JSON.stringify(donnees, null, 2) + '\n';
  const corps = {message:'Test LIFE PANEL : ' + cfg.appareil + ', ' + donnees.elements.length + ' élément(s)', content:versBase64(texte), branch:cfg.branche || 'main'};
  if(distant) corps.sha = distant.sha;
  const t0 = performance.now(); let r;
  try { r = await gh(cheminFichier(), {method:'PUT', corps}); }
  catch(e){
    occupe = false; echecReseau = true; afficher();
    journal('Enregistrement impossible : pas de réseau (' + e.name + '). Modifications gardées ici.'); return;
  }
  echecReseau = false;
  const ms = Math.round(performance.now() - t0);
  if(r.statut === 409 || (r.statut === 422 && /sha/i.test(r.texte))){
    occupe = false;
    journal('Enregistrement REFUSÉ par GitHub : le fichier a été modifié ailleurs depuis ta dernière lecture (conflit détecté, rien n\'est écrasé)');
    try { const v = await lireDistant(); if(v.absent){ distant = null; changer(); return; } await conflit(v); } catch(e){ journal('Lecture après conflit impossible : ' + e.message); }
    return;
  }
  if(r.statut === 403 || r.statut === 404){
    occupe = false; afficher();
    journal('Écriture refusée (' + r.statut + ') : la clé doit avoir le droit « Contents : Read and write » sur ce dépôt'); $('etatFichier').innerHTML = '<span class="ko">Écriture refusée : la clé n\'a pas le droit d\'écrire dans ce dépôt.</span>'; return;
  }
  if(!r.ok){ occupe = false; afficher(); journal('Enregistrement : réponse inattendue ' + r.statut); return; }
  distant = {sha:r.donnees.content.sha, donnees:normaliser(donnees)}; local.maj = donnees.maj; local.appareil = donnees.appareil;
  modifie = false; occupe = false; afficher();
  journal('Enregistrement' + (auto ? ' automatique' : '') + ' : OK, version ' + court(distant.sha) + ' (' + taille(new TextEncoder().encode(texte).length) + ') en ' + ms + ' ms');
}
$('enregistrer').onclick = () => { if(!modifie){ journal('Rien à enregistrer : déjà à jour'); return; } enregistrer(); };

/* ---------- Conflit : l'autre appareil a enregistré entre-temps ---------- */
function conflit(v){
  clearTimeout(minuterie);
  const c = $('conflit'), d = v.donnees, quand = d.maj ? heure(new Date(d.maj)) : '?';
  c.hidden = false;
  c.innerHTML = `<p><b>${esc(d.appareil || 'Un autre appareil')}</b> a enregistré une autre version à ${esc(quand)}, alors que tu avais des modifications ici.</p>
    <p>Ici : ${local.elements.length} élément(s) · sur GitHub : ${d.elements.length} élément(s).</p>
    <div class="boutons"><button type="button" id="prendre">Prendre la version de GitHub</button><button type="button" class="p" id="garder">Garder la mienne</button></div>
    <p class="aide" style="margin:10px 0 0">« Garder la mienne » remplace la version de GitHub ; elle reste récupérable dans l'historique.</p>`;
  journal('Fenêtre de conflit affichée (ici ' + local.elements.length + ' élément(s), GitHub ' + d.elements.length + ')');
  $('prendre').onclick = () => {
    local = clone(d); distant = {sha:v.sha, donnees:d}; modifie = false; c.hidden = true; afficher();
    journal('Conflit réglé : version de GitHub prise (modifications d\'ici abandonnées)');
  };
  $('garder').onclick = () => {
    distant = {sha:v.sha, donnees:d}; c.hidden = true; modifie = true;
    journal('Conflit réglé : ma version va remplacer celle de GitHub'); enregistrer();
  };
  afficher();
}

/* ---------- Retour sur la page, retour du réseau, départ ---------- */
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && connecte && $('conflit').hidden) relire({retour:true}); });
window.addEventListener('online', () => { if(modifie && connecte){ journal('Réseau revenu : nouvel essai d\'enregistrement'); enregistrer({auto:true}); } });
window.addEventListener('beforeunload', e => { if(modifie){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- Démarrage : connexion automatique si la clé est déjà là ---------- */
remplirChamps(); majRapport();
journal('Page ouverte' + (location.protocol === 'https:' ? '' : ' (' + location.protocol + ')'));
if(cfg.owner && cfg.repo && cfg.jeton) connecter({auto:true});
</script>
</body>
</html>
