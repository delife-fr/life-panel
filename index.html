/* ==========================================================================
   P. SYNCHRONISATION GITHUB — les mêmes données sur le PC et le téléphone
   donnees.json vit dans un dépôt GitHub PRIVÉ. Chaque appareil a sa clé, gardée dans ce navigateur
   (jamais dans les données, les exports ni les copies). Lecture à l'ouverture, au retour sur la page et
   toutes les 30 secondes tant que la page est affichée (une vérification sans changement reçoit « 304 » :
   rien n'est téléchargé et GitHub ne la compte pas dans son quota) ; écriture quelques secondes après la dernière modification.
   Protection contre la double modification : GitHub refuse d'écrire si le fichier a changé depuis la
   dernière lecture (sha). On relit, on fusionne avec la « base » (dernière version synchronisée), on réessaie.
   ========================================================================== */
const GH_API = window.__API_GITHUB__ || 'https://api.github.com';   /* __API_GITHUB__ : uniquement pour les tests */
const gh = {cfg:null, sha:null, base:null, lu:null, etat:'aucun', erreur:'', faiteA:null, enCours:null, aRefaire:false, t:null, controle:0,
  attente:false, hors:false, apresModale:false, message:''};
const ghActif = () => !!(gh.cfg && gh.cfg.jeton) && !DB.reglages.demo;
const cleDepot = c => c.owner + '/' + c.repo + '/' + c.chemin;
const appareilParDefaut = () => /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Téléphone' : 'PC';
class ErreurGitHub extends Error { constructor(code, message){ super(message); this.code = code; } }
/* Texte ↔ base64, en UTF-8 (accents, émojis). Fonctions natives du navigateur quand elles existent
   (Chromium 140+ : ~35 fois plus rapides, la page ne se fige plus à l'envoi), sinon conversion à la main. */
function versBase64(t){
  const o = new TextEncoder().encode(t);
  if(typeof o.toBase64 === 'function') return o.toBase64();
  let b = '';
  for(let i = 0; i < o.length; i += 0x8000) b += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000));
  return btoa(b);
}
function depuisBase64(b64){
  const s = String(b64).replace(/\s/g, '');
  if(typeof Uint8Array.fromBase64 === 'function') return new TextDecoder().decode(Uint8Array.fromBase64(s));
  const b = atob(s), o = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i);
  return new TextDecoder().decode(o);
}
async function ghAppel(chemin, {method = 'GET', corps = null, brut = false, cfg = gh.cfg, etag = ''} = {}){
  const ctrl = new AbortController(), minuterie = setTimeout(() => ctrl.abort(), 30000);
  try {
    const h = {'Authorization':'Bearer ' + cfg.jeton, 'Accept':brut ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
    if(corps) h['Content-Type'] = 'application/json';
    if(etag) h['If-None-Match'] = etag;   /* GitHub répond 304 sans contenu si rien n'a changé (et ne le compte pas dans son quota) */
    let r;
    try { r = await fetch(GH_API + chemin, {method, cache:'no-store', headers:h, body:corps ? JSON.stringify(corps) : null, signal:ctrl.signal}); }   /* jamais de cache du navigateur : toujours la dernière version */
    catch(e){ const x = new Error('pas de réseau'); x.name = 'HorsLigne'; throw x; }
    const texte = await r.text(); let donnees = null;
    if(!brut){ try { donnees = texte ? JSON.parse(texte) : null; } catch(e){ donnees = null; } }
    return {statut:r.status, ok:r.ok, donnees, texte, etag:r.headers.get('ETag') || ''};
  } finally { clearTimeout(minuterie); }
}
const ghDepot = (c = gh.cfg) => '/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo);
const ghFichier = (c = gh.cfg) => ghDepot(c) + '/contents/' + c.chemin.split('/').map(encodeURIComponent).join('/');
function erreurStatut(r){
  if(r.statut === 401) return new ErreurGitHub('cle', 'GitHub refuse la clé (mal copiée ou expirée).');
  if(r.statut === 403 && /rate limit/i.test(r.texte)) return new ErreurGitHub('limite', 'Trop de demandes à GitHub : nouvel essai dans quelques minutes.');
  if(r.statut === 403 || r.statut === 404) return new ErreurGitHub('acces', 'GitHub refuse l’accès : vérifie le dépôt et que la clé a le droit « Contents : Read and write ».');
  return new ErreurGitHub('reponse', 'Réponse inattendue de GitHub (' + r.statut + ').');
}
/* {absent} ou {sha, d (données normalisées), R (d en texte), par ({appareil, le} : qui a écrit)}.
   Dernière lecture gardée en mémoire (gh.lu) : si GitHub répond « inchangé » (304), on la réutilise sans rien télécharger.
   Au-delà de 1 Mo, GitHub ne joint pas le contenu : on le lit par l'identifiant (sha) de cette version précise,
   jamais « la dernière version » (un autre appareil a pu écrire entre les deux demandes). */
async function ghLire(cfg = gh.cfg){
  const lu = gh.lu && gh.lu.cle === cleDepot(cfg) ? gh.lu : null;
  const r = await ghAppel(ghFichier(cfg), {cfg, etag:lu ? lu.etag : ''});
  if(r.statut === 304 && lu) return {sha:lu.sha, d:JSON.parse(lu.R), R:lu.R, par:lu.par};
  if(r.statut === 404){ gh.lu = null; return {absent:true}; }
  if(!r.ok || !r.donnees) throw erreurStatut(r);
  let texte = r.donnees.content ? depuisBase64(r.donnees.content) : '';
  if(!r.donnees.content && r.donnees.size > 0){ const b = await ghAppel(ghDepot(cfg) + '/git/blobs/' + encodeURIComponent(r.donnees.sha), {brut:true, cfg}); if(!b.ok) throw erreurStatut(b); texte = b.texte; }
  let brut = null; try { brut = JSON.parse(texte); } catch(e){ brut = null; }
  if(!brut || typeof brut !== 'object' || Array.isArray(brut)) throw new ErreurGitHub('illisible', `Le fichier ${cfg.chemin} sur GitHub n’est pas une sauvegarde LIFE PANEL lisible : rien n’a été modifié.`);
  /* Écrit par une version plus récente : cette page effacerait ses nouveautés en réécrivant le fichier */
  if(Number(brut.version) > VERSION) throw new ErreurGitHub('version', 'Tes données ont été enregistrées par une version plus récente de LIFE PANEL : recharge la page (F5) pour la mettre à jour. Rien n’a été envoyé.');
  const par = brut.synchro && typeof brut.synchro === 'object' ? {appareil:txt(brut.synchro.appareil), le:txt(brut.synchro.le)} : null;
  const d = normaliser(brut); d.reglages.demo = false;   /* jamais de mode démo venu d'ailleurs */
  const R = JSON.stringify(d);
  gh.lu = r.etag ? {cle:cleDepot(cfg), etag:r.etag, sha:r.donnees.sha, R, par} : null;
  return {sha:r.donnees.sha, d, R, par};
}
/* Écrit d (déjà normalisé) ; {conflit} si GitHub refuse parce que le fichier a changé depuis la version sha */
async function ghEcrire(d, sha, cfg = gh.cfg){
  if(d.reglages && d.reglages.demo) throw new ErreurGitHub('demo', 'Mode démo : rien n’est envoyé sur GitHub.');   /* la démo ne part jamais */
  const texte = JSON.stringify({...d, synchro:{appareil:cfg.appareil || '', le:maintenant()}}, null, 2) + '\n';
  const corps = {message:'LIFE PANEL · ' + (cfg.appareil || 'appareil') + ' · ' + resume(d), content:versBase64(texte), branch:cfg.branche || 'main'};
  if(sha) corps.sha = sha;
  const r = await ghAppel(ghFichier(cfg), {method:'PUT', corps, cfg});
  if(r.statut === 409 || (r.statut === 422 && /sha/i.test(r.texte))) return {conflit:true};
  if(!r.ok) throw erreurStatut(r);
  return {sha:r.donnees && r.donnees.content ? r.donnees.content.sha : null};
}
function ghNouvelleBase(sha, texte){
  gh.sha = sha; gh.base = texte;
  if(stockage.idb && gh.cfg) idbEcrire('github-base', {sha, texte, depot:cleDepot(gh.cfg)}).catch(() => {});
}
/* Données reçues de GitHub (ou fusionnées) : dans le navigateur et le dossier relié, sans renvoi vers GitHub */
let rendreApresModale = false, rendreApresSaisie = false;
/* Un champ de la page est en cours de saisie (Inbox, filtre, élément de contact…) : on ne redessine pas sous les doigts */
const saisieEnCours = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#vue') && (a.matches('input, textarea, select') || a.isContentEditable)); };
function appliquerDistant(d){
  DB = normaliser(d); versionDonnees++;
  enregistrerNavigateur(JSON.stringify(DB));
  planifierEcritureDossier(); majPied();

  else if(saisieEnCours()) rendreApresSaisie = true;

const deQui = par => par && par.appareil ? par.appareil : 'ton autre appareil';

/* --- Fusion à trois : base (dernière version synchronisée), moi (ce navigateur), eux (GitHub) ---
   Élément par élément (identifiant), puis champ par champ :
   · changé d'un seul côté → on garde ce changement (ajout, modification ou suppression) ;
   · changé des deux côtés sur des champs différents → on garde les deux ;
   · même champ changé des deux côtés (vrai conflit) → la version la plus récente gagne, l'autre va dans
     la corbeille (« version remplacée ») ; les dates techniques (modif, archivage…) ne comptent pas ;
   · supprimé d'un côté mais modifié de l'autre → on garde la version modifiée. */
const CHAMPS_TECHNIQUES = new Set(['modif', 'archiveLe', 'faitLe', 'maj', 'supprimeLe', 'lastReview', 'archived']);
const pareil = (a, b) => a === b || JSON.stringify(a) === JSON.stringify(b);
/* Même contenu hors dates techniques et archivage automatique (pour « supprimé d'un côté, modifié de l'autre ») */
const sansTechnique = x => estObjet(x) ? Object.fromEntries(Object.entries(x).filter(([k]) => !CHAMPS_TECHNIQUES.has(k) && k !== 'archive')) : x;
const pareilSurLeFond = (a, b) => pareil(sansTechnique(a), sansTechnique(b));
const estObjet = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const tableauSimple = v => Array.isArray(v) && v.every(x => x === null || typeof x !== 'object');
function fusionEnsemble(b, m, e){
  const B = Array.isArray(b) ? b : [], dans = (l, x) => l.some(y => pareil(y, x));
  const r = m.filter(x => !(dans(B, x) && !dans(e, x)));   /* retiré par eux */
  e.forEach(x => { if(!dans(r, x) && !dans(B, x)) r.push(x); });   /* ajouté par eux */
  return r;
}
function fusionner(base, moi, eux){
  let conflits = 0; const remplacees = [];
  const mm = (moi.reglages && moi.reglages.maj) || '', me = (eux.reglages && eux.reglages.maj) || '';
  const global = mm >= me ? 'moi' : 'eux';
  const dateDe = x => estObjet(x) ? String(x.modif || x.supprimeLe || x.archived || x.created || x.cree || x.ajoute || '') : '';
  function valeur(b, m, e, gagnant, cle, info){
    if(pareil(m, e)) return m;
    if(pareil(m, b)) return e;
    if(pareil(e, b)) return m;
    if(tableauSimple(m) && tableauSimple(e)) return fusionEnsemble(b, m, e);
    if(Array.isArray(m) && Array.isArray(e) && [...m, ...e].every(x => estObjet(x) && typeof x.t === 'string')) return liste(b, m, e, x => x.t, null);   /* « À lui dire », « À répondre », « Idées » */
    if(estObjet(m) && estObjet(e)) return objet(estObjet(b) ? b : {}, m, e, gagnant, info);
    if(!CHAMPS_TECHNIQUES.has(cle)) info.conflit = true;
    return gagnant === 'moi' ? m : e;
  }
  function objet(b, m, e, gagnant, info){
    const r = {};
    [...Object.keys(m), ...Object.keys(e).filter(k => !(k in m))].forEach(k => { const v = valeur(b[k], m[k], e[k], gagnant, k, info); if(v !== undefined) r[k] = v; });
    return r;
  }
  function liste(bl, ml, el, cle, type){
    const tab = l => Array.isArray(l) ? l : [];
    const B = new Map(tab(bl).map(x => [cle(x), x])), M = new Map(tab(ml).map(x => [cle(x), x])), E = new Map(tab(el).map(x => [cle(x), x]));
    const garder = k => {
      const b = B.get(k), m = M.get(k), e = E.get(k);
      if(m && e){
        if(pareil(m, e)) return m;
        if(b && pareil(m, b)) return e;
        if(b && pareil(e, b)) return m;
        const dm = dateDe(m), de = dateDe(e), gagnant = dm !== de ? (dm > de ? 'moi' : 'eux') : global, info = {conflit:false};
        const x = objet(b || {}, m, e, gagnant, info);
        if(info.conflit && type && base){ conflits++; remplacees.push({type, element:gagnant === 'moi' ? e : m}); }   /* comptés seulement s'ils sont gardés (sans base commune : pas de corbeille) */
        return x;
      }
      if(m) return !b || !pareilSurLeFond(m, b) ? m : null;   /* ajouté ici, ou vraiment modifié ici alors qu'il a été supprimé ailleurs ; sinon supprimé ailleurs */
      if(e) return !b || !pareilSurLeFond(e, b) ? e : null;
      return null;
    };
    /* Ordre : celui d'ici ; ce qui a été ajouté ailleurs se glisse après son voisin (Inbox : en tête) */
    const res = [], cles = new Set();
    tab(ml).forEach(x => { const k = cle(x), v = garder(k); if(v){ res.push({k, v}); cles.add(k); } });
    let prec = null;
    tab(el).forEach(x => { const k = cle(x);
      if(!M.has(k)){ const v = garder(k); if(v){ const i = prec === null ? -1 : res.findIndex(o => o.k === prec); res.splice(i + 1, 0, {k, v}); cles.add(k); prec = k; } }
      else if(cles.has(k)) prec = k; });
    return res.map(o => o.v);
  }
  const b = base || {}, r = {version:VERSION}, info = {conflit:false};
  r.prenom = valeur(b.prenom, moi.prenom, eux.prenom, global, 'prenom', info);
  LISTES_DONNEES.forEach(k => { r[k] = liste(b[k], moi[k], eux[k], x => x.id, k); });
  r.corbeille = liste(b.corbeille, moi.corbeille, eux.corbeille, x => x.id, null);
  r.categories = valeur(b.categories, moi.categories, eux.categories, global, 'categories', info);
  r.couleursCategories = liste(b.couleursCategories, moi.couleursCategories, eux.couleursCategories, x => cleNom(x.nom), null);
  r.comptes = liste(b.comptes, moi.comptes, eux.comptes, x => cleNom(x.nom), null);
  r.reglages = objet(estObjet(b.reglages) ? b.reglages : {}, moi.reglages, eux.reglages, global, info);
  /* Nouvelle version, datée après les deux (même si les horloges des appareils diffèrent) : les autres onglets ouverts la reçoivent (ils ignorent une date déjà vue) */
  const plusTard = [maintenant(), mm, me].sort().pop();
  r.reglages.maj = plusTard === mm || plusTard === me ? new Date(Date.parse(plusTard) + 1).toISOString() : plusTard;
  r.reglages.demo = false;
  remplacees.forEach(x => r.corbeille.unshift({id:uid(), type:x.type, supprimeLe:maintenant(), element:JSON.parse(JSON.stringify(x.element)), remplacee:true}));
  return {d:normaliser(r), conflits};
}

/* --- Un cycle de synchronisation (jamais deux en même temps) --- */
function ghSynchroniser(raison = 'manuel'){
  if(!ghActif()) return Promise.resolve(false);
  clearTimeout(gh.t); gh.attente = false;
  if(gh.enCours){ gh.aRefaire = true; return gh.enCours; }
  gh.enCours = (async () => {
    try {
      const r = await ghCycle(raison);
      gh.erreur = ''; gh.hors = false;
      if(r !== 'reporte' && r !== 'annule'){ gh.etat = 'ok'; gh.faiteA = new Date(); }
      return true;
    } catch(e){
      if(e instanceof ErreurGitHub){ gh.erreur = e.message; gh.etat = 'erreur'; gh.hors = false;
        if(e.code === 'limite'){ clearTimeout(gh.t); gh.t = setTimeout(() => ghSynchroniser('reprise'), 5 * 60000); } }
      else if(e && e.name === 'HorsLigne'){ gh.hors = true; gh.etat = 'ok'; }   /* pas de réseau : on réessaiera */
      else { console.error(e); gh.erreur = 'Synchronisation interrompue : ' + ((e && e.message) || e) + '.'; gh.etat = 'erreur'; }
      return false;
    } finally {
      gh.enCours = null; gh.controle = Date.now();
      if(gh.aRefaire){ gh.aRefaire = false; setTimeout(() => ghSynchroniser('suite'), 50); }
      majIndicateur(); majPied();
    }
  })();
  majIndicateur(); majPied();
  return gh.enCours;
}
async function ghCycle(raison){
  const cfg = gh.cfg;
  /* Après chaque attente : la synchro a pu être arrêtée, ou la démo chargée entre-temps → on abandonne */
  const toujours = () => ghActif() && gh.cfg === cfg;
  for(let essai = 0; essai < 5; essai++){
    /* Écriture ordinaire : on suppose que GitHub a toujours la version de base (s'il refuse, on relit et on fusionne) */
    const rapide = essai === 0 && raison === 'ecriture' && gh.sha && gh.base !== null;
    const r = rapide ? null : await ghLire(cfg);
    if(!toujours()) return 'annule';
    const L = JSON.stringify(normaliser(DB));
    if(rapide){
      if(L === gh.base) return 'rien';
      const w = await ghEcrire(JSON.parse(L), gh.sha, cfg); if(!toujours()) return 'annule'; if(w.conflit) continue;
      ghNouvelleBase(w.sha, L); return 'envoye';
    }
    if(r.absent){   /* fichier absent (supprimé sur GitHub ?) : on le recrée avec les données d'ici */
      if(!aDesDonnees(DB)) return 'rien';
      const w = await ghEcrire(JSON.parse(L), null, cfg); if(!toujours()) return 'annule'; if(w.conflit) continue;
      ghNouvelleBase(w.sha, L); return 'cree';
    }
    const R = r.R, B = gh.base;
    if(R === L){ ghNouvelleBase(r.sha, R); return 'ajour'; }
    if(B !== null && R === B){   /* rien de changé ailleurs : on envoie */
      const w = await ghEcrire(JSON.parse(L), r.sha, cfg); if(!toujours()) return 'annule'; if(w.conflit) continue;
      ghNouvelleBase(w.sha, L); return 'envoye';
    }
    /* Changé ailleurs : jamais pendant qu'une fenêtre est ouverte (un formulaire garde des éléments en main) */
    if(modaleOuverte()){ gh.apresModale = true; return 'reporte'; }
    if(!aDesDonnees(r.d) && aDesDonnees(DB)) throw new ErreurGitHub('vide', `Le fichier ${gh.cfg.chemin} sur GitHub ne contient aucune donnée : rien n’a été remplacé ici. Vérifie le dépôt (son historique garde les versions précédentes).`);
    if(B !== null && L === B){   /* rien de changé ici : on prend la version de GitHub */
      appliquerDistant(r.d); ghNouvelleBase(r.sha, R);
      toast('Mis à jour avec les modifications de ' + deQui(r.par) + (r.par && r.par.le ? ' (' + heure(new Date(r.par.le)) + ')' : ''));
      return 'recu';
    }
    /* Changé des deux côtés : fusion, puis envoi du résultat */
    const f = fusionner(B !== null ? JSON.parse(B) : null, JSON.parse(L), r.d);
    appliquerDistant(f.d);
    const M = JSON.stringify(normaliser(DB));
    const w = await ghEcrire(JSON.parse(M), r.sha, cfg);
    if(!toujours()) return 'annule';
    if(w.conflit){ gh.base = R; gh.sha = r.sha; continue; }   /* encore changé entre-temps : R devient la base commune */
    ghNouvelleBase(w.sha, M);
    toast('Synchronisé : tes modifications et celles de ' + deQui(r.par) + ' ont été fusionnées' +
      (f.conflits ? ` · ${pluriel(f.conflits, 'version remplacée', 'versions remplacées')} (même élément modifié sur les deux) : dans la corbeille` : ''));
    return 'fusion';
  }
  throw new ErreurGitHub('conflits', 'Le fichier change sans arrêt sur GitHub : synchronisation remise à plus tard.');
}
function planifierGitHub(){
  if(!ghActif()) return;
  clearTimeout(gh.t); gh.attente = true;
  gh.t = setTimeout(() => ghSynchroniser('ecriture'), 2500);
}
/* Des modifications d'ici ne sont pas encore sur GitHub */
const ghEnAttente = () => ghActif() && (gh.attente || !!gh.enCours || (gh.base !== null && JSON.stringify(normaliser(DB)) !== gh.base));
function etatGitHub(){
  if(gh.enCours || gh.attente) return 'cours';
  if(gh.etat === 'erreur') return 'erreur';
  if(gh.hors) return 'hors';
  return 'ok';

const TEXTES_GITHUB = {

  cours:() => gh.enCours ? 'Synchronisation avec GitHub…' : 'Modifications en attente d’envoi vers GitHub…',

async function initGitHub(){

  if(!cfg || !cfg.jeton) return;
  gh.cfg = cfg; gh.etat = 'ok';
  if(base && base.depot === cleDepot(cfg) && typeof base.texte === 'string'){
    /* Base gardée par une version précédente de LIFE PANEL : remise au format actuel, sinon elle ne ressemblerait
       plus aux données relues (ex. v3.13 → v3.14 : « modif » ajouté aux mouvements) et tout passerait par une fusion */
    let texte = base.texte; try { texte = JSON.stringify(normaliser(JSON.parse(base.texte))); } catch(e){}
    gh.sha = base.sha; gh.base = texte;
  }
  ghSynchroniser('ouverture');
}

/* Première connexion d'un appareil (page Données). Renvoie un message d'erreur, ou '' */
async function ghConnecter(v){
  const cfg = {owner:v.owner, repo:v.repo, chemin:cheminDrive(v.chemin) || 'donnees.json', appareil:v.appareil || appareilParDefaut(), jeton:v.jeton, branche:'main'};
  if(!/^[A-Za-z0-9-]{1,39}$/.test(cfg.owner)) return 'Pseudo GitHub invalide.';
  if(!/^[A-Za-z0-9._-]{1,100}$/.test(cfg.repo)) return 'Nom de dépôt invalide.';
  if(!/\.json$/i.test(cfg.chemin)) return 'Le fichier doit finir par .json (par exemple donnees.json).';
  if(!cfg.jeton) return 'Colle ta clé GitHub.';
  if(DB.reglages.demo) return 'Mode démo : reviens d’abord à tes données (bouton « Revenir à mes données »).';
  let r;
  try { r = await ghAppel(ghDepot(cfg), {cfg}); } catch(e){ return e && e.name === 'HorsLigne' ? 'Pas de réponse de GitHub (réseau ?).' : 'Connexion impossible : ' + ((e && e.message) || e); }
  if(r.statut === 401) return 'GitHub refuse la clé : mal copiée ou expirée.';
  if(r.statut === 403 || r.statut === 404) return 'Dépôt introuvable : vérifie le pseudo, le nom du dépôt, et que la clé a bien accès à ce dépôt.';
  if(!r.ok || !r.donnees) return 'Réponse inattendue de GitHub (' + r.statut + ').';
  if(!r.donnees.private) return 'Ce dépôt est PUBLIC : tes données y seraient lisibles par tout le monde. Utilise un dépôt privé.';
  cfg.branche = r.donnees.default_branch || 'main';
  let dist;
  try { dist = await ghLire(cfg); } catch(e){ return e.message || 'Lecture impossible sur GitHub.'; }
  let base = null, sha = null;
  const L = JSON.stringify(normaliser(DB));
  try {
    if(dist.absent){
      if(!aDesDonnees(DB)) return 'Ni ce navigateur ni le dépôt ne contiennent de données : importe d’abord tes données (ou relie ton dossier LIFE PANEL), puis connecte-toi.';
      if(!await confirmer({titre:'Envoyer tes données sur GitHub ?', danger:false, ok:'Envoyer',
        texte:`Le dépôt privé <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b> ne contient pas encore <code>${esc(cfg.chemin)}</code>. Y envoyer les données de ce navigateur (${esc(resume(DB))}) ?`})) return '';
      const w = await ghEcrire(JSON.parse(L), null, cfg); if(w.conflit) return 'Le fichier vient d’être créé depuis un autre appareil : recommence.';
      base = L; sha = w.sha;
    } else {
      const R = dist.R;
      if(R === L){ base = R; sha = dist.sha; }
      else {
        const prendre = !aDesDonnees(DB) ? 'github' : await choisir({titre:'Quelles données garder ?', options:[{v:'navigateur', t:'Garder celles de ce navigateur'}, {v:'github', t:'Prendre celles de GitHub', p:true}],
          texte:`GitHub contient ${esc(resume(dist.d))}${derniereModif(dist.d) ? ', modifiées ' + esc(ilya(derniereModif(dist.d))) : ''}.<br>Ce navigateur contient ${esc(resume(DB))}${derniereModif(DB) ? ', modifiées ' + esc(ilya(derniereModif(DB))) : ''}.<br><br>Sur un deuxième appareil, prends celles de GitHub. Rien n’est perdu : l’autre version reste en copie de secours ici, et dans l’historique du dépôt.`});
        if(!prendre) return '';
        if(prendre === 'github'){ faireSecours('avant la connexion à GitHub'); appliquerDistant(dist.d); base = R; sha = dist.sha; }
        else { const w = await ghEcrire(JSON.parse(L), dist.sha, cfg); if(w.conflit) return 'Le fichier a changé pendant la connexion : recommence.'; base = L; sha = w.sha; }
      }
    }
  } catch(e){ return (e && e.message) || 'Écriture impossible sur GitHub.'; }
  gh.cfg = cfg; gh.erreur = ''; gh.hors = false; gh.etat = 'ok'; gh.faiteA = new Date();
  ghNouvelleBase(sha, base);
  try { await idbEcrire('github', cfg); } catch(e){ toast('Ce navigateur n’a pas pu garder la clé : il faudra la ressaisir à la prochaine ouverture.'); }
  rendre(); toast('Synchronisation GitHub activée sur cet appareil (' + cfg.appareil + ')'); initNotif();
  if(JSON.stringify(normaliser(DB)) !== gh.base) planifierGitHub();
  return '';
}

/* ==========================================================================
   Q. NOTIFICATIONS — rappels (résumé du matin, tâches à l'heure, anniversaires, documents)
   Ils sont envoyés par GitHub Actions depuis le dépôt privé (notifications/rappels.js, toutes les 30 min),
   et affichés par Android ou Windows comme ceux d'une appli, même LIFE PANEL fermée.
   Ici : la clé de l'expéditeur (créée une fois : la partie publique va dans le dépôt, la partie secrète est
   montrée une seule fois pour être rangée dans les secrets GitHub, jamais gardée), l'inscription de cet appareil
   (notifications/appareils.json : adresse de notification, fuseau horaire, mode) et le fuseau tenu à jour.
   ========================================================================== */
const NOTIF = {cle:'notifications/cle-publique.txt', appareils:'notifications/appareils.json', workflow:'rappels.yml'};
const notif = {id:null, cle:'', entree:null, charge:false, perdu:false, erreur:'', enCours:false};
const notifDispo = () => location.protocol !== 'file:' && !!window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64urlVersOctets = s => { const t = String(s).replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(t + '==='.slice((t.length + 3) % 4)), c => c.charCodeAt(0)); };
const octetsVersB64url = o => btoa(String.fromCharCode(...new Uint8Array(o))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fuseauIci = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Paris'; } catch(e){ return 'Europe/Paris'; } };
const MODES_NOTIF = [{v:'tout', t:'Tout : résumé du matin et rappels des tâches'}, {v:'resume', t:'Seulement le résumé du matin'}, {v:'rien', t:'Rien (en pause)'}];
/* Fichiers texte du dépôt privé (à côté de donnees.json) */
const ghContenu = chemin => ghDepot() + '/contents/' + chemin.split('/').map(encodeURIComponent).join('/');
async function ghLireTexte(chemin){
  const r = await ghAppel(ghContenu(chemin));
  if(r.statut === 404) return null;
  if(!r.ok || !r.donnees) throw erreurStatut(r);
  return {sha:r.donnees.sha, texte:depuisBase64(r.donnees.content || '')};
}
async function ghEcrireTexte(chemin, texte, sha, message){
  const corps = {message, content:versBase64(texte), branch:gh.cfg.branche || 'main'}; if(sha) corps.sha = sha;
  const r = await ghAppel(ghContenu(chemin), {method:'PUT', corps});
  if(r.statut === 409 || (r.statut === 422 && /sha/i.test(r.texte))) return false;   /* changé entre-temps */
  if(!r.ok) throw erreurStatut(r);
  return true;
}
/* Modifie la liste des appareils ; si elle a changé entre-temps (autre appareil, GitHub Actions), on relit et on recommence */
async function majAppareils(f){
  for(let essai = 0; essai < 4; essai++){
    const l = await ghLireTexte(NOTIF.appareils); let liste = {appareils:[]};
    if(l){ try { liste = JSON.parse(l.texte) || liste; } catch(e){} }
    if(!Array.isArray(liste.appareils)) liste.appareils = [];
    const avant = JSON.stringify(liste); f(liste);
    if(JSON.stringify(liste) === avant) return liste;
    if(await ghEcrireTexte(NOTIF.appareils, JSON.stringify(liste, null, 2) + '\n', l && l.sha, 'LIFE PANEL · notifications · ' + (gh.cfg.appareil || 'appareil'))) return liste;
  }
  throw new ErreurGitHub('conflits', 'La liste des appareils change sans arrêt sur GitHub : réessaie dans un instant.');
}
const abonnementDe = sub => { const j = sub.toJSON(); return {endpoint:j.endpoint, keys:{p256dh:j.keys.p256dh, auth:j.keys.auth}}; };
/* À l'ouverture (et au retour sur la page après un voyage) : état de cet appareil, fuseau et adresse tenus à jour */
async function initNotif(){
  if(!notifDispo() || !ghActif()) return;
  try {
    if(!notif.id && stockage.idb) notif.id = await idbLire('notif-id');
    const c = await ghLireTexte(NOTIF.cle); notif.cle = c ? c.texte.trim() : '';
    const l = await ghLireTexte(NOTIF.appareils); let liste = [];
    try { liste = l ? (JSON.parse(l.texte).appareils || []) : []; } catch(e){}
    notif.entree = notif.id ? liste.find(a => a && a.id === notif.id) || null : null;
    notif.charge = true; notif.erreur = ''; notif.perdu = false;
    if(notif.entree){
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
      if(!sub || Notification.permission !== 'granted') notif.perdu = true;   /* autorisation retirée : on le signale */
      else {
        const ab = abonnementDe(sub), fuseau = fuseauIci(), nom = gh.cfg.appareil || notif.entree.nom;
        if(notif.entree.fuseau !== fuseau || notif.entree.abonnement.endpoint !== ab.endpoint || notif.entree.nom !== nom){
          await majAppareils(x => { const a = x.appareils.find(y => y.id === notif.id); if(a) Object.assign(a, {fuseau, abonnement:ab, nom, maj:maintenant()}); });
          notif.entree = {...notif.entree, fuseau, abonnement:ab, nom};
        }
      }
    }
  } catch(e){ notif.erreur = (e && e.message) || String(e); }
  if(lireRoute().nom === 'donnees' && !modaleOuverte() && !saisieEnCours()) rendre();
}
/* Une fois pour toutes : clé de l'expéditeur des notifications (ECDSA P-256, créée dans ce navigateur) */
async function notifPreparer(){
  if(notif.cle && !await confirmer({titre:'Créer une nouvelle clé ?', ok:'Créer une nouvelle clé',
    texte:'Une clé existe déjà. Avec une nouvelle clé, il faudra remplacer le secret <code>VAPID_PRIVEE</code> sur GitHub et réactiver les notifications sur chaque appareil. À faire seulement si la clé secrète a été perdue.'})) return;
  const k = await crypto.subtle.generateKey({name:'ECDSA', namedCurve:'P-256'}, true, ['sign', 'verify']);
  const jwk = await crypto.subtle.exportKey('jwk', k.privateKey);
  const publique = octetsVersB64url(new Uint8Array([4, ...b64urlVersOctets(jwk.x), ...b64urlVersOctets(jwk.y)]));
  const l = await ghLireTexte(NOTIF.cle);
  if(!await ghEcrireTexte(NOTIF.cle, publique + '\n', l && l.sha, 'LIFE PANEL · clé publique des notifications')) throw new ErreurGitHub('conflits', 'La clé vient d’être modifiée depuis un autre appareil : recharge la page.');
  notif.cle = publique; notif.entree = null;
  const c = gh.cfg, secrets = `https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/settings/secrets/actions/new`;
  ouvrirModale(teteModale('Dernière étape sur GitHub', 'alerte', 'jaune') + `<p class="texte">La clé publique est dans ton dépôt. Range maintenant la <b>clé secrète</b> ci-dessous dans les secrets du dépôt : elle ne sera plus jamais affichée, et LIFE PANEL ne la garde pas.</p>
    <ol class="texte" style="padding-left:20px"><li>Ouvre <a href="${esc(secrets)}" target="_blank" rel="noopener noreferrer">Settings → Secrets → Actions → New repository secret</a>.</li>
      <li><b>Name</b> : <code>VAPID_PRIVEE</code></li><li><b>Secret</b> : colle la clé, puis « Add secret ».</li></ol>
    <label class="champ"><span>Clé secrète</span><input id="cle-secrete" readonly spellcheck="false" value="${esc(jwk.d)}" style="font-family:var(--mono);font-size:13px"></label>
    <div class="actions"><button type="button" class="btn" id="copier-cle">${ico('check', 14)}Copier la clé</button><button type="button" class="btn p" data-action="fermer">C’est fait</button></div>`, {saisie:false});
  $('#copier-cle').onclick = async () => { const i = $('#cle-secrete'); let ok = false;
    try { await navigator.clipboard.writeText(i.value); ok = true; } catch(e){ i.select(); try { ok = document.execCommand('copy'); } catch(e2){} }
    toast(ok ? 'Clé copiée : colle-la dans GitHub' : 'Sélectionne la clé et copie-la à la main'); };
  surFermeture = () => rendre();
}
/* Inscription de cet appareil */
async function notifActiver(){
  if(!notif.cle){ toast('Prépare d’abord les notifications (une seule fois, depuis n’importe quel appareil).'); return; }
  const p = await Notification.requestPermission();
  if(p !== 'granted'){ toast(p === 'denied' ? 'Notifications bloquées : autorise-les dans les réglages du navigateur pour LIFE PANEL, puis réessaie.' : 'Notifications non autorisées.'); return; }
  const reg = await navigator.serviceWorker.ready; let sub = await reg.pushManager.getSubscription();
  if(sub){ const k = sub.options && sub.options.applicationServerKey; if(!k || octetsVersB64url(k) !== notif.cle){ await sub.unsubscribe(); sub = null; } }   /* inscrit avec une ancienne clé */
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64urlVersOctets(notif.cle)});
  if(!notif.id){ notif.id = uid(); if(stockage.idb) await idbEcrire('notif-id', notif.id); }
  const entree = {id:notif.id, nom:gh.cfg.appareil || appareilParDefaut(), fuseau:fuseauIci(), mode:(notif.entree && notif.entree.mode) || 'tout', cle:notif.cle, abonnement:abonnementDe(sub), maj:maintenant()};
  await majAppareils(l => { l.appareils = l.appareils.filter(a => a && a.id !== notif.id).concat([entree]); });
  notif.entree = entree; notif.perdu = false; rendre();
  toast('Notifications activées sur cet appareil');
}
async function notifMode(mode){
  if(!notif.entree || !MODES_NOTIF.some(m => m.v === mode)) return;
  await majAppareils(l => { const a = l.appareils.find(x => x && x.id === notif.id); if(a){ a.mode = mode; a.maj = maintenant(); } });
  notif.entree = {...notif.entree, mode}; toast(MODES_NOTIF.find(m => m.v === mode).t);
}
async function notifDesactiver(){
  if(!await confirmer({titre:'Désactiver les notifications ?', ok:'Désactiver', danger:false, texte:'Cet appareil ne recevra plus de rappels. Tes autres appareils continuent d’en recevoir.'})) return;
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); } catch(e){}
  await majAppareils(l => { l.appareils = l.appareils.filter(a => a && a.id !== notif.id); });
  notif.entree = null; notif.perdu = false; rendre(); toast('Notifications désactivées sur cet appareil');
}

/* Bouton : désactivé pendant l'opération, erreur annoncée clairement */
async function actionNotif(f, ...a){
  if(notif.enCours) return;
  notif.enCours = true;
  try { await f(...a); }
  catch(e){ toast(e && e.name === 'HorsLigne' ? 'Pas de réseau : réessaie quand tu seras connecté.' : 'Notifications : ' + ((e && e.message) || e)); }
  finally { notif.enCours = false; }
}
function carteNotif(){
  const c = gh.cfg, lienActions = c ? `https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/actions/workflows/${NOTIF.workflow}` : '#';
  const regles = 'Résumé du matin vers 8 h (tâches du jour et en retard, anniversaires, documents), rappel d’une tâche 15 à 40 min avant son heure, rien entre 0 h et 6 h — à l’heure de l’appareil, même en voyage.';
  const carte = (texte, boutons = '') => `<section class="carte c6 etire">${enteteCarte('alerte', 'orange', 'Notifications')}<p class="aide">${texte}</p>${boutons ? `<div class="boutons">${boutons}</div>` : ''}</section>`;
  if(!notifDispo()) return carte(location.protocol === 'file:' ? 'Les notifications demandent la version en ligne de LIFE PANEL (adresse https), installée comme une appli sur le téléphone.' : 'Ce navigateur ne sait pas recevoir de notifications : utilise Chrome ou Opera.');
  if(!ghActif()) return carte('Les rappels sont envoyés depuis ton dépôt GitHub privé : active d’abord la synchronisation GitHub (carte ci-dessus).');
  if(!notif.charge) return carte(notif.erreur ? 'Lecture impossible pour le moment : ' + esc(notif.erreur) : 'Lecture de l’état des notifications…', notif.erreur ? btnAction('notif-relire', 'Réessayer', 'btn') : '');
  if(!notif.cle) return carte(regles + '<br><br>Pour commencer (une seule fois, depuis n’importe quel appareil) : créer la clé qui signe tes notifications. Il faudra ensuite coller sa partie secrète dans les réglages de ton dépôt GitHub.',
    btnAction('notif-preparer', ico('plus', 14) + 'Préparer les notifications', 'btn p'));
  if(!notif.entree) return carte(regles + `<br><br>Cet appareil (<b>${esc(c.appareil || '?')}</b>) ne reçoit pas encore les rappels.`,
    btnAction('notif-activer', ico('check', 14) + 'Activer sur cet appareil', 'btn p') + btnAction('notif-preparer', 'Nouvelle clé (clé secrète perdue)', 'btn f'));
  const e = notif.entree;
  return `<section class="carte c6 etire">${enteteCarte('alerte', 'orange', 'Notifications')}
    <p class="aide">${notif.perdu ? '<b>L’autorisation a été retirée sur cet appareil</b> : clique sur « Réactiver ». ' : ''}Activées sur <b>${esc(e.nom)}</b>, à l’heure de <b>${esc(e.fuseau)}</b>. ${regles}</p>
    <label class="champ" style="margin:0 0 12px"><span>Sur cet appareil</span><select data-notif-mode>${MODES_NOTIF.map(m => `<option value="${m.v}"${m.v === e.mode ? ' selected' : ''}>${esc(m.t)}</option>`).join('')}</select></label>
    <div class="boutons">${notif.perdu ? btnAction('notif-activer', 'Réactiver', 'btn p') : btnAction('notif-tester', 'Essayer ici', 'btn')}<a class="btn" href="${esc(lienActions)}" target="_blank" rel="noopener noreferrer">${ico('externe', 14)}Test depuis GitHub</a>${btnAction('notif-desactiver', 'Désactiver', 'btn f')}</div>
    <p class="aide" style="margin:10px 0 0">« Test depuis GitHub » : bouton « Run workflow », case « test » cochée — une notification arrive sur chaque appareil inscrit.</p></section>`;
}

/* ==========================================================================
   N. PIED DE PAGE ET DÉMARRAGE
   ========================================================================== */
function majPied(){
  const p = $('#pied'); if(!p) return;
  const e = etatEcriture(), t = esc(ETATS_ECRITURE[e].texte().replace(/ Clique pour.*$/, ''));
  const led = {ok:'', cours:' b', erreur:' r', hors:' j', demo:' j', indispo:' j'}[e];
  const actif = ghActif(), sansDossier = actif && !dossier && !dossierMemorise;   /* synchro GitHub sans dossier relié (téléphone) : pas de ligne « dossier » */
  const d = sansDossier ? '' : ['erreur', 'hors'].includes(e) ? `<button class="e" data-action="dossier-etat"><span class="led${led}"></span>${t} · ${e === 'erreur' ? 'réessayer' : dossierMemorise ? 'reconnecter' : 'relier'}</button>`
    : e === 'indispo' ? `<a class="e" href="#/donnees"><span class="led${led}"></span>${t}</a>` : `<span class="e"><span class="led${led}"></span>${t}</span>`;
  let g = '';
  if(actif){ const eg = etatGitHub(); g = `<button class="e" data-action="gh-etat"><span class="led${{ok:'', cours:' b', erreur:' r', hors:' j'}[eg]}"></span>${esc(TEXTES_GITHUB[eg]().replace(/ Clique pour.*$/, ''))}</button>`; }
  p.innerHTML = `<span class="e"><span class="led"></span>${derniereSauvegarde ? 'Navigateur : enregistré à ' + heure(derniereSauvegarde) : 'Données dans ce navigateur'}</span>${g}${d}
    <span class="e droite"><span class="led"></span>${actif ? 'Synchro GitHub · dépôt privé' : 'Local · aucune connexion externe'} · <kbd>Ctrl</kbd>+<kbd>K</kbd> commandes</span>`;
}
async function demarrer(){
  $('#logo').innerHTML = ico('maison', 18, '#fff', 2);
  $('#ic-recherche').innerHTML = ico('recherche', 14);
  $('#btn-ajouter').innerHTML = ico('plus', 17);
  $('#btn-commandes').innerHTML = ico('commande', 17);
  $('#btn-reglages').innerHTML = ico('reglages', 17);
  $('#menu').innerHTML = MENU.map(([r, n, i]) => `<a href="#/${r}" data-route="${r}" title="${n}">${ico(i, 16)}<span class="lib">${n}</span>${r === 'inbox' ? '<span class="badge" id="badge-inbox" hidden></span>' : ''}</a>`).join('');

  /* Données du navigateur (IndexedDB ou copie légère), sinon reprise des versions précédentes (jamais la démo toute seule) */
  let actuel = null, choix = null;
  try { actuel = await chargerNavigateur(); } catch(e){ actuel = lireCle(CLE); }
  if(actuel) DB = normaliser(actuel);
  else {
    const a = anciennesVersions();
    if(a.length === 1){ DB = normaliser(a[0].data); sauver(); setTimeout(() => toast('Données reprises de ' + a[0].nom + ' : ' + resume(DB) + '.'), 500); }
    else if(a.length > 1) choix = a;
  }
  entretien();   /* tâches terminées d'hier → archives ; corbeille de plus de 30 jours → effacée */
  const f = lireCle(CLE_FOCUS);
  if(f && f.fin > Date.now() && tache(f.taskId)){ focusEnCours = f; lancerMinuteur(); }
  else if(f){ try { localStorage.removeItem(CLE_FOCUS); } catch(e){} }
  try { await initDrive(); } catch(e){}   /* dossier Drive relié sur cet appareil : accès déjà accordé ? */

  rendre();
  if(choix) ficheMigration(choix);
  initGitHub().then(() => initNotif()).catch(() => {});   /* synchronisation GitHub, si elle a été activée sur cet appareil, puis notifications */
  /* Appli installable (icône, plein écran, hors ligne) : seulement pour la version en ligne (https) */
  if(location.protocol === 'https:' || location.hostname === 'localhost'){
    if(!$('link[rel="manifest"]')){ const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(() => {});
      /* Appui sur une notification alors que LIFE PANEL est déjà ouvert : le service worker demande d'aller à la bonne page */
      navigator.serviceWorker.addEventListener('message', e => { const u = e.data && e.data.aller; if(typeof u === 'string' && /^#\/[\w/?=&%.-]*$/.test(u)) location.hash = u; });
    }
  }

  /* Dossier relié lors d'une session précédente : un clic suffit pour le reconnecter */
  if(fsDispo() && 'indexedDB' in window){
    idbLire('dossier').then(async h => {
      if(!h) return;
      dossierMemorise = h;
      let autorise = false;
      try { autorise = await h.queryPermission({mode:'readwrite'}) === 'granted'; } catch(e){}
      if(autorise) await brancherDossier(h, {auto:true});
      majIndicateur(); majPied(); if(lireRoute().nom === 'donnees') rendre();
    }).catch(() => {});
  }
  majIndicateur();
  /* Quitter la page, fermer l'onglet ou le navigateur alors que donnees.json n'est pas à jour :
     le navigateur demande confirmation (son propre message, qu'une page ne peut pas modifier) */
  window.addEventListener('beforeunload', e => {
    /* Grosse base (pas de copie légère) dont l'enregistrement dans le navigateur n'est pas encore terminé */
    const navigateur = stockage.enAttente > 0 && !stockage.miroirAJour;
    /* Dossier : sans objet sur un appareil synchronisé par GitHub qui n'a jamais eu de dossier relié (téléphone) */
    const dossierEnAttente = !DB.reglages.demo && fsDispo() && ecr.nonEcrit && !(ghActif() && !dossier && !dossierMemorise);
    const githubEnAttente = ghEnAttente();
    if(!navigateur && !dossierEnAttente && !githubEnAttente) return;
    if(dossier && ecr.nonEcrit) ecrireDossier();   /* dernière tentative : elle aboutit si tu restes sur la page */
    if(githubEnAttente && !gh.enCours) ghSynchroniser('ecriture');
    e.preventDefault(); e.returnValue = '';
  });
  /* Onglet caché (changement d'onglet ou d'appli, fermeture qui commence) : on écrit sans attendre.
     Retour sur la page : on regarde si l'autre appareil a modifié quelque chose. */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){ if(dossier && ecr.nonEcrit) ecrireDossier(); if(ghActif() && gh.attente) ghSynchroniser('ecriture'); }
    else { if(ghActif() && Date.now() - gh.controle > 10000) ghSynchroniser('retour'); if(notif.entree && notif.entree.fuseau !== fuseauIci()) initNotif(); }   /* fuseau changé (voyage) */
  });
  window.addEventListener('online', () => { if(ghActif()) ghSynchroniser('reseau'); });
  /* Vérification toutes les 30 s tant que la page est affichée (sauf si une synchro vient d'avoir lieu) */
  setInterval(() => { if(ghActif() && document.visibilityState === 'visible' && !gh.enCours && Date.now() - gh.controle > 25000) ghSynchroniser('periodique'); }, 30000);
  window.addEventListener('hashchange', () => { fermerModale({historique:false}); fermerPalette(); rendre(); });
  /* Une erreur imprévue n'est plus silencieuse : un message l'annonce */
  const signaler = m => { console.error(m); toast('Un problème est survenu : ' + (m && m.message || m) + '. Recharge la page (F5) si quelque chose ne répond plus.'); };
  window.addEventListener('error', e => signaler(e.error || e.message));
  window.addEventListener('unhandledrejection', e => signaler(e.reason));
  /* Un autre onglet a modifié les données : on se met à jour (message de l'onglet, ou copie légère modifiée) */
  const reprendre = d => { if(!d || (d.reglages && d.reglages.maj === DB.reglages.maj)) return; DB = normaliser(d); versionDonnees++;
    /* Synchro GitHub : si l'autre onglet vient de synchroniser, sa base correspond à ces données → on la reprend */
    if(ghActif() && stockage.idb) idbLire('github-base').then(b => { if(b && gh.cfg && b.depot === cleDepot(gh.cfg) && b.texte === JSON.stringify(normaliser(DB))){ gh.sha = b.sha; gh.base = b.texte; } }).catch(() => {});
    if(!modaleOuverte()) rendre(); };
  if('BroadcastChannel' in window){
    stockage.canal = new BroadcastChannel('lifepanel');
    stockage.canal.onmessage = e => { if(e.data && e.data.maj !== DB.reglages.maj) idbLire('donnees').then(t => { if(t) reprendre(JSON.parse(t)); }).catch(() => {}); };
  }
  window.addEventListener('storage', e => { if(e.key === CLE && e.newValue){ try { reprendre(JSON.parse(e.newValue)); } catch(err){} } });
  /* Passage de minuit : « aujourd'hui » change */
  let jour = aujourdhui();
  setInterval(() => { if(aujourdhui() !== jour){ jour = aujourdhui(); moisCal = moisCourant(); entretien(); if(!modaleOuverte()) rendre(); } }, 60000);
}
demarrer();
</script>
