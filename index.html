<!doctype html>
<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sécurité : seuls les fichiers de ce site peuvent s'exécuter (aucun script en ligne, aucun autre site) ; la page ne peut se
     connecter qu'à elle-même et à l'API GitHub (synchro, lot 1). Plus d'empreinte à recalculer après une modification. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Life Panel</title>
<meta name="theme-color" content="#111A1E">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- LIFE PANEL v5 : la coquille. Tout le reste est dans noyau/ (commun) et modules/ (une rubrique = un dossier). Voir CLAUDE.md. -->
<script src="noyau/theme-avant.js"></script>
<link rel="preload" href="noyau/polices/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="noyau/styles/jetons.css">
<link rel="stylesheet" href="noyau/styles/base.css">
<link rel="stylesheet" href="noyau/styles/coquille.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Menu"></nav>
  <div class="principal">
    <header class="barre" id="barre"></header>
    <main class="page" id="vue" tabindex="-1"><div class="vide">Chargement…</div></main>
  </div>
</div>
<nav class="onglets" id="onglets" aria-label="Rubriques"></nav>
<button type="button" class="fab" id="fab" data-action="noter" aria-label="Noter quelque chose"></button>
<div class="voile" id="voile" hidden></div>
<section class="feuille" id="feuille" role="dialog" aria-modal="true" tabindex="-1" hidden></section>
<div class="dialogue" id="dialogue" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="vide">LIFE PANEL a besoin de JavaScript.</div></noscript>
</body>
</html>
