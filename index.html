/* Notes et contacts s'ouvrent dans une fenêtre : « #/note/ID » affiche la page Notes puis la fenêtre */
const FICHES = {note:{page:'notes', ouvrir:id => ficheNote(id)}, contact:{page:'contacts', ouvrir:id => ficheContact(id)}, document:{page:'documents', ouvrir:id => ficheDocument(id)}};
const MENU = [['accueil','Accueil','maison'],['aujourdhui','Aujourd’hui','cible'],['inbox','Inbox','ampoule'],['taches','Tâches','coche'],
  ['projets','Projets','dossier'],['finances','Finances','portefeuille'],['notes','Notes','doc'],['documents','Documents','document'],['contacts','Contacts','personnes'],['revue','Revue','calendrier']];
const PARENT = {projet:'projets'};   /* recherche et corbeille : pas d'onglet du menu */
const LISTES = {taches:listeTaches, projets:listeProjets, finances:listeFinances, notes:listeNotes, documents:listeDocuments, contacts:listeContacts};
let routeAffichee = '', tAnim;

function lireRoute(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [chemin, qs] = h.split('?');
  const [nom, id] = (chemin || '').split('/');
  const params = new URLSearchParams(qs || '');
  if(nom === 'notes' && params.get('n')) return {nom:'note', id:params.get('n'), params};   /* anciens liens v3.2 */
  if(FICHES[nom] && id) return {nom, id:decodeURIComponent(id), params};
  return {nom:ROUTES[nom] ? nom : 'accueil', id:id ? decodeURIComponent(id) : '', params};
}
function titrePage(){
  const r = lireRoute();
  const t = {accueil:'Accueil', aujourdhui:'Aujourd’hui', inbox:'Inbox', taches:'Tâches', projets:'Projets', projet:nomProjet(r.id) || 'Projet',
    finances:'Finances', notes:'Notes', documents:'Documents', contacts:'Contacts', revue:'Revue hebdo', donnees:'Données', recherche:'Recherche', corbeille:'Corbeille'}[r.nom];
  return t + ' · Life Panel';
}
function rendre(){
  let r = lireRoute(), fiche = null;
  if(FICHES[r.nom]){ fiche = r; history.replaceState(null, '', '#/' + FICHES[r.nom].page); r = lireRoute(); }
  /* Un lien « ?q=… » (recherche, rappels) pré-remplit le filtre de la page, puis l'adresse est nettoyée */
  const q = r.params.get('q');
  if(q !== null && r.nom in FILTRES){ FILTRES[r.nom] = q; history.replaceState(null, '', '#/' + r.nom); }
  const dossierParam = r.params.get('dossier');   /* « #/notes?dossier=… » ou « #/documents?dossier=… » ouvre un dossier (ex. Archives) */
  if(dossierParam !== null && (r.nom === 'notes' || r.nom === 'documents')){ if(r.nom === 'notes') filtreTag = dossierParam; else filtreDocs = dossierParam; FILTRES[r.nom] = ''; history.replaceState(null, '', '#/' + r.nom); }
  const projetParam = r.params.get('projet');     /* « …?projet=ID » : n'afficher que ce qui appartient à ce projet */
  if(projetParam !== null && PAGES_FILTRE_PROJET.includes(r.nom)){ filtreProjet = {page:r.nom, id:projetParam}; FILTRES[r.nom] = '';
    if(dossierParam === null){ if(r.nom === 'notes') filtreTag = ''; if(r.nom === 'documents') filtreDocs = ''; }   /* tout le projet, pas un reste de dossier */
    history.replaceState(null, '', '#/' + r.nom); }
  else if(filtreProjet && filtreProjet.page !== r.nom) filtreProjet = null;   /* on a quitté la page filtrée */
  const cle = location.hash || '#/accueil', change = cle !== routeAffichee;
  routeAffichee = cle;
  if(change){ limiteNotes = NOTES_PAR_PAGE; limiteMvts = MVTS_PAR_PAGE; limiteTaches = TACHES_PAR_PAGE; filtreCatFin = null; }   /* en revenant sur une page : de nouveau les plus récents d'abord, toutes catégories */
  const vue = $('#vue');
  vue.classList.remove('anim');
  try { vue.innerHTML = ROUTES[r.nom](r.id); }
  catch(err){ console.error(err); vue.innerHTML = pageErreur(err); }
  const actif = PARENT[r.nom] || r.nom;
  $$('#menu a').forEach(a => { const on = a.dataset.route === actif; a.classList.toggle('actif', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  if(change) montrerModuleActif();
  if(change){   /* animation et retour en haut seulement quand on change de page */
    void vue.offsetWidth; vue.classList.add('anim');
    $$('.carte', vue).forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
    clearTimeout(tAnim); tAnim = setTimeout(() => vue.classList.remove('anim'), 1300);
    window.scrollTo(0, 0);
    fermerResultats();
    const af = $('[autofocus]', vue); if(af){ af.focus({preventScroll:true}); if(af.setSelectionRange) af.setSelectionRange(af.value.length, af.value.length); }
  }
  document.title = titrePage();
  const b = $('#badge-inbox'), n = inboxOuverte().length;
  if(b){ b.hidden = !n; b.textContent = n; }
  majPied(); majFocus();
  remplirExplos();   /* dossiers Drive affichés : lecture en arrière-plan si besoin */
  if(fiche) FICHES[fiche.nom].ouvrir(fiche.id);
}
/* Quand la ligne des modules défile (écran étroit), on ramène le module de la page ouverte dans la partie visible */
function montrerModuleActif(){
  const m = $('#menu'), a = $('#menu a.actif');
  if(!m || !a || m.scrollWidth <= m.clientWidth) return;
  const rm = m.getBoundingClientRect(), ra = a.getBoundingClientRect();
  if(ra.left < rm.left) m.scrollLeft += ra.left - rm.left - 12;
  else if(ra.right > rm.right) m.scrollLeft += ra.right - rm.right + 12;
}
/* Flèches de Finances : un mois, ou une année en vue par année (on garde le même mois, sauf l'année en cours où l'on prend le mois en cours) */
function decalerFin(sens){
  if(vueFin === 'an'){ const cour = moisCourant(), m = decaleMois(moisFin, 12 * sens); moisFin = m.slice(0, 4) === cour.slice(0, 4) ? cour : m; }
  else moisFin = decaleMois(moisFin, sens);
  FILTRES.finances = ''; filtreCatFin = null; limiteMvts = MVTS_PAR_PAGE; rendre();
}
function rafraichirListe(nom){ const c = $('#liste-' + nom); if(!c || !LISTES[nom]) return; try { c.innerHTML = LISTES[nom](); } catch(err){ console.error(err); c.innerHTML = pageErreur(err); } }
/* Filet de sécurité : si un bug empêche l'affichage, on le dit au lieu de laisser une page figée */
const pageErreur = err => `<div class="bandeau jaune">${pastille('alerte', 'jaune')}<div class="txt"><strong>Cette page n’a pas pu s’afficher</strong>
  <span>Tes données ne sont pas touchées. Recharge la page (F5) ; si ça recommence, envoie ce message à Claude : <code>${esc(err && err.message || err)}</code></span></div>
  <div class="boutons"><button class="btn" data-action="recharger">Recharger</button><a class="btn" href="#/accueil">Accueil</a></div></div>`;
/* Un lien vers une note ou un contact s'ouvre en fenêtre, sans quitter la page */
function ouvrirFicheDepuisLien(h){
  const m = /^#\/(note|contact|document)\/(.+)$/.exec(h || '');
  if(!m) return false;
  FICHES[m[1]].ouvrir(decodeURIComponent(m[2])); return true;
}

/* ==========================================================================
   H. FENÊTRES : modale, formulaires, confirmation
   ========================================================================== */
let surFermeture = null, focusAvant = null, retourFormulaire = null, ficheOuverte = null;
const modaleOuverte = () => $('#voile').classList.contains('on');
/* Bouton Retour (navigateur, geste retour d'Android) : il ferme la fenêtre ouverte au lieu de quitter la page.
   À l'ouverture, une entrée d'historique (même adresse) est ajoutée ; Retour la retire et ferme la fenêtre.
   Une fenêtre fermée autrement (croix, Échap, Enregistrer) retire elle-même son entrée (history.back) ;
   une fenêtre rouverte avant la fin de ce retour attend qu'il soit fait pour ajouter la sienne. */
const histo = {pousse:false, retourEnCours:false, aPousser:false};
function pousserHisto(){
  if(histo.pousse) return;
  if(histo.retourEnCours){ histo.aPousser = true; return; }
  try { history.pushState({lpFenetre:true}, ''); histo.pousse = true; } catch(e){}
}
window.addEventListener('popstate', () => {
  if(histo.retourEnCours){   /* fin du retour demandé par fermerModale */
    histo.retourEnCours = false;
    if(histo.aPousser){ histo.aPousser = false; if(modaleOuverte()) pousserHisto(); }
    return;
  }
  if(histo.pousse){ histo.pousse = false; if(modaleOuverte()) fermerModale({historique:false}); }
});
const teteModale = (titre, icone = 'plus', couleur = 'bleu') =>
  `<div class="modale-tete">${pastille(icone, couleur, 34, 17)}<h3 id="modale-titre">${titre}</h3><button class="icone-btn fermer" data-action="fermer" aria-label="Fermer">${ico('croix', 16)}</button></div>`;
/* taille : '' | 'large' | 'fiche' (fenêtre agrandie des notes et contacts) ; saisie : placer le curseur dans le 1er champ */
function ouvrirModale(html, {large = false, taille = '', saisie = true} = {}){
  const cb = surFermeture; surFermeture = null; retourFormulaire = null; ficheOuverte = null; if(cb) cb();
  if(!modaleOuverte()) focusAvant = document.activeElement;
  const m = $('#modale'); m.className = 'modale' + (large ? ' large' : '') + (taille ? ' ' + taille : ''); m.innerHTML = html; m.scrollTop = 0;
  $('#voile').classList.add('on');
  pousserHisto();
  const cible = m.querySelector('[autofocus]') || (saisie && m.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]), textarea, select')) || (saisie && m.querySelector('.btn.p')) || m;
  setTimeout(() => cible.focus({preventScroll:true}), 20);
}
/* historique : false quand la fermeture vient déjà d'un changement d'adresse ou du bouton Retour */
function fermerModale({historique = true} = {}){
  if(!modaleOuverte()) return;
  histo.aPousser = false;
  if(histo.pousse){ histo.pousse = false; if(historique){ histo.retourEnCours = true; history.back(); } }
  const m = $('#modale');
  if(m.contains(document.activeElement)) document.activeElement.blur();   /* enregistre un champ en cours de saisie */
  $('#voile').classList.remove('on'); m.innerHTML = ''; ficheOuverte = null; retourFormulaire = null;
  const cb = surFermeture; surFermeture = null; if(cb) cb();
  if(focusAvant && document.contains(focusAvant)) focusAvant.focus();
  /* Données arrivées de GitHub pendant que la fenêtre était ouverte : affichage, puis synchro reportée */
  if(rendreApresModale && !modaleOuverte()){ rendreApresModale = false; rendre(); }
  if(gh.apresModale && !modaleOuverte()){ gh.apresModale = false; setTimeout(() => ghSynchroniser('fenetre'), 150); }
}
function confirmer({titre, texte, ok = 'Confirmer', danger = true, annuler = 'Annuler'}){
  return new Promise(res => {
    let reponse = false;
    ouvrirModale(teteModale(esc(titre), danger ? 'alerte' : 'ampoule', danger ? 'rose' : 'jaune') +
      `<p class="texte">${texte}</p><div class="actions"><button class="btn" data-action="fermer" autofocus>${esc(annuler)}</button><button class="btn p${danger ? ' danger' : ''}" id="btn-confirmer">${esc(ok)}</button></div>`);
    surFermeture = () => res(reponse);
    $('#btn-confirmer').onclick = () => { reponse = true; fermerModale(); };
  });
}

/* champs : {n, l, t:'texte|zone|markdown|nombre|date|heure|select|liste|segment', v, o:[{v,t}], aide, demi, suggestions}
   select + nouveau:'Nouveau compte' : dernière option « ＋ Nouveau compte… », qui fait apparaître un champ pour taper le nom */
const NOUVEAU = '§nouveau';
function champHTML(c){
  const v = c.v ?? '', id = 'ch-' + c.n, aide = c.aide ? ` <em>— ${esc(c.aide)}</em>` : '', cls = 'champ' + (c.demi ? ' demi' : '');
  if(c.t === 'segment') return `<div class="${cls}"><span>${esc(c.l)}${aide}</span><div class="segment" role="radiogroup">${c.o.map(o =>
    `<label><input type="radio" name="${c.n}" value="${esc(o.v)}"${String(o.v) === String(v) ? ' checked' : ''}><span>${esc(o.t)}</span></label>`).join('')}</div></div>`;
  if(c.t === 'tags') return `<div class="${cls}"><span>${esc(c.l)}${aide}</span>${champTags(`id="${id}" name="${c.n}"`, v)}</div>`;
  if(c.t === 'markdown') return `<div class="${cls}"><span>${esc(c.l)}${aide}</span><div class="onglets"><button type="button" class="actif" data-action="md-ecrire">Écrire</button><button type="button" data-action="md-apercu">Aperçu</button></div>
    <textarea id="${id}" name="${c.n}" class="code" aria-label="${esc(c.l)}">${esc(v)}</textarea><div class="apercu md" hidden></div></div>`;
  const dl = c.suggestions && c.suggestions.length ? `<datalist id="dl-${c.n}">${c.suggestions.map(s => `<option value="${esc(s)}">`).join('')}</datalist>` : '';
  let ctrl;
  if(c.t === 'zone') ctrl = `<textarea id="${id}" name="${c.n}">${esc(v)}</textarea>`;
  else if(c.t === 'liste') ctrl = `<textarea id="${id}" name="${c.n}" style="min-height:230px">${esc(Array.isArray(v) ? v.join('\n') : v)}</textarea>`;
  else if(c.t === 'select') ctrl = `<select id="${id}" name="${c.n}"${c.nouveau ? ` data-nouveau="${id}-nouveau"` : ''}>${c.o.map(o => `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}${c.nouveau ? `<option value="${NOUVEAU}">＋ ${esc(c.nouveau)}…</option>` : ''}</select>` +
    (c.nouveau ? `<input id="${id}-nouveau" name="${c.n}Nouveau" class="nouveau-nom" placeholder="${esc(c.nouveau)}" autocomplete="off" aria-label="${esc(c.nouveau)}" hidden>` : '');
  else if(c.t === 'nombre') ctrl = `<input id="${id}" type="number" inputmode="decimal" step="0.01" min="0" name="${c.n}" value="${esc(v)}">`;
  else if(c.t === 'date') ctrl = `<input id="${id}" type="date" name="${c.n}" value="${esc(v)}">`;
  else if(c.t === 'heure') ctrl = `<input id="${id}" type="time" name="${c.n}" value="${esc(v)}">`;
  else if(c.t === 'tel') ctrl = `<input id="${id}" type="tel" inputmode="tel" name="${c.n}" value="${esc(v)}" autocomplete="off">`;
  else if(c.t === 'email') ctrl = `<input id="${id}" type="email" inputmode="email" name="${c.n}" value="${esc(v)}" autocomplete="off" spellcheck="false">`;
  else ctrl = `<input id="${id}" type="text" name="${c.n}" value="${esc(v)}" autocomplete="off"${dl ? ` list="dl-${c.n}"` : ''}>`;
  return `<label class="${cls}" for="${id}"><span>${esc(c.l)}${aide}</span>${ctrl}${dl}</label>`;
}
/* Saisie des tags (commune à tous les modules) : champ texte + tags déjà utilisés, cliquables */
function champTags(attributs, v){
  const courants = new Set(nettoyerTags(v).map(norm)), dispo = tousLesTags();
  return `<input ${attributs} value="${esc(Array.isArray(v) ? v.join(', ') : v)}" autocomplete="off" placeholder="ex. santé, voiture, permis-de-conduire" aria-label="Tags, séparés par des virgules (un espace devient un tiret)">
    ${dispo.length ? `<div class="tags-dispo">${dispo.slice(0, 60).map(t => `<button type="button" class="puce${courants.has(norm(t)) ? ' actif' : ''}" data-action="tag-basculer" data-v="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}`;
}

/* onOk renvoie un texte d'erreur pour garder la fenêtre ouverte (plus de fermeture silencieuse).
   puis : appelé après l'enregistrement ; retour : « Annuler » revient à la fenêtre précédente */
function formulaire({titre, icone = 'plus', couleur = 'bleu', champs, ok = 'Enregistrer', large = false, onOk, puis = null, retour = null}){
  ouvrirModale(teteModale(esc(titre), icone, couleur) + `<form id="form-modale" class="form-grille" novalidate>${champs.map(champHTML).join('')}
    <p class="erreur" id="erreur-modale" hidden></p><div class="actions"><button type="button" class="btn" data-action="${retour ? 'form-retour' : 'fermer'}">Annuler</button><button class="btn p" type="submit">${esc(ok)}</button></div></form>`, {large});
  retourFormulaire = retour;
  const f = $('#form-modale');
  f.onsubmit = e => {
    e.preventDefault();
    const v = {};
    champs.forEach(c => { const el = f.elements[c.n]; if(!el) return; const val = String(el.value ?? '');
      v[c.n] = c.t === 'liste' ? val.split('\n').map(s => s.trim()).filter(Boolean) : val.trim();
      if(c.nouveau) v[c.n + 'Nouveau'] = String((f.elements[c.n + 'Nouveau'] || {}).value || '').trim(); });
    const err = onOk(v);
    if(typeof err === 'string'){ const p = $('#erreur-modale'); p.textContent = err; p.hidden = false; return; }
    fermerModale(); sauver(); rendre(); if(puis) puis();
  };
}

/* --- Formulaires métier (utilisés par les boutons, la capture et la palette) --- */
function formTache(t0 = {}, apres){
  const ex = t0.id ? tache(t0.id) : null;
  formulaire({titre:ex ? 'Modifier la tâche' : 'Nouvelle tâche', icone:'coche', couleur:'bleu', ok:ex ? 'Enregistrer' : 'Créer la tâche', champs:[
    {n:'nom', l:'Tâche', v:t0.nom},
    {n:'date', l:'Date', t:'date', v:ex ? ex.date : (t0.date ?? aujourdhui()), demi:true, aide:'vide = sans date'},
    {n:'heure', l:'Heure', t:'heure', v:t0.heure, demi:true, aide:'facultatif'},
    {n:'priorite', l:'Priorité', t:'segment', v:t0.priorite || 'p2', o:[{v:'p1', t:'P1 · importante'}, {v:'p2', t:'P2 · normale'}, {v:'p3', t:'P3 · légère'}]},
    {n:'estimation', l:'Durée estimée (min)', t:'nombre', v:t0.estimation ?? '', demi:true, aide:'facultatif'},
    {n:'projet', l:'Projet', t:'select', o:optionsProjets(t0.projet), v:t0.projet || '', demi:true},
    {n:'tags', l:'Tags', t:'tags', v:t0.tags || [], aide:'facultatif, séparés par des virgules'}
  ], onOk:v => {
    if(!v.nom) return 'Donne un nom à la tâche.';
    const d = {nom:v.nom, date:v.date, heure:v.heure, priorite:v.priorite || 'p2', estimation:v.estimation ? positif(Math.abs(Number(v.estimation.replace(',', '.'))), 100000) : null, projet:v.projet || null, tags:nettoyerTags(v.tags), modif:maintenant()};
    if(ex){ const avant = ex.projet; Object.assign(ex, d); toucherProjet(avant); toucherProjet(ex.projet); toast('Tâche modifiée'); }
    else { ajouter('taches', d); toucherProjet(d.projet); toast('Tâche créée'); }
    if(apres) apres();
  }});
}
function formMouvement(m0 = {}, apres){
  const ex = m0.id ? DB.mouvements.find(x => x.id === m0.id) : null;
  const cats = [{v:'', t:'— à catégoriser —'}].concat(unique([...DB.categories, ...(m0.categorie ? [m0.categorie] : [])]).map(c => ({v:c, t:c})));
  const cpt = ex ? m0.compte || '' : (m0.compte ?? compteParDefaut());
  const comptes = [{v:'', t:'— sans compte —'}].concat(unique([...DB.comptes.map(c => c.nom), ...(cpt ? [cpt] : [])]).map(c => ({v:c, t:c})));
  formulaire({titre:ex ? 'Modifier le mouvement' : 'Nouveau mouvement', icone:'euro', couleur:'vert', ok:ex ? 'Enregistrer' : 'Ajouter', champs:[
    {n:'type', l:'Type', t:'segment', v:m0.type || 'depense', o:[{v:'depense', t:'Dépense'}, {v:'revenu', t:'Entrée d’argent'}]},
    {n:'montant', l:'Montant (€)', t:'nombre', v:m0.montant ?? '', demi:true},
    {n:'date', l:'Date', t:'date', v:m0.date || aujourdhui(), demi:true},
    {n:'libelle', l:'Libellé', v:m0.libelle, aide:'ex. Barbier', suggestions:unique(DB.mouvements.map(m => m.libelle).filter(Boolean)).slice(0, 80)},
    {n:'categorie', l:'Catégorie', t:'select', o:cats, v:m0.categorie || '', demi:true, nouveau:'Nouvelle catégorie'},
    {n:'compte', l:'Compte', t:'select', o:comptes, v:cpt, demi:true, nouveau:'Nouveau compte'},
    {n:'projet', l:'Projet', t:'select', o:optionsProjets(m0.projet), v:m0.projet || ''}
  ], onOk:v => {
    const montant = Math.abs(Number(String(v.montant).replace(/\s/g, '').replace(',', '.')));
    if(!Number.isFinite(montant) || !montant) return 'Indique un montant supérieur à zéro.';
    if(montant > MAX_MONTANT) return 'Un mouvement ne peut pas dépasser ' + eur(MAX_MONTANT) + '.';
    if(!v.date) return 'Indique une date.';
    if(v.categorie === NOUVEAU && !propreNom(v.categorieNouveau)) return 'Donne un nom à la nouvelle catégorie.';
    if(v.compte === NOUVEAU && !propreNom(v.compteNouveau)) return 'Donne un nom au nouveau compte.';
    const categorie = v.categorie === NOUVEAU ? assurerCategorie(v.categorieNouveau) : v.categorie;
    const compte = v.compte === NOUVEAU ? assurerCompte(v.compteNouveau) : v.compte;
    const d = {type:v.type === 'revenu' ? 'revenu' : 'depense', montant, date:v.date, libelle:v.libelle, categorie, compte, projet:v.projet || null, modif:maintenant()};
    if(ex){ const avant = ex.projet; Object.assign(ex, d); toucherProjet(avant); toucherProjet(ex.projet); toast('Mouvement modifié'); }
    else { ajouter('mouvements', {cree:maintenant(), ...d}); toucherProjet(d.projet); toast((d.type === 'revenu' ? 'Entrée' : 'Dépense') + ' de ' + eur(montant) + ' ajoutée'); }
    if(apres) apres();
  }});
}
/* --- Comptes et catégories : même fenêtre de gestion ---
   Renommer met à jour tous les mouvements ; deux noms identiques (à la casse près) fusionnent ; supprimer un nom
   encore utilisé laisse ses mouvements « sans compte » ou « à catégoriser », après confirmation.
   Comptes : case « pris en compte dans les statistiques » et budget par mois ou par an. */
function ligneGestion(type, x){
  const comptes = type === 'comptes', dis = x.suppr ? ' disabled' : '';
  const nb = x.orig === null ? null : comptes ? nbMouvementsCompte(x.orig) : nbMouvementsCategorie(x.orig), action = x.suppr ? 'Garder' : 'Supprimer';
  return `<li class="ligne-gestion${x.suppr ? ' supprimee' : ''}"${x.orig === null ? ' data-nouveau="1"' : ` data-orig="${esc(x.orig)}"`}>
    ${comptes ? `<label class="case-stats" title="Pris en compte dans les statistiques"><input type="checkbox" name="stats"${x.stats ? ' checked' : ''}${dis}><span class="sr">Pris en compte dans les statistiques</span></label>`

}
function ficheGestion(type, brouillon = null){
  const comptes = type === 'comptes', champ = comptes ? 'compte' : 'categorie';
  const lignes = brouillon ? brouillon.lignes : comptes ? DB.comptes.map(c => ({orig:c.nom, ...c, suppr:false})) : DB.categories.map(c => ({orig:c, nom:c, suppr:false}));
  const nbSans = comptes ? DB.mouvements.filter(m => !m.compte).length : 0;
  const sansStats = brouillon && brouillon.sansStats !== undefined ? brouillon.sansStats : DB.reglages.sansCompteStats !== false;
  ouvrirModale(teteModale(comptes ? 'Comptes et budgets' : 'Catégories de dépenses', comptes ? 'portefeuille' : 'tag', comptes ? 'vert' : 'jaune') +
    `<p class="texte">${comptes ? 'Case cochée : le compte est pris en compte dans les statistiques (accueil et Finances) ; plusieurs cases cochées = statistiques fusionnées. Un budget annuel compte pour un douzième chaque mois. ' : ''}Renommer met à jour tous les mouvements ; deux noms identiques (à la casse près) sont fusionnés.</p>
    <form id="form-gestion" novalidate><ul class="liste gestion">${lignes.map(x => ligneGestion(type, x)).join('')}</ul>
      ${nbSans ? `<label class="ligne-sans"><input type="checkbox" name="sansStats"${sansStats ? ' checked' : ''}><span>Mouvements sans compte (${pluriel(nbSans, 'mouvement')}) : pris en compte dans les statistiques</span></label>` : ''}
      <div class="boutons" style="margin-top:12px">${btnAction('gestion-ajouter', ico('plus', 14) + (comptes ? 'Ajouter un compte' : 'Ajouter une catégorie'), 'btn ghost compact', `data-type="${type}"`)}</div>
      <p class="erreur" id="erreur-modale" hidden></p>
      <div class="actions"><button type="button" class="btn" data-action="fermer">Annuler</button><button class="btn p" type="submit">Enregistrer</button></div></form>`, {large:true});
  const f = $('#form-gestion');
  f.onsubmit = async e => {
    e.preventDefault();
    const lire = li => ({orig:li.dataset.nouveau ? null : li.dataset.orig, nom:propreNom($('input[name="nom"]', li).value), suppr:li.classList.contains('supprimee'),
      stats:comptes ? $('input[name="stats"]', li).checked : true, budget:comptes ? num($('input[name="budget"]', li).value.replace(',', '.')) : null,
      periode:comptes ? $('select[name="periode"]', li).value : 'mois'});
    const b = {lignes:$$('li.ligne-gestion', f).map(lire), sansStats:f.elements.sansStats ? f.elements.sansStats.checked : undefined};
    const erreur = t => { const p = $('#erreur-modale'); p.textContent = t; p.hidden = false; };
    const gardees = b.lignes.filter(x => !x.suppr && (x.nom || x.orig !== null));   /* une ligne ajoutée puis laissée vide est ignorée */
    if(gardees.some(x => !x.nom)) return erreur(comptes ? 'Un compte ne peut pas avoir un nom vide : supprime-le plutôt.' : 'Une catégorie ne peut pas avoir un nom vide : supprime-la plutôt.');
    if(!comptes && !gardees.length) return erreur('Il faut au moins une catégorie.');
    if(gardees.some(x => x.budget !== null && x.budget < 0)) return erreur('Un budget doit être un montant positif.');
    if(gardees.some(x => x.budget !== null && x.budget > MAX_BUDGET)) return erreur('Un budget ne peut pas dépasser un milliard d’euros.');
    const groupes = new Map();
    gardees.forEach(x => { const k = cleNom(x.nom); if(!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(x); });
    const nb = x => x.orig === null ? 0 : comptes ? nbMouvementsCompte(x.orig) : nbMouvementsCategorie(x.orig);
    const avis = [];
    b.lignes.filter(x => x.suppr && x.orig !== null && nb(x)).forEach(x => { const n = nb(x);
      avis.push(`« ${esc(x.orig)} » est supprimé${comptes ? '' : 'e'} : ${pluriel(n, 'mouvement')} ${n > 1 ? 'passeront' : 'passera'} ${comptes ? 'sans compte' : 'à catégoriser'}` +
        (comptes ? ` (les mouvements sans compte sont ${(b.sansStats ?? DB.reglages.sansCompteStats !== false) ? 'pris en compte dans les' : 'exclus des'} statistiques).` : '.')); });
    const garde = g => g.find(x => x.orig !== null && x.orig === x.nom) || g.find(x => x.orig !== null && cleNom(x.orig) === cleNom(x.nom)) || g[0];
    groupes.forEach(g => { if(g.length < 2) return; const t = garde(g);
      avis.push(`${g.map(x => '« ' + esc(x.orig ?? x.nom) + ' »').join(' et ')} seront fusionnés en « ${esc(t.nom)} »` +
        (comptes ? ` (case et budget de « ${esc(t.orig ?? t.nom)} » conservés${!t.budget && g.some(x => x.budget) ? ', ou le premier budget renseigné' : ''}).` : '.')); });
    if(avis.length && !await confirmer({titre:'Confirmer les changements', texte:avis.join('<br>'), ok:'Enregistrer', danger:b.lignes.some(x => x.suppr)})){
      ficheGestion(type, b); return;   /* « Annuler » : retour à la liste, telle qu'elle était en cours de modification */
    }
    const renomme = new Map();   /* ancien nom → nouveau ('' : supprimé) */
    b.lignes.forEach(x => { if(x.orig !== null && x.suppr) renomme.set(x.orig, ''); });
    const liste = [];
    groupes.forEach(g => { const t = garde(g), avecBudget = t.budget ? t : g.find(x => x.budget) || t;
      g.forEach(x => { if(x.orig !== null) renomme.set(x.orig, t.nom); });
      liste.push(comptes ? formeCompte({nom:t.nom, stats:t.stats, budget:avecBudget.budget, periode:avecBudget.periode}) : t.nom); });
    /* Un compte ou une catégorie créé(e) entre-temps (autre onglet, formulaire) et absent(e) de cette fenêtre est gardé(e) */
    const vus = new Set(b.lignes.filter(x => x.orig !== null).map(x => x.orig));
    (comptes ? DB.comptes : DB.categories).forEach(c => { const nom = comptes ? c.nom : c;
      if(!vus.has(nom) && !groupes.has(cleNom(nom))) liste.push(c); });
    const quand = maintenant(), suivre = (m, vivant) => { if(!m[champ] || !renomme.has(m[champ]) || renomme.get(m[champ]) === m[champ]) return;
      m[champ] = renomme.get(m[champ]); if(vivant) m.modif = quand; };
    DB.mouvements.forEach(m => suivre(m, true));
    DB.corbeille.forEach(e => { if(e.type === 'mouvements') suivre(e.element, false); });   /* un mouvement restauré plus tard aura le bon nom */
    if(comptes){ DB.comptes = liste; if(b.sansStats !== undefined) DB.reglages.sansCompteStats = b.sansStats; }
    else {
      /* Couleurs : une catégorie gardée, renommée ou fusionnée garde celle de la ligne conservée ;
         une catégorie supprimée libère la sienne ; une nouvelle prend une couleur libre */
      const avant = new Map((DB.couleursCategories || []).map(x => [x.nom, x.couleur])), reprises = [];
      groupes.forEach(g => { const t = garde(g); if(t.orig !== null && avant.has(t.orig)) reprises.push({nom:t.nom, couleur:avant.get(t.orig)}); });
      liste.forEach(nom => { if(!vus.has(nom) && avant.has(nom)) reprises.push({nom, couleur:avant.get(nom)}); });
      DB.categories = liste;
      DB.couleursCategories = colorerCategories(liste, reprises, DB.mouvements);
    }
    fermerModale(); sauver(); rendre(); toast(comptes ? 'Comptes enregistrés' : 'Catégories enregistrées');
  };
}

const ficheCategories = () => ficheGestion('categories');

/* Chemin dans le dossier Drive relié (« Habitation/Ste Maxime ») : jamais de « .. », de « / » en tête ni de segment vide */
function cheminDrive(v){
  return txt(v).trim().split('/').filter(x => x.trim() && x !== '.' && x !== '..').join('/');   /* les noms gardent leurs espaces */
}
function normaliserLien(brut){
  let u = String(brut || '').trim().replace(/^["'<]+|[">']+$/g, '');
  if(!u) return '';
  if(/^drive:/i.test(u)){ const c = cheminDrive(u.slice(6)); return c ? 'drive:' + c : ''; }   /* fichier du dossier Drive relié (chemin depuis ce dossier) */
  if(/^[a-zA-Z]:[\\/]/.test(u)) u = 'file:///' + u.replace(/\\/g, '/').split('/').map((x, i) => i ? encodeURIComponent(x) : x).join('/');   /* chemin Windows G:\… */
  else if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try {
    const x = new URL(u);
    if(x.protocol === 'file:') return x.href;
    const hoteValide = /^[a-z0-9.-]+$/i.test(x.hostname) && (x.hostname.includes('.') || x.hostname === 'localhost');
    return ['http:', 'https:'].includes(x.protocol) && hoteValide ? x.href : '';
  }
  catch(e){ return ''; }
}

/* --- Capture rapide : une pensée → tâche, dépense ou note --- */
function lireQuand(n){
  let date = '', h = '';
  if(/\baujourd.?hui\b|\bce soir\b/.test(n)) date = aujourdhui();
  else if(/\bapres-demain\b/.test(n)) date = decaleJour(2);
  else if(/\bdemain\b/.test(n)) date = decaleJour(1);
  else { const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'], i = jours.findIndex(j => new RegExp('\\b' + j + '\\b').test(n));
    if(i >= 0) date = decaleJour(((i - new Date().getDay() + 7) % 7) || 7); }
  const m = n.match(/\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?(?!\d)/);
  if(m && Number(m[1]) < 24 && (!m[2] || Number(m[2]) < 60)) h = pad(m[1]) + ':' + (m[2] || '00');
  return {date, heure:h};
}
function analyserCapture(texte){
  const s = texte.trim(), n = norm(s), bords = /^[\s\-–—:,]+|[\s\-–—:,]+$/g;
  const lien = s.match(/(?:https?:\/\/|www\.)\S+/i);   /* un lien : c'est un document */
  if(lien) return {type:'document', url:lien[0], titre:s.replace(lien[0], '').replace(bords, '').trim()};
  const m = s.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur\b|euros?\b)/i);
  if(m){ const libelle = s.replace(m[0], '').replace(bords, '').trim() || 'Dépense';
    return {type:'depense', montant:Number(m[1].replace(',', '.')), libelle, categorie:devinerCategorie(libelle)}; }
  const quand = lireQuand(n);
  const verbe = /^(appeler|rappeler|repondre|faire|acheter|reviser|envoyer|terminer|preparer|reserver|payer|verifier|ecrire|prendre|contacter|commander|finir|relire|imprimer|penser|aller|confirmer|regarder|ranger|nettoyer|reparer|planifier|demander|rendre|chercher)\b/.test(n);
  if(verbe || quand.date || quand.heure) return {type:'tache', ...quand};
  return {type:'note'};
}

/* Icône d'état / pied de page : dossier relié (données) */
function actionDossier(){
  const e = etatEcriture();
  if(e === 'hors') return dossierMemorise ? reconnecterDossier() : relierDossier();
  if(e === 'erreur'){ ecr.essais = 0; return dossier ? ecrireDossier(true) : dossierMemorise ? reconnecterDossier() : relierDossier(); }
  if(e === 'indispo'){ location.hash = '#/donnees'; return; }
  toast(ETATS_ECRITURE[e].texte());
}
/* Icône d'état / pied de page / bouton : synchro GitHub */
function actionGitHub(forcer = false){
  const e = etatGitHub();
  if(e === 'erreur' && !forcer){ if(lireRoute().nom !== 'donnees') location.hash = '#/donnees'; toast(gh.erreur); return; }
  if(e === 'cours' && !forcer){ toast(TEXTES_GITHUB.cours()); return; }
  ghSynchroniser('manuel').then(ok => toast(ok ? TEXTES_GITHUB[etatGitHub()]().replace(/ Clique pour.*$/, '') : gh.hors ? 'Toujours pas de réseau : nouvel essai automatique au retour de la connexion.' : gh.erreur));
}
function basculerApercu(el, apercu){
  const champ = el.closest('.champ'), ta = $('textarea', champ), ap = $('.apercu', champ);
  if(apercu) ap.innerHTML = md(ta.value);
  ta.hidden = apercu; ap.hidden = !apercu;

}

const CORPS = {note:id => corpsNote(note(id)), document:id => corpsDocument(unDocument(id))};
function basculerDepliable(carte, ouvert){
  carte.classList.toggle('ouvert', ouvert); etatDepliage[carte.dataset.depliable] = ouvert;
  $$('.chevron', carte).forEach(b => { if(b.closest('[data-depliable]') === carte) b.setAttribute('aria-expanded', ouvert); });
  const corps = $('.depliable-corps, .pliable-corps', carte), src = carte.dataset.corps;
  if(corps && src){
    const [type, id] = [src.slice(0, src.indexOf(':')), src.slice(src.indexOf(':') + 1)];
    if(ouvert && !corps.childElementCount && CORPS[type]) corps.innerHTML = CORPS[type](id);
  }
}
function toutDeplier(prefixe, liste){
  const tous = liste.length && liste.every(x => etatDepliage[prefixe + x.id]);
  liste.forEach(x => etatDepliage[prefixe + x.id] = !tous); rendre();
}

document.addEventListener('click', e => {
  /* Lien vers une note ou un contact : fenêtre sur place (Ctrl+clic garde le comportement normal) */
  const a = e.target.closest('a[href^="#/note/"], a[href^="#/contact/"], a[href^="#/document/"]');
  if(a && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey){ e.preventDefault(); fermerResultats(); ouvrirFicheDepuisLien(a.getAttribute('href')); return; }
  /* Menu vers la page déjà affichée mais filtrée par projet : l'adresse ne change pas, on retire le filtre ici */
  const m = e.target.closest('#menu a[data-route]');
  if(m && filtreProjet && filtreProjet.page === m.dataset.route && location.hash === m.getAttribute('href')){ e.preventDefault(); filtreProjet = null; rendre(); return; }
  const el = e.target.closest('[data-action]');
  if(!el || el.disabled) return;
  /* Un champ, un lien ou un bouton placé dans une zone cliquable (en-tête dépliable) garde son propre rôle */
  if(e.target.closest('a, button, input, select, textarea, label, [data-action]') !== el) return;
  const f = ACTIONS[el.dataset.action]; if(!f) return;
  e.preventDefault();
  f(el, e);
});

    sauver(); toast(t.fait ? 'Tâche terminée' : 'Tâche rouverte');

let focusEnCours = null, minuteurFocus = null;
const DUREE_FOCUS = 25 * 60000;

function demarrerFocus(id){
  const t = tache(id); if(!t) return;
  if(focusEnCours && focusEnCours.taskId === id){ toast('Focus déjà en cours sur cette tâche'); return; }
  focusEnCours = {taskId:id, fin:Date.now() + DUREE_FOCUS};
  try { localStorage.setItem(CLE_FOCUS, JSON.stringify(focusEnCours)); } catch(e){}
  lancerMinuteur(); rendre(); toast('Focus de 25 minutes lancé');
}
function lancerMinuteur(){ clearInterval(minuteurFocus); minuteurFocus = setInterval(tickFocus, 1000); }

  majFocus();
}

/* Pertinence : chaque mot doit être trouvé ; dans le titre il compte plus, surtout en début de mot */
const echapRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function pertinence(e, mots, debuts){
  let score = 0;
  for(const [i, m] of mots.entries()){
    if(e.n.includes(m)) score += debuts[i].test(e.n) ? 3 : 2;
    else if(e.r.includes(m)) score += 1;
    else return 0;
  }
  const q = mots.join(' ');
  score += !q ? 1 : e.n === q ? 4 : e.n.startsWith(q) ? 2 : mots.length > 1 && e.n.includes(q) ? 1 : 0;

}
/* Période d'un filtre de date : « 2026 », « 2026-09 », « 2026-09-15 », « 09/2026 », « 15/09/2026 » → [premier jour, dernier jour] */
function periodeRecherche(v){
  let m;
  if((m = /^(\d{4})$/.exec(v))) return [m[1] + '-01-01', m[1] + '-12-31'];
  if((m = /^(\d{4})-(\d{1,2})$/.exec(v)) || (m = /^(\d{1,2})\/(\d{4})$/.exec(v))){
    const [a, mm] = m[1].length === 4 ? [m[1], m[2]] : [m[2], m[1]], ym = a + '-' + mm.padStart(2, '0');
    return Number(mm) >= 1 && Number(mm) <= 12 ? [ym + '-01', ym + '-' + pad(joursDansMois(ym))] : null;
  }
  const j = dateISO(v); return j ? [j, j] : null;
}
/* Un mot « clé:valeur » ou « clé>valeur » reconnu devient un filtre ; sinon c'est un mot ordinaire */
function filtreRecherche(brut){
  const m = /^([a-zà-ÿ]+)(>=|<=|:|>|<)(.+)$/i.exec(brut); if(!m) return null;
  const cle = norm(m[1]), op = m[2], v = m[3].replace(/^"|"$/g, '').trim(); if(!v) return null;
  if(cle === 'projet' && op === ':'){ const n = norm(v); return e => !!e.pn && e.pn.includes(n); }
  if(cle === 'montant'){
    const x = Number(v.replace(/\s/g, '').replace(',', '.').replace(/€$/, '')); if(!Number.isFinite(x)) return null;
    const t = {':':a => Math.abs(a - x) < .005, '>':a => a > x, '<':a => a < x, '>=':a => a >= x - .005, '<=':a => a <= x + .005}[op];
    return e => e.montant !== null && t(e.montant);
  }
  if(cle === 'date' || cle === 'avant' || cle === 'apres'){
    const p = periodeRecherche(v); if(!p) return null;
    const [d, f] = p, sens = cle === 'avant' ? '<' : cle === 'apres' ? '>' : op;
    const t = {':':j => j >= d && j <= f, '>':j => j > f, '<':j => j < d, '>=':j => j >= d, '<=':j => j <= f}[sens];
    return t ? e => !!e.jour && t(e.jour) : null;
  }
  return null;
}
/* « #tag » filtre sur les tags (exacts) ; « projet:… », « montant>… », « date:… » sont des filtres ; les autres mots sont cherchés partout */
function lireRequete(q){
  const bruts = String(q || '').match(/[^\s:"<>=]+(?:>=|<=|:|>|<)"[^"]*"?|\S+/g) || [];
  const filtres = [], reste = [];
  bruts.forEach(b => { const f = b.startsWith('#') ? null : filtreRecherche(b); if(f) filtres.push(f); else reste.push(b); });
  const tags = reste.filter(m => m.startsWith('#') && m.length > 1).map(m => norm(m.replace(/^#+/, ''))).filter(Boolean);
  const mots = reste.filter(m => !m.startsWith('#')).map(m => norm(m.replace(/"/g, ''))).filter(Boolean);
  return {tags, mots, filtres, surligner:[...mots, ...tags]};
}
function rechercher(q){
  const {tags, mots, filtres, surligner} = lireRequete(q);
  const debuts = mots.map(m => new RegExp('(^|[^a-z0-9])' + echapRegex(m)));   /* mot trouvé en début de mot */
  const resultats = !(tags.length || mots.length || filtres.length) ? [] : indexRecherche()
    .filter(e => tags.every(t => e.tn.includes(t)) && filtres.every(f => f(e))).map(e => ({...e, score:pertinence(e, mots, debuts)})).filter(e => e.score > 0)
    .sort((a, b) => b.score - a.score || String(b.date).localeCompare(String(a.date)));
  return {mots:surligner, tags, resultats};
}
/* Regroupe par module ; le module qui contient le meilleur résultat vient en premier */
const groupesRecherche = resultats => MODULES_RECHERCHE.map(m => ({m, l:resultats.filter(r => r.m === m.id)})).filter(g => g.l.length).sort((a, b) => b.l[0].score - a.l[0].score);
const cibleLien = r => r.externe ? ' target="_blank" rel="noopener noreferrer"' : '';
/* Surlignage des mots trouvés, sans tenir compte des accents ni des majuscules */
function carteNorm(s){ let n = ''; const pos = []; for(let i = 0; i < s.length; i++){ const c = norm(s[i]); for(let k = 0; k < c.length; k++){ n += c[k]; pos.push(i); } } return {n, pos}; }
function marquer(texte, mots){
  const s = String(texte ?? ''); if(!s || !mots.length) return esc(s);
  const {n, pos} = carteNorm(s), on = new Array(s.length).fill(false);
  mots.forEach(m => { for(let p = n.indexOf(m); p >= 0; p = n.indexOf(m, p + m.length)) for(let k = p; k < p + m.length; k++) on[pos[k]] = true; });
  let h = '', dans = false;
  for(let i = 0; i < s.length; i++){ if(on[i] !== dans){ h += dans ? '</mark>' : '<mark>'; dans = on[i]; } h += esc(s[i]); }
  return h + (dans ? '</mark>' : '');
}
/* Extrait d'un texte long, centré sur le premier mot trouvé (seuls les 20 000 premiers caractères sont parcourus) */
function extraitAutour(texte, mots, taille = 190){
  const s = String(texte || '').slice(0, 20000).replace(/\s+/g, ' ').trim(); if(!s || !mots.length) return '';
  const n = norm(s); let p = -1;
  mots.forEach(m => { const i = n.indexOf(m); if(i >= 0 && (p < 0 || i < p)) p = i; });
  if(p < 0) return '';
  /* norm() garde presque toujours la longueur ; on vérifie avant de s'en servir comme position */
  const pos = n.length === s.length ? p : carteNorm(s.slice(0, Math.min(s.length, p * 2 + 50))).pos[p] ?? 0;
  const debut = Math.max(0, pos - 60), fin = Math.min(s.length, debut + taille);
  return (debut ? '…' : '') + marquer(s.slice(debut, fin), mots) + (fin < s.length ? '…' : '');
}

/* --- Panneau rapide sous la barre --- */
function resultatsGlobaux(q){
  const {mots, resultats} = rechercher(q);
  if(!resultats.length) return `<p class="aide" style="margin:6px 8px">Aucun résultat pour « ${esc(q)} ».</p>`;
  return groupesRecherche(resultats).map(({m, l}) => `<div class="groupe"><div class="etiq" style="padding:2px 9px 4px">${m.nom} · ${l.length}</div>${l.slice(0, 4).map(r =>
    `<a class="resultat" href="${esc(r.h)}"${cibleLien(r)}><span class="tronque">${marquer(r.titre, mots)}</span><span class="r-sous">${r.archive ? 'archivé · ' : ''}${esc(r.sous)}</span></a>`).join('')}</div>`).join('') +
    `<a class="resultat tous" href="#/recherche?q=${encodeURIComponent(q)}">${ico('recherche', 14)}<span>Voir ${resultats.length > 1 ? 'les ' + resultats.length + ' résultats' : 'le résultat'} sur une page</span><kbd>Entrée</kbd></a>`;
}

let ongletRecherche = 'tout', limiteRecherche = 50;
const PAR_PAGE = 50;
function pageRecherche(){
  const q = lireRoute().params.get('q') || '', {tags, mots, filtres} = lireRequete(q);
  const seulTag = tags.length === 1 && !mots.length && !filtres.length;

    `<div class="barre-outils"><label class="filtre recherche-page">${ico('recherche', 16)}<input type="search" id="recherche-page" value="${esc(q)}" placeholder="Rechercher dans tout Life Panel…" autocomplete="off" aria-label="Rechercher" autofocus></label></div>
    <div id="resultats-page">${resultatsPage(q)}</div>`;
}
function ligneResultat(r, mots){
  const m = MODULE_RECHERCHE[r.m], ext = r.long ? extraitAutour(r.long, mots) : '';
  const sous = [r.sous ? marquer(r.sous, mots) : '', r.tags.map(t => `<span class="tag-r">#${marquer(t, mots)}</span>`).join(' ')].filter(Boolean).join(' · ');
  return `<li><a class="resultat-ligne" href="${esc(r.h)}"${cibleLien(r)}>${pastille(m.icone, m.couleur, 30, 15)}<span class="corps"><span class="t">${marquer(r.titre, mots)}${r.archive ? ' <span class="puce">archivé</span>' : ''}${r.externe ? ico('externe', 12) : ''}</span>
    ${sous ? `<span class="s">${sous}</span>` : ''}${ext ? `<span class="extrait-r">${ext}</span>` : ''}</span></a></li>`;
}
function resultatsPage(q){
  if(!q.trim()) return vide('Tape un ou plusieurs mots dans le champ ci-dessus (ou « #tag », « projet:… », « montant>… », « date:… »).');
  const {mots, resultats} = rechercher(q), groupes = groupesRecherche(resultats);
  if(ongletRecherche !== 'tout' && !groupes.some(g => g.m.id === ongletRecherche)) ongletRecherche = 'tout';
  /* Des boutons-filtres (et non des onglets au sens strict) : aria-pressed dit lequel est actif */
  const onglet = (id, nom, n) => `<button class="onglet-r${id === ongletRecherche ? ' actif' : ''}" aria-pressed="${id === ongletRecherche}" data-action="recherche-onglet" data-m="${id}">${nom}<span class="compte">${n}</span></button>`;
  const tete = `<div class="onglets-recherche" aria-label="Filtrer par module">${onglet('tout', 'Tout', resultats.length)}${groupes.map(g => onglet(g.m.id, g.m.nom, g.l.length)).join('')}</div>`;
  if(!resultats.length) return tete + vide(`Aucun résultat pour « ${esc(q)} ».`);
  const carte = ({m, l}, max, plus) => `<section class="carte">${enteteCarte(m.icone, m.couleur, m.nom, `<span class="compte">${l.length}</span>`)}<ul class="liste resultats-page">${l.slice(0, max).map(r => ligneResultat(r, mots)).join('')}</ul>
    ${l.length > max ? (plus ? btnAction('recherche-plus', `Afficher ${Math.min(PAR_PAGE, l.length - max)} de plus (${l.length - max} restants)`, 'btn compact')
      : `<button class="lien-sous" style="margin-top:8px" data-action="recherche-onglet" data-m="${m.id}">Voir les ${l.length} résultats${ico('fleche', 13)}</button>`) : ''}</section>`;
  return tete + (ongletRecherche === 'tout' ? `<div class="pile">${groupes.map(g => carte(g, 6, false)).join('')}</div>` : carte(groupes.find(g => g.m.id === ongletRecherche), limiteRecherche, true));
}
/* Frappe dans le champ de la page : l'adresse suit (sans recharger), seuls les résultats sont redessinés */

const animationsReduites = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Anti-rebond : on attend une courte pause dans la frappe avant de chercher */
const differer = (f, ms) => { let t; const g = (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; g.annuler = () => clearTimeout(t); return g; };
const majRecherchePageDifferee = differer(majRecherchePage, 120);

function telecharger(nom, contenu, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], {type}));
  a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
/* Une cellule qui commence par = + - @ (ou tabulation) serait lue comme une formule par Excel : on la préfixe d'une apostrophe */
const celluleCSV = v => { let s = String(v ?? ''); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function csvFinances(){
  const l = ['date;type;montant;categorie;libelle;projet;compte'];
  DB.mouvements.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(m =>
    l.push([m.date, m.type, String(m.montant).replace('.', ','), m.categorie, m.libelle, nomProjet(m.projet), m.compte].map(celluleCSV).join(';')));
  return '\uFEFF' + l.join('\r\n');
}
/* Choix d'un fichier sur l'ordinateur (import, démo).
   Lecture robuste : un fichier « en ligne uniquement » du lecteur Google Drive (G:)
   ou de OneDrive peut échouer ou arriver vide le temps d'être téléchargé ; on réessaie,
   puis on explique clairement quoi faire au lieu d'un simple message furtif. */
let rappelFichier = null, relanceFichier = 'importer';
function choisirFichier(cb, relance = 'importer'){ rappelFichier = cb; relanceFichier = relance; const i = $('#fichier'); i.value = ''; i.click(); }
async function lireFichierTexte(f){
  let cause = 'erreur';
  for(let essai = 0; essai < 4; essai++){
    try { const t = await f.text(); if(t.trim()) return t; cause = 'vide'; }
    catch(e){ cause = (e && e.name) || 'erreur'; }
    await new Promise(r => setTimeout(r, 600 * (essai + 1)));
  }
  throw new Error(cause);
}
$('#fichier').addEventListener('change', async e => {
  const f = e.target.files[0], cb = rappelFichier, relance = relanceFichier; rappelFichier = null;
  if(!f || !cb) return;
  toast('Lecture de « ' + f.name + ' »…');
  let texte;
  try { texte = await lireFichierTexte(f); }
  catch(err){ return ficheFichierProbleme(f.name, err.message === 'vide' ? 'vide' : 'lecture', relance); }
  cb(texte, f.name);
});
const ASTUCE_DRIVE = `<p class="texte">C’est fréquent avec le lecteur <b>Google Drive (G:)</b> : le fichier est « en ligne uniquement », son contenu n’est pas encore sur l’ordinateur. Deux solutions :</p>
  <ol class="texte" style="padding-left:20px;margin-top:-6px"><li>dans l’Explorateur Windows, clic droit sur le fichier → <b>Google Drive → Disponible hors connexion</b>, puis réessaie ;</li><li>ou copie le fichier sur ton Bureau (par exemple dans LIFE PANEL) et choisis cette copie.</li></ol>`;
function ficheFichierProbleme(nom, cause, relance = 'importer'){
  const textes = {
    lecture:`<p class="texte">Le navigateur n’a pas réussi à lire <b>${esc(nom)}</b>.</p>` + ASTUCE_DRIVE,

    format:`<p class="texte"><b>${esc(nom)}</b> est bien un fichier JSON, mais ce n’est pas une sauvegarde Life Panel : il ne contient ni projets, ni tâches, ni notes, ni documents, ni mouvements, ni contacts.</p>`,
    sansdonnees:`<p class="texte"><b>${esc(nom)}</b> est bien une sauvegarde Life Panel, mais elle est <b>vide</b> : 0 projet, 0 tâche, 0 note, 0 document, 0 mouvement, 0 contact. Elle a sans doute été exportée depuis une version où tes données n’apparaissaient pas (par exemple <code>life-panel.html</code>, qui ne lisait pas les données de la v3.2).</p><p class="texte">Rien n’a été modifié. Choisis une autre sauvegarde, par exemple <code>donnees.json</code> de ton dossier LIFE PANEL.</p>`
  };
  ouvrirModale(teteModale('Rien n’a été importé', 'alerte', 'rose') + textes[cause] +
    `<div class="actions"><button class="btn" data-action="fermer">Fermer</button>${btnAction(relance, 'Choisir un autre fichier…', 'btn p')}</div>`);
}
/* Analyse un texte : {d} si c'est une sauvegarde Life Panel, sinon {cause} */
function analyserSauvegarde(texte){
  let d;
  try { d = JSON.parse(texte); } catch(e){ return {cause:'json'}; }
  if(!d || typeof d !== 'object' || !LISTES_DONNEES.some(k => Array.isArray(d[k]))) return {cause:'format'};
  if(!compter(d)) return {cause:'sansdonnees'};
  return {d};
}
const lireJSON = t => analyserSauvegarde(t).d || null;
async function importerTexte(texte, nom){
  const {d, cause} = analyserSauvegarde(texte);
  if(!d) return ficheFichierProbleme(nom, cause, 'importer');
  const remplace = compter(DB) && !DB.reglages.demo;
  if(!await confirmer({titre:'Importer cette sauvegarde ?', ok:'Importer', danger:false,
    texte:`<b>${esc(nom)}</b> contient ${esc(resume(d))}${derniereModif(d) ? ', modifiées ' + esc(ilya(derniereModif(d))) : ''}.` +
      (remplace ? `<br>Elle remplacera les données actuelles (${esc(resume(DB))}), qui sont gardées en copie de secours.` : '')})) return;
  remplacerDB(d, 'avant un import'); rendre(); toast('Données importées : ' + resume(DB));
}

/* Décale toutes les dates de la démo pour que son « aujourd'hui » soit le vrai aujourd'hui */
function rebaserDemo(src){
  const d = JSON.parse(JSON.stringify(src));
  const L = k => Array.isArray(d[k]) ? d[k] : [];
  /* Référence : la date « reference » du fichier, sinon le moment le plus récent de la démo */
  let refTs = '';
  [...L('projets').map(p => p.modif), ...L('taches').map(t => t.modif), ...L('notes').map(n => n.modif), ...L('inbox').map(x => x.created)]
    .forEach(v => { if(typeof v === 'string' && v.includes('T') && v > refTs) refTs = v; });
  const ref = d.reference || jourDe(refTs);
  if(!ref) return d;
  const e = Math.round((versDate(aujourdhui()) - versDate(ref.slice(0, 10))) / 86400000);
  const decalage = (!d.reference && refTs) ? Date.now() - new Date(refTs).getTime() : e * 86400000;   /* l'élément le plus récent devient « maintenant » */
  if(!e && Math.abs(decalage) < 60000) return d;
  const J = s => (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) ? decaleJour(e, versDate(s)) : s;
  const T = s => { if(typeof s !== 'string' || !s) return s; const t = new Date(s); return isNaN(t) ? s : new Date(t.getTime() + decalage).toISOString(); };
  L('projets').forEach(p => { p.echeance = J(p.echeance); p.modif = T(p.modif); });
  L('taches').forEach(t => { t.date = J(t.date); t.modif = T(t.modif); t.faitLe = T(t.faitLe); });
  L('notes').forEach(n => { n.cree = T(n.cree); n.modif = T(n.modif); });
  L('mouvements').forEach(m => { m.date = J(m.date); m.cree = T(m.cree); m.modif = T(m.modif); });
  L('contacts').forEach(c => { c.derniereConversation = J(c.derniereConversation); c.modif = T(c.modif); });
  L('inbox').forEach(x => { x.created = T(x.created); x.archived = T(x.archived); x.modif = T(x.modif); });
  L('documents').forEach(x => { x.echeance = J(x.echeance); x.ajoute = T(x.ajoute); x.modif = T(x.modif); });
  if(d.reglages) d.reglages.lastReview = T(d.reglages.lastReview);
  return d;
}

/* --- Dossier LIFE PANEL (Chrome, Edge, Opera) : donnees.json + finances.csv ---
   Chaque modification est écrite dans le dossier relié (400 ms après la dernière),
   puis le fichier est relu pour vérifier qu'il contient bien ce qui a été écrit.
   L'icône à côté de la roue crantée montre l'état : écrit, en cours, échec, à relier. */
const fsDispo = () => 'showDirectoryPicker' in window;
/* nonEcrit : des modifications ne sont pas encore dans donnees.json */
const ecr = {enAttente:false, enCours:null, aRefaire:false, erreur:'', faiteA:null, nonEcrit:false, essais:0, reessai:null, dejaDemande:false};
let tEcriture;
const ERREURS_ECRITURE = {
  autorisation:'Le navigateur n’autorise plus l’écriture dans le dossier.',
  introuvable:'Le dossier ou le fichier est introuvable (déplacé ou renommé ?).',
  relecture:'Le fichier relu ne correspond pas à ce qui a été écrit.',
  ecriture:'L’écriture dans donnees.json a échoué (fichier ouvert ailleurs ou synchronisation en cours ?).'
};
function etatEcriture(){
  if(DB.reglages.demo) return 'demo';
  if(!fsDispo()) return 'indispo';
  if(ecr.enCours || ecr.enAttente) return 'cours';
  if(ecr.erreur) return 'erreur';
  if(!dossier) return 'hors';
  return ecr.nonEcrit ? 'cours' : 'ok';
}
const ETATS_ECRITURE = {
  ok:{icone:'check', texte:() => `Tout est écrit dans donnees.json${ecr.faiteA ? ' (' + heure(ecr.faiteA) + ')' : ''}, dossier « ${dossier ? dossier.name : ''} ».`},
  cours:{icone:'sync', texte:() => 'Écriture dans donnees.json en cours…'},
  erreur:{icone:'croix', texte:() => (ERREURS_ECRITURE[ecr.erreur] || ERREURS_ECRITURE.ecriture) + ' Clique pour réessayer.'},
  hors:{icone:'alerte', texte:() => dossierMemorise
    ? `Dossier « ${dossierMemorise.name} » à reconnecter${ecr.nonEcrit ? ' : tes dernières modifications ne sont pas encore dans donnees.json' : ''}. Clique pour le reconnecter.`
    : `Aucun dossier relié${ecr.nonEcrit ? ' : tes modifications ne sont que dans ce navigateur' : ''}. Clique pour relier ton dossier LIFE PANEL.`},
  demo:{icone:'ampoule', texte:() => 'Mode démo : rien n’est écrit dans donnees.json.'},
  indispo:{icone:'base', texte:() => 'Ce navigateur ne peut pas écrire dans un dossier : utilise l’export (page Données).'}
};
function majIndicateur(){
  const e = etatEcriture(), d = ETATS_ECRITURE[e], t = d.texte();
  const z = $('.etat-dossier');   /* état du dossier relié, sur la page Données */
  if(z){ z.className = 'etat-dossier ' + e; z.innerHTML = ico(d.icone, 15) + '<span>' + esc(t.replace(/ Clique pour.*$/, '')) + '</span>'; }
  const g = ghActif() ? etatGitHub() : null, zg = $('.etat-github');
  if(zg && g){ zg.className = 'etat-github ' + g; zg.innerHTML = ico(ETATS_ECRITURE[g].icone, 15) + '<span>' + esc(TEXTES_GITHUB[g]().replace(/ Clique pour.*$/, '')) + '</span>'; }
  const b = $('#etat-ecriture'); if(!b) return;
  /* Avec la synchro GitHub, l'icône montre la synchro ; sinon l'écriture dans le dossier relié */
  const eb = g || e, src = g ? 'github' : 'dossier', tb = g ? TEXTES_GITHUB[g]() : t;
  if(b.dataset.etat !== eb || b.dataset.src !== src){ b.dataset.etat = eb; b.dataset.src = src; b.innerHTML = ico(ETATS_ECRITURE[eb].icone, 17, 'currentColor', eb === 'ok' || eb === 'erreur' ? 2.4 : 1.9); }
  b.title = tb; b.setAttribute('aria-label', (g ? 'Synchronisation GitHub : ' : 'Écriture des données : ') + tb);
}
function planifierEcritureDossier(){
  if(DB.reglages.demo || !fsDispo()){ majIndicateur(); return; }
  ecr.nonEcrit = true;
  if(!dossier){ reconnecterSurChangement(); majIndicateur(); return; }
  clearTimeout(tEcriture); ecr.enAttente = true; majIndicateur();
  tEcriture = setTimeout(() => ecrireDossier(), 400);
}
/* Dossier mémorisé mais pas encore autorisé depuis l'ouverture du navigateur :
   la première modification (un clic) suffit à redemander l'autorisation, une fois par session. */
function reconnecterSurChangement(){
  const h = dossierMemorise, clic = navigator.userActivation ? navigator.userActivation.isActive : false;
  if(!h || ecr.dejaDemande || !clic) return;
  ecr.dejaDemande = true;
  h.requestPermission({mode:'readwrite'}).then(p => { if(p === 'granted') brancherDossier(h, {auto:true}); else majIndicateur(); }).catch(() => majIndicateur());
}
async function ecrireFichier(nom, texte, h = dossier){
  const f = await h.getFileHandle(nom, {create:true}), w = await f.createWritable();
  await w.write(texte); await w.close();
}
async function lireFichierDossier(nom, h = dossier){ const f = await (await h.getFileHandle(nom)).getFile(); return {texte:await f.text(), date:f.lastModified}; }
const horodatage = () => aujourdhui() + '-' + heure().replace(':', 'h');
function ecrireDossier(manuel = false){
  clearTimeout(tEcriture); ecr.enAttente = false;
  if(!dossier || DB.reglages.demo){
    if(manuel === true) toast(DB.reglages.demo ? 'Mode démo : rien n’est écrit dans le dossier.' : 'Aucun dossier relié.');
    majIndicateur(); return Promise.resolve(false);
  }
  if(ecr.enCours){ ecr.aRefaire = true; return ecr.enCours; }
  const h = dossier, texte = JSON.stringify(DB, null, 2), maj = DB.reglages.maj, vide = !compter(DB);
  ecr.enCours = (async () => {
    try {
      /* Jamais de fichier vidé sans copie : si on écrit une base vide sur un fichier plein, on garde l'ancien */
      if(vide){ try { const a = await lireFichierDossier('donnees.json', h); if(compter(lireJSON(a.texte))) await ecrireFichier('donnees-avant-effacement-' + horodatage() + '.json', a.texte, h); } catch(e){} }
      await ecrireFichier('donnees.json', texte, h);
      if((await lireFichierDossier('donnees.json', h)).texte !== texte) throw new Error('relecture');
      await ecrireFichier('finances.csv', csvFinances(), h);
      ecr.erreur = ''; ecr.essais = 0; ecr.faiteA = new Date();
      if(DB.reglages.maj === maj) ecr.nonEcrit = false;
      if(manuel === true) toast('Données écrites dans « ' + h.name + ' »');
      return true;
    } catch(e){
      const n = e && e.name;
      ecr.erreur = n === 'NotAllowedError' || n === 'SecurityError' ? 'autorisation' : n === 'NotFoundError' ? 'introuvable' : e && e.message === 'relecture' ? 'relecture' : 'ecriture';
      if(ecr.erreur === 'autorisation' || ecr.erreur === 'introuvable') dossier = null;
      else if(ecr.essais++ < 2){ clearTimeout(ecr.reessai); ecr.reessai = setTimeout(() => { if(ecr.erreur) ecrireDossier(); }, 4000); }   /* 2 nouvelles tentatives */
      if(manuel === true) toast(ERREURS_ECRITURE[ecr.erreur]);
      return false;
    } finally {
      ecr.enCours = null;
      if(ecr.aRefaire){ ecr.aRefaire = false; if(dossier && ecr.nonEcrit) ecrireDossier(); }
      majIndicateur(); majPied();
    }
  })();
  majIndicateur();
  return ecr.enCours;
}
async function relierDossier(){
  if(!fsDispo()){ toast('Ce navigateur ne peut pas écrire dans un dossier. Utilise Chrome, Edge ou Opera.'); return; }
  let h;
  try { h = await window.showDirectoryPicker({id:'lifepanel', mode:'readwrite'}); }
  catch(e){ if(e && e.name !== 'AbortError') toast('Accès au dossier refusé.'); return; }
  await brancherDossier(h);
}
async function reconnecterDossier(){
  const h = dossierMemorise; if(!h) return relierDossier();
  try { if(await h.requestPermission({mode:'readwrite'}) !== 'granted'){ toast('Autorisation refusée.'); return; } }
  catch(e){ return relierDossier(); }
  await brancherDossier(h, {auto:true, annonce:true});
}
/* Relie un dossier et met d'accord le navigateur et donnees.json.
   auto (démarrage, reconnexion) : si le fichier est identique, rien à faire ; si le navigateur est plus
   récent, il est écrit sans question ; si le fichier est plus récent, on demande. */
async function brancherDossier(h, {auto = false, annonce = !auto} = {}){
  let fichier = null, contenu = null;
  try { fichier = await lireFichierDossier('donnees.json', h); contenu = lireJSON(fichier.texte); } catch(e){}
  dossier = h; dossierMemorise = h; ecr.erreur = ''; ecr.essais = 0;
  try { await idbEcrire('dossier', h); } catch(e){}
  if(auto && DB.reglages.demo){ majIndicateur(); majPied(); if(annonce) toast('Dossier relié : ' + h.name); return; }
  const identiques = !!contenu && JSON.stringify(normaliser(contenu)) === JSON.stringify(DB);
  if(identiques){ ecr.nonEcrit = false; ecr.faiteA = new Date(fichier.date); }
  else {
    if(contenu && compter(contenu)){
      const fichierPlusRecent = derniereModif(contenu) > derniereModif(DB);
      let prendre = !aDesDonnees(DB) || DB.reglages.demo;
      if(!prendre && (!auto || fichierPlusRecent)) prendre = await confirmer({titre:'Le dossier contient d’autres données', danger:false, ok:'Prendre celles du dossier', annuler:'Garder celles du navigateur',
        texte:`<code>donnees.json</code> contient ${esc(resume(contenu))}${derniereModif(contenu) ? ', modifiées ' + esc(ilya(derniereModif(contenu))) : ''}.<br>Ce navigateur contient ${esc(resume(DB))}${derniereModif(DB) ? ', modifiées ' + esc(ilya(derniereModif(DB))) : ''}.<br><br>Rien n’est perdu : l’autre version est gardée (copie de secours, ou fichier de sauvegarde dans le dossier).`});
      if(prendre) remplacerDB(contenu, 'avant le chargement du dossier');
      else if(!auto || fichierPlusRecent) await ecrireFichier('donnees-avant-' + horodatage() + '.json', fichier.texte, h).catch(() => {});
    }
    ecr.nonEcrit = true;
    await ecrireDossier();
  }
  rendre(); majIndicateur();
  if(annonce) toast('Dossier relié : ' + h.name + (identiques ? ' · donnees.json est à jour' : ''));
}

/* ==========================================================================
   O. DRIVE : les fichiers d'un dossier Google Drive synchronisé (lecture seule)
   Un « dossier de départ » est relié une fois par appareil (PC : Google Drive pour ordinateur ;
   Android : fenêtre de choix de dossier, où Google Drive figure). Chaque projet peut pointer vers
   un sous-dossier, repéré par son chemin depuis le dossier de départ (le même sur tous les appareils).
   Rien n'est jamais écrit dans ce dossier. Un clic sur un fichier l'ouvre dans un nouvel onglet
   (sur Android : dans la visionneuse du téléphone).
   ========================================================================== */
const drive = {racine:null, memo:null, etat:'aucun', cache:new Map(), lectures:new Map(), explos:{}, gen:0};
const DRIVE_FRAIS = 5 * 60000;   /* une liste lue il y a moins de 5 minutes est réutilisée telle quelle */
const joindre = (...l) => l.filter(Boolean).join('/');
/* Fichiers techniques (Google Drive, Windows, Office) : jamais affichés */
const fichierCache = nom => /^(desktop\.ini|thumbs\.db|icon\r)$/i.test(nom) || nom.startsWith('~$') || nom.startsWith('.');
/* État : indispo (navigateur sans accès aux dossiers) · aucun (rien de relié) · autoriser (un clic suffit)
   · choisir (Android : il faut rechoisir le dossier) · ok */
const etatDrive = () => fsDispo() ? drive.etat : 'indispo';
async function initDrive(){
  if(!fsDispo() || !stockage.idb) return;
  let h = null; try { h = await idbLire('drive'); } catch(e){ h = null; }
  if(!h){ drive.etat = 'aucun'; return; }
  drive.memo = h;
  let p = 'prompt'; try { p = await h.queryPermission({mode:'read'}); } catch(e){ p = 'denied'; }
  if(p === 'granted'){ drive.racine = h; drive.etat = 'ok'; } else drive.etat = p === 'denied' ? 'choisir' : 'autoriser';
}
function brancherDrive(h){
  drive.racine = h; drive.memo = h; drive.etat = 'ok'; drive.cache.clear(); drive.lectures.clear(); drive.gen++;
  idbEcrire('drive', h).catch(() => {});
}
function majDrive(){ rendre(); remplirExplos(); }
async function relierDrive(){
  if(!fsDispo()){ toast('Ce navigateur ne sait pas lire un dossier (utilise Chrome, Edge ou Opera).'); return false; }
  let h;
  try { h = await window.showDirectoryPicker({id:'lifepanel-drive', mode:'read'}); }
  catch(e){ if(e && e.name !== 'AbortError') toast('Accès au dossier refusé.'); return false; }
  const ancien = drive.memo && drive.memo.name;
  brancherDrive(h); majDrive();
  toast('Dossier Drive relié : ' + h.name + (ancien && ancien !== h.name ? ' (à la place de « ' + ancien + ' »)' : ''));
  return true;
}
/* Accès pour la session : un clic sur PC et Chrome Android ; sur Opera Android, on rechoisit le dossier */
async function accesDrive(){
  const m = drive.memo; if(!m) return relierDrive();
  if(drive.etat === 'autoriser'){
    let p = 'denied'; try { p = await m.requestPermission({mode:'read'}); } catch(e){ p = 'denied'; }
    if(p === 'granted'){ drive.racine = m; drive.etat = 'ok'; majDrive(); return true; }
    drive.etat = 'choisir'; majDrive();
    toast('Le navigateur n’a pas redonné l’accès : clique encore une fois et choisis le dossier « ' + m.name + ' ».');
    return false;
  }
  let h;
  try { h = await window.showDirectoryPicker({id:'lifepanel-drive', mode:'read'}); }
  catch(e){ if(e && e.name !== 'AbortError') toast('Accès au dossier refusé.'); return false; }
  let meme = h.name === m.name; try { meme = (await h.isSameEntry(m)) || meme; } catch(e){ /* ancienne poignée périmée : on se fie au nom */ }
  brancherDrive(h); majDrive();
  if(!meme) toast('Nouveau dossier de départ : « ' + h.name + ' » (avant : « ' + m.name + ' »). Les dossiers des projets sont cherchés depuis celui-ci.');
  return true;
}
async function dossierDrive(chemin){
  let h = drive.racine;
  for(const seg of chemin ? chemin.split('/') : []) h = await h.getDirectoryHandle(seg);
  return h;
}
/* Liste d'un dossier (dossiers d'abord). Au premier accès, l'appli Google Drive d'Android peut renvoyer
   une liste vide le temps de charger le dossier : on relit deux fois avant de conclure « dossier vide ». */
function listerDrive(chemin, forcer = false){
  const c = drive.cache.get(chemin);
  if(c && !forcer && Date.now() - c.t < DRIVE_FRAIS) return Promise.resolve(c);
  if(drive.lectures.has(chemin)) return drive.lectures.get(chemin);
  const gen = drive.gen;
  const p = (async () => {
    const lire = async () => { const dir = await dossierDrive(chemin), l = [];
      for await (const [nom, h] of dir.entries()) if(!fichierCache(nom)) l.push({nom, dossier:h.kind === 'directory'});
      return l; };
    let l = await lire();
    for(let essai = 0; !l.length && essai < 2; essai++){ await new Promise(r => setTimeout(r, 1200 * (essai + 1))); l = await lire(); }
    l.sort((a, b) => (b.dossier - a.dossier) || a.nom.localeCompare(b.nom, 'fr', {numeric:true, sensitivity:'base'}));
    const r = {t:Date.now(), items:l}; if(gen === drive.gen) drive.cache.set(chemin, r); return r;   /* lecture de l'ancien dossier : ignorée */
  })().finally(() => { if(drive.lectures.get(chemin) === p) drive.lectures.delete(chemin); });
  drive.lectures.set(chemin, p);
  return p;
}
function accesPerdu(){ drive.racine = null; drive.etat = drive.memo ? 'autoriser' : 'aucun'; drive.gen++; }
const estRefus = e => !!e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
const estIntrouvable = e => !!e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');
/* Ouvrir un fichier : ce que le navigateur sait afficher (PDF, images, texte, audio, vidéo) s'ouvre dans un
   nouvel onglet ; le reste (Word, Excel…) est téléchargé sous son nom, prêt à ouvrir dans son appli.
   Un fichier HTML, SVG, XML ou JS est toujours téléchargé : ouvert depuis LIFE PANEL, il pourrait lire
   tes données (et ta clé GitHub). */
const EXT_RISQUEES = /^(html?|xhtml|svg|xml|js|mjs)$/, RACCOURCIS_GOOGLE = /^g(doc|sheet|slides|draw|form|map|site)$/;
const TYPES_RISQUES = /^(text\/html|application\/xhtml\+xml|image\/svg\+xml|text\/xml|application\/xml|(text|application)\/(x-)?(java|ecma)script)(;|$)/i;
const EXT_AFFICHABLES = /^(pdf|png|jpe?g|gif|webp|bmp|avif|txt|mp3|m4a|mp4|webm|ogg|oga|ogv|wav)$/;
function lancerLien(url, nomTelechargement = ''){
  const a = document.createElement('a'); a.href = url; a.rel = 'noopener';
  if(nomTelechargement) a.download = nomTelechargement; else a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
async function ouvrirDrive(chemin){
  if(etatDrive() !== 'ok'){
    if(etatDrive() === 'indispo'){ toast('Ce navigateur ne sait pas lire un dossier.'); return; }
    if(await accesDrive()) toast('Accès au Drive autorisé : clique de nouveau sur le document pour l’ouvrir.');
    return;
  }
  const i = chemin.lastIndexOf('/'), nom = chemin.slice(i + 1), ext = extensionDe(nom);
  let f;
  try { f = await (await (await dossierDrive(i > 0 ? chemin.slice(0, i) : '')).getFileHandle(nom)).getFile(); }
  catch(e){
    if(estRefus(e)){ accesPerdu(); majDrive(); toast('L’accès au dossier Drive a expiré : clique sur « Accéder aux documents ».'); }
    else toast(estIntrouvable(e) ? 'Fichier introuvable dans ton dossier Drive : « ' + chemin + ' » (renommé ou déplacé ?)' : 'Lecture impossible dans le Drive (' + ((e && e.name) || 'erreur') + ').');
    return;
  }
  if(RACCOURCIS_GOOGLE.test(ext)){   /* Google Docs, Sheets… : le fichier sur le disque n'est qu'un raccourci */
    let url = '';
    try { const j = JSON.parse(await f.text()); url = j.url || (j.doc_id ? 'https://drive.google.com/open?id=' + encodeURIComponent(j.doc_id) : ''); } catch(e){ url = ''; }
    if(/^https:\/\/(docs|drive)\.google\.com\//.test(url)){ lancerLien(url); return; }
  }
  const risque = EXT_RISQUEES.test(ext) || TYPES_RISQUES.test(f.type), afficher = !risque && EXT_AFFICHABLES.test(ext);
  const u = URL.createObjectURL(risque ? new Blob([f], {type:'application/octet-stream'}) : f);
  lancerLien(u, afficher ? '' : nom); setTimeout(() => URL.revokeObjectURL(u), 120000);
  if(risque) toast('« ' + nom + ' » est téléchargé plutôt qu’ouvert, par sécurité.');
  else if(!afficher) toast('« ' + nom + ' » est téléchargé : ouvre-le depuis les téléchargements du navigateur.');
}

/* --- Explorateur : id → {base, sous, mode, projet}
   mode : 'projet' (tuile d'un projet) · 'parcourir' (onglet « Mon Drive ») · 'choisir-dossier' (dossier d'un projet)
   · 'choisir-fichier' (lien d'une fiche Document). Rendu tout de suite depuis la mémoire, lecture en arrière-plan. */
function explorateurDrive(id, {base = '', mode = 'parcourir', projet = null, sous = '', neuf = false} = {}){
  const st = drive.explos[id];
  if(neuf || !st || st.base !== base || st.mode !== mode) drive.explos[id] = {base, sous, mode, projet};
  else st.projet = projet;
  return `<div class="drive-explo" data-explo="${esc(id)}">${contenuExplo(id)}</div>`;
}
function contenuExplo(id){
  const st = drive.explos[id]; if(!st) return '';
  const e = etatDrive();
  if(e === 'indispo') return '<p class="aide" style="margin:0">Ce navigateur ne sait pas lire un dossier : ouvre LIFE PANEL avec Chrome, Edge ou Opera.</p>';
  if(e === 'aucun') return `<p class="aide">Aucun dossier Drive relié sur cet appareil. Choisis le dossier qui contient tes documents (par exemple « LIFE PANEL » dans ton Google Drive) : c’est à faire une seule fois par appareil.</p>
    <div class="boutons">${btnAction('drive-relier', ico('dossier', 14) + 'Relier mon dossier Drive', 'btn p compact')}</div>`;
  if(e !== 'ok') return `<p class="aide">Pour afficher les fichiers, autorise l’accès au dossier « ${esc(drive.memo ? drive.memo.name : '')} » : une fois par session${e === 'choisir' ? ', en le choisissant de nouveau' : ''}.</p>
    <div class="boutons">${btnAction('drive-acces', ico('dossierOuvert', 14) + 'Accéder aux documents', 'btn p compact')}</div>`;
  const chemin = joindre(st.base, st.sous), c = drive.cache.get(chemin), d = `data-explo="${esc(id)}"`;
  const segs = st.sous ? st.sous.split('/') : [];
  const etape = (nom, sous, icone = '') => `<button type="button" class="puce" data-action="drive-aller" ${d} data-sous="${esc(sous)}">${icone}${esc(nom)}</button>`;
  const fil = [etape(st.base ? nomFichier(st.base) : drive.racine.name, '', ico('dossier', 12)), ...segs.map((s, i) => etape(s, segs.slice(0, i + 1).join('/')))].join('<span class="drive-sep">›</span>');
  const outils = btnAction('drive-actualiser', ico('sync', 14), 'icone-btn', d + ' title="Actualiser" aria-label="Actualiser"') +
    (st.mode === 'choisir-dossier' ? btnAction('drive-choisir-dossier', ico('check', 13) + 'Choisir ce dossier', 'btn p compact', d) : '');
  let corps;
  if(!c) corps = '<p class="aide" style="margin:0">Lecture du dossier…</p>';
  else if(c.erreur) corps = `<p class="aide" style="margin:0">${c.erreur === 'introuvable' ? `Dossier introuvable dans ton Drive : « ${esc(chemin || drive.racine.name)} » (renommé ou déplacé ?).` : 'Lecture impossible pour le moment.'}</p>` +
    (c.erreur === 'introuvable' && st.mode === 'projet' && st.projet ? `<div class="boutons" style="margin-top:10px">${btnAction('drive-projet-choisir', 'Choisir un autre dossier', 'btn compact', `data-projet="${esc(st.projet)}"`)}</div>` : '');
  else if(!c.items.length) corps = '<p class="aide" style="margin:0">Dossier vide.</p>';
  else corps = `<ul class="liste drive-liste">${c.items.map(x => ligneExplo(id, st, chemin, x)).join('')}</ul>`;
  return `<div class="drive-fil">${fil}<span class="drive-outils">${outils}</span></div>${corps}`;
}
function ligneExplo(id, st, chemin, x){
  const complet = joindre(chemin, x.nom);
  if(x.dossier) return `<li><button type="button" class="drive-nom" data-action="drive-aller" data-explo="${esc(id)}" data-sous="${esc(joindre(st.sous, x.nom))}">${ico('dossier', 15, 'var(--i-jaune)')}<span>${esc(x.nom)}</span></button></li>`;
  const t = typeDocument('drive:' + complet), icone = ico(t.icone, 15, `var(--i-${t.couleur})`);
  if(st.mode === 'choisir-dossier') return `<li><span class="drive-nom inactif">${icone}<span>${esc(x.nom)}</span></span></li>`;
  if(st.mode === 'choisir-fichier') return `<li><button type="button" class="drive-nom" data-action="drive-choisir-fichier" data-chemin="${esc(complet)}" title="Choisir ce fichier">${icone}<span>${esc(x.nom)}</span></button></li>`;
  const fiche = DB.documents.find(y => y.url === 'drive:' + complet && !y.archive);
  const suivi = fiche ? `${badgeEcheance(fiche)}${btnAction('document-ouvrir', ico('document', 14), 'icone-btn', `data-id="${esc(fiche.id)}" title="Fiche : ${esc(fiche.titre)}" aria-label="Fiche du document"`)}`
    : btnAction('drive-suivre', ico('calendrier', 14), 'icone-btn', `data-chemin="${esc(complet)}"${st.projet ? ` data-projet="${esc(st.projet)}"` : ''} title="Suivre l’échéance : créer une fiche Document" aria-label="Suivre l’échéance"`);
  return `<li>${boutonDrive(complet, 'drive-nom', icone + `<span>${esc(x.nom)}</span>`, 'Ouvrir « ' + x.nom + ' » dans un nouvel onglet')}<span class="drive-suivi">${suivi}</span></li>`;
}
/* Remplit les explorateurs affichés (page et fenêtre) : lecture si la liste manque ou date de plus de 5 min */
function remplirExplos(){
  $$('[data-explo]').forEach(el => {
    const id = el.dataset.explo, st = drive.explos[id]; if(!st) return;
    if(etatDrive() !== 'ok') return;
    const chemin = joindre(st.base, st.sous), c = drive.cache.get(chemin);
    if(!c || Date.now() - c.t > DRIVE_FRAIS) chargerExplo(chemin);
  });
}
async function chargerExplo(chemin, forcer = false){
  if(etatDrive() !== 'ok') return;
  try { await listerDrive(chemin, forcer); }
  catch(e){
    if(estRefus(e)) accesPerdu();
    else drive.cache.set(chemin, {t:Date.now() - DRIVE_FRAIS + 20000, erreur:estIntrouvable(e) ? 'introuvable' : 'lecture', items:[]});   /* nouvel essai dans 20 s */
  }
  $$('[data-explo]').forEach(x => { const s = drive.explos[x.dataset.explo]; if(s && (etatDrive() !== 'ok' || joindre(s.base, s.sous) === chemin)) x.innerHTML = contenuExplo(x.dataset.explo); });
}
function majExplo(id, forcer = false){
  const st = drive.explos[id]; if(!st) return;
