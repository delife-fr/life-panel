<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sécurité : la page ne peut se connecter qu'à elle-même et à l'API GitHub (ta clé ne peut partir nulle part ailleurs),
     aucun script ni style venu d'un autre site, aucune page intégrée (iframe), aucun plug-in. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Life Panel</title>
<meta name="theme-color" content="#1b1b1d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  ============================================================================
  LIFE PANEL — v3.15
  ============================================================================
  Un seul fichier : structure (HTML) + style (CSS) + comportement (JS).
  Aucune bibliothèque externe. Seule connexion possible (v3.13, si tu l'actives) : ton
  dépôt GitHub privé, pour avoir les mêmes données sur le PC et le téléphone.

  v3.4 : notes rangées en dossiers (tags) et ouvertes en fenêtre ; fiche
  contact en grand, modifiable ; documents (liens) dans les projets ; tuile
  Mouvements repliable ; graphique « 6 derniers mois » cliquable.
  v3.5 : écriture de donnees.json vérifiée à chaque modification, icône d'état
  à côté de la roue crantée, confirmation si on quitte avant l'écriture ;
  tâches de nouveau en liste.
  v3.6 : création de projet réparée (champ « documents » manquant) ; chaque
  élément créé passe par la même forme que les données lues (FORMES) ; une
  page qui plante affiche un message au lieu de rester figée.
  v3.7 : page de résultats de recherche (pertinence, surlignage, onglets) ;
  archives (tâches terminées le lendemain, notes, contacts) ; corbeille de
  30 jours pour toutes les suppressions (les confirmations sont gardées).
  v3.8 : module Documents (lien facultatif, échéance + préavis, Renouvelé,
  tâche proposée) ; tags communs à tâches, notes, documents, contacts
  (« #tag » dans la recherche) ; recherche bien plus rapide (index gardé en
  mémoire, formats de dates réutilisés) ; restauration dans n'importe quel ordre.
  v3.9 : données du navigateur dans IndexedDB (plus de plafond vers 5 Mo, copie
  légère gardée dans localStorage tant qu'elles sont petites) ; accueil allégé
  (journal et calendrier en un seul passage) ; notes affichées par 50, les plus
  récentes d'abord ; menu avec le nom de chaque module jusqu'à 1 280 px.
  v3.10 : liste des comptes gérée comme les catégories (liste déroulante, création
  depuis le formulaire, renommer = toutes les dépenses suivent, fusion à la casse
  près) ; case « pris en compte dans les statistiques » par compte (aussi en haut de
  Finances) ; budget par compte, par mois ou par an ; case « Cette année ».
  v3.11 : graphique « Par catégorie » avec toutes les catégories (plus de « Autres »),
  « À catégoriser » à part, anneau agrandi ; chaque catégorie garde sa couleur
  (enregistrée, suit le renommage, libérée à la suppression ; 8 teintes unies
  puis les mêmes rayées).
  v3.12 : page Finances réorganisée — plus de « Cumul du mois / de l'année » ;
  « Par catégorie » sur toute la largeur avec un tableau (barre, montant, %, nombre
  d'opérations) ; un clic sur une catégorie n'affiche plus que ses mouvements ; juste
  en dessous, les mouvements, ouverts, 20 par 20, triables par date, libellé,
  catégorie, projet, compte ou montant (clic sur l'en-tête, nouveau clic = sens inverse).
  Page Tâches : la « File d'exécution » affiche les 20 premières tâches, puis 20 de plus.
  Contacts : téléphone (cliquable pour appeler) et adresse postale, facultatifs (données VERSION 12) ;
  « Autre téléphone », facultatif et cliquable lui aussi (données VERSION 13) ;
  « E-mail », facultatif, format contrôlé, cliquable pour écrire (données VERSION 14).
  Notes (Markdown) : listes de cases à cocher « - [ ] » / « - [x] » (cliquables dans une note
  enregistrée), texte barré « ~~ », tableaux « | a | b | », citations « > », séparateurs « --- »,
  liens relatifs (ex. Documents/fichier.pdf), blocs de code « ``` » / « ~~~ », listes imbriquées
  (retrait), numérotation continue malgré les lignes vides, titres # à ###### de tailles distinctes.
  v3.13 : en ligne sur GitHub Pages et installable comme une appli (icône, plein écran, hors ligne :
  manifest.webmanifest + sw.js). Synchronisation GitHub (page Données) : donnees.json dans un dépôt
  PRIVÉ, une clé par appareil gardée dans le navigateur ; lecture à l'ouverture, au retour sur la page
  et toutes les 30 secondes, écriture quelques secondes après la dernière modification. Protection contre
  la double modification : GitHub refuse une écriture si le fichier a changé depuis la dernière lecture ;
  on relit et on fusionne (base commune, élément par élément puis champ par champ ; même champ modifié
  des deux côtés : la version la plus récente gagne, l'autre va dans la corbeille). Documents : dossier
  Google Drive relié une fois par appareil (lecture seule) ; chaque projet peut afficher un sous-dossier ;
  onglet « Mon Drive » ; « Suivre l'échéance » crée une fiche ; une fiche peut pointer vers un fichier du
  Drive (lien « drive:chemin »). Données VERSION 15 (dossier des projets, versions remplacées).
  v3.14 : synchro plus légère — conversion base64 native (la page ne se fige plus à l'envoi), vérification
  « conditionnelle » (rien n'est téléchargé si le fichier n'a pas changé), gros fichier lu par sa version
  exacte ; appli installée : copie gardée si le réseau ne répond pas en 3 s. Bouton Retour : il ferme la
  fenêtre ouverte. Montants plafonnés à 1 000 000 €, dates impossibles refusées, durées négatives ignorées,
  CSV protégé contre les formules Excel, 29 février fêté le 28 les années non bissextiles. Recherche avec
  filtres (projet:, montant>, montant<, date:, avant:, après:). Règle de sécurité (CSP) : connexions limitées
  à l'API GitHub. Données VERSION 16 (date de modification des mouvements et de l'Inbox).
  v3.15 : notifications (page Données) : résumé du matin, rappel des tâches à l'heure, anniversaires, documents,
  envoyés par GitHub Actions depuis le dépôt privé (notifications/rappels.js, toutes les 30 min) et affichés par
  Android ou Windows même LIFE PANEL fermée ; heures calmes 0 h – 6 h, à l'heure de chaque appareil.

  v3.3 = fusion de life-panel-v3.2.html et de life-panel.html, réécrite en une
  seule architecture :
    - un seul modèle de données, un seul routeur, un seul gestionnaire d'actions ;
    - plus aucune fonction écrite deux fois ni « couche » qui en remplace une autre ;
    - toutes les fonctions des deux versions réunies (voir la page Données > À propos).

  DONNÉES
    - Enregistrées dans le navigateur (clé « lifepanel »). Au premier lancement,
      Life Panel reprend les données de la v3.2 (« lifepanel.v1 ») ou de
      life-panel.html (« lifepanel.v6 ») ; les anciennes clés ne sont pas effacées.
    - Option : dossier LIFE PANEL relié → donnees.json + finances.csv écrits à
      chaque modification, puis relus pour vérification (Chrome, Edge, Opera).
    - La démo vient du fichier demo-data.json (page Données > Charger la démo).
      Elle n'est jamais chargée toute seule, ses dates sont recalées sur
      aujourd'hui, et une copie de secours de tes données est gardée.

  RACCOURCIS : « / » rechercher · « c » capture rapide · Ctrl+K commandes · Échap fermer
  ============================================================================
-->
<style>
/* ==========================================================================
   1. JETONS DE STYLE — toute la charte tient ici
   ========================================================================== */
:root{
  color-scheme: dark;
  --fond:#1b1b1d; --fond-2:#1f1f22; --champ:#19191c;
  --carte:#232326; --carte-survol:#2a2a2e;
  --trait:#34343a; --trait-doux:#2b2b30;
  --texte:#f1f1f2; --texte-doux:#a9a9b1; --texte-faible:#7d7d86;
  /* Couleurs de données (validées pour fond sombre) */
  --bleu:#3987e5; --vert:#199e70; --jaune:#c98500; --rose:#d55181; --violet:#9085e9; --orange:#d95926; --gris:#85858e;
  /* Deux teintes de plus pour les catégories (même palette validée : 8 teintes) */
  --herbe:#008300; --rouge:#e66767;
  /* Mêmes teintes éclaircies : pictogrammes et petits textes */
  --i-bleu:#7ab0f0; --i-vert:#4ec89b; --i-jaune:#e5b54a; --i-rose:#e78aab; --i-violet:#b0a7f2; --i-orange:#ef8759; --i-gris:#b3b3ba;
  --i-rouge:#ff6b6b;   /* réservé à l'échec d'écriture */
  --rayon:14px;
  --ombre:0 1px 2px #00000040, 0 8px 24px #00000030;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fond);color:var(--texte);font-family:var(--police);font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--i-bleu);outline-offset:2px;border-radius:6px}
::selection{background:#3987e555}
.doux{color:var(--texte-doux)} .faible{color:var(--texte-faible)}
.vert{color:var(--i-vert)} .rose{color:var(--i-rose)} .jaune{color:var(--i-jaune)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tronque{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.aide{font-size:13px;color:var(--texte-doux);margin:0 0 14px}
.boutons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.boutons > .btn{max-width:100%;white-space:normal}   /* un bouton plus large que la carte revient à la ligne au lieu de déborder */
code{font-family:var(--mono);font-size:.9em;background:#ffffff0f;padding:1px 5px;border-radius:4px}
[hidden]{display:none !important}

/* ==========================================================================
   2. BARRE DU HAUT
   ========================================================================== */
.barre{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 24px;background:#1b1b1def;backdrop-filter:blur(12px);border-bottom:1px solid var(--trait-doux)}
.marque{display:flex;align-items:center;gap:11px;flex-shrink:0;border-radius:10px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#5b72d6,#7d5fc1);color:#fff;box-shadow:0 2px 8px #0006}
.marque-txt strong{display:block;font-size:14px;line-height:1.2}
.marque-txt span{display:block;font-size:11px;color:var(--texte-faible)}
.menu{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{display:flex;align-items:center;gap:7px;color:var(--texte-doux);font-size:13.5px;padding:8px 10px;border-radius:9px;white-space:nowrap;transition:background .18s,color .18s}
.menu a:hover{background:#ffffff0d;color:var(--texte)}
.menu a.actif{background:#ffffff14;color:var(--texte)}
.menu a svg{color:var(--texte-faible);flex-shrink:0}
.menu a.actif svg{color:var(--i-bleu)}
.menu .badge{font-family:var(--mono);font-size:10.5px;background:#c9850030;color:var(--i-jaune);border-radius:99px;padding:0 6px;line-height:16px}
.recherche-wrap{position:relative;flex-shrink:0}
.recherche{display:flex;align-items:center;gap:8px;background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:7px 9px 7px 11px;width:240px;color:var(--texte-faible);transition:border-color .18s,box-shadow .18s}
.recherche:focus-within{border-color:#4a80c8;box-shadow:0 0 0 3px #3987e526}
.recherche input{border:0;background:transparent;outline:0;color:var(--texte);font-size:13.5px;width:100%;min-width:0}
.recherche input::placeholder{color:var(--texte-faible)}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--texte-faible);border:1px solid var(--trait);border-radius:5px;padding:0 5px;line-height:17px;white-space:nowrap}
.resultats{position:absolute;right:0;top:calc(100% + 8px);width:min(460px,92vw);max-height:70vh;overflow:auto;background:var(--carte-survol);border:1px solid var(--trait);border-radius:14px;box-shadow:0 24px 60px #000000a0;padding:10px}
.resultats .groupe{padding:4px 0 8px}
.resultats .groupe + .groupe{border-top:1px solid var(--trait-doux);padding-top:8px}
.resultat{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 9px;border-radius:8px;font-size:13.5px;transition:background .15s}
.resultat:hover,.resultat:focus{background:#ffffff0d;outline:none}
.resultat .r-sous{font-size:11.5px;color:var(--texte-faible);text-align:right;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resultat.tous{justify-content:flex-start;align-items:center;gap:8px;margin-top:4px;color:var(--i-bleu)}
.resultat.tous kbd{margin-left:auto}
mark{background:#e5b54a3d;color:inherit;border-radius:3px;padding:0 1px}
.tag-r{color:var(--i-violet)}
.tag-r mark{padding:0}
/* Page de recherche */
.filtre.recherche-page{flex:1 1 560px;max-width:760px;padding:10px 14px}
.filtre.recherche-page input{font-size:15px}
.onglets-recherche{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.onglet-r{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--trait);background:transparent;color:var(--texte-doux);border-radius:99px;padding:5px 12px;font-size:13px;transition:background .15s,color .15s,border-color .15s}
.onglet-r:hover{background:#ffffff0d;color:var(--texte)}
.onglet-r.actif{background:#3987e522;border-color:#3987e566;color:var(--i-bleu)}
.liste.resultats-page > li{padding:2px 0}
.resultat-ligne{display:flex;gap:11px;align-items:flex-start;width:100%;min-width:0;padding:8px 6px;border-radius:9px;transition:background .15s}
.resultat-ligne:hover,.resultat-ligne:focus-visible{background:#ffffff08}
.resultat-ligne .corps .t{white-space:normal}
.extrait-r{display:block;font-size:12.5px;color:var(--texte-doux);margin-top:4px;line-height:1.45;overflow-wrap:anywhere}
.rond{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:1px solid var(--trait);background:var(--carte);display:grid;place-items:center;color:var(--texte-doux);transition:background .18s,color .18s,transform .15s}
.rond:hover{background:var(--carte-survol);color:var(--texte)}
.rond:active{transform:scale(.93)}
.rond.plus{background:#3987e518;border-color:#3987e545;color:var(--i-bleu)}
/* Icône d'écriture dans donnees.json : V vert = écrit, flèches = en cours, croix rouge = échec, jaune = dossier à relier */
.rond.ecriture[data-etat="ok"]{color:var(--i-vert);background:#199e701a;border-color:#199e7055}
.rond.ecriture[data-etat="cours"]{color:var(--i-bleu);background:#3987e514;border-color:#3987e545}
.rond.ecriture[data-etat="cours"] svg{animation:tourne .9s linear infinite}
.rond.ecriture[data-etat="erreur"]{color:var(--i-rouge);background:#e5484d24;border-color:#e5484d80}
.rond.ecriture[data-etat="hors"]{color:var(--i-jaune);background:#c985001c;border-color:#c9850059}
.rond.ecriture[data-etat="demo"],.rond.ecriture[data-etat="indispo"]{color:var(--texte-faible)}
@keyframes tourne{to{transform:rotate(360deg)}}

/* ==========================================================================
   3. PAGE ET GRILLES
   ========================================================================== */
.page{display:block;max-width:1560px;margin:0 auto;padding:26px 24px 30px}
.bonjour{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:22px}
.bonjour h1{margin:0;font-size:30px;letter-spacing:-.02em;font-weight:650;line-height:1.15}
.bonjour p{margin:6px 0 0;color:var(--texte-doux);font-size:14.5px;max-width:75ch}
.bonjour .boutons{flex-shrink:0;max-width:100%}
.meta{display:flex;align-items:center;gap:14px;color:var(--texte-doux);font-size:13px;flex-wrap:wrap}
.meta .sep{width:1px;height:16px;background:var(--trait)}
.retour{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px -6px;padding:3px 8px 3px 4px;border-radius:7px;color:var(--texte-faible);font-size:13px;transition:color .15s,background .15s}
.retour:hover{color:var(--i-bleu);background:#3987e51a}
.grille{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
#vue > * + *{margin-top:16px}
#vue > .bonjour + *, #vue > .nav-mois + *, #vue > .barre-outils + *{margin-top:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.etire{align-self:stretch}
.chiffres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.chiffres.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.mosaique{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.pile{display:flex;flex-direction:column;gap:16px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
h2.section{font-size:14px;font-weight:600;color:var(--texte-doux);margin:28px 0 12px}

/* ==========================================================================
   4. CARTE
   ========================================================================== */
.carte{position:relative;min-width:0;background:var(--carte);border:1px solid var(--trait-doux);border-radius:var(--rayon);padding:16px 17px;box-shadow:var(--ombre);transition:border-color .2s,background .2s,transform .15s,box-shadow .2s}
a.carte{display:block;color:inherit}
.carte.cliquable{cursor:pointer}
.carte.cliquable:hover{border-color:var(--trait);background:var(--carte-survol);transform:translateY(-2px);box-shadow:0 2px 4px #00000040,0 14px 30px #00000045}
.anim .carte{animation:monte .4s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.entete-carte{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
.entete-carte h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.entete-carte .droite{margin-left:auto;display:flex;align-items:center;gap:6px}
.pastille{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.lien-sous{display:flex;align-items:center;gap:5px;color:var(--texte-faible);font-size:12.5px;padding:4px 6px;border-radius:7px;white-space:nowrap;border:0;background:transparent;transition:color .18s,background .18s}
.lien-sous:hover{color:var(--i-bleu);background:#3987e51f}
.etiq{font-size:11px;color:var(--texte-faible);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.compte{font-family:var(--mono);font-size:11px;background:#ffffff12;color:var(--texte-doux);border-radius:99px;padding:1px 8px}
.bandeau{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 16px;border-radius:var(--rayon);border:1px solid var(--trait-doux);background:var(--carte)}
.bandeau .txt{flex:1;min-width:200px}
.bandeau .txt strong{display:block;font-size:13.5px}
.bandeau .txt span{display:block;font-size:12.5px;color:var(--texte-doux)}
.bandeau.bleu{border-color:#3987e538;background:#3987e50d}
.bandeau.jaune{border-color:#c9850040;background:linear-gradient(90deg,#c9850014,#23232600 70%),var(--carte)}

/* ==========================================================================
   5. CHIFFRES CLÉS ET JAUGES
   ========================================================================== */
.kpi .haut{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kpi .haut span{font-size:13px;color:var(--texte-doux)}
.kpi .valeur,.gros{font-size:29px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi .valeur small,.gros small{font-size:17px;color:var(--texte-faible);font-weight:500}
.kpi .note{margin-top:6px;font-size:12.5px;color:var(--texte-doux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .note.bien{color:var(--i-vert)} .kpi .note.att{color:var(--i-jaune)} .kpi .note.dep{color:var(--i-rose)}
.barre-prog{display:block;height:6px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:11px}
.barre-prog > i{display:block;height:100%;border-radius:99px;background:var(--bleu)}
.barre-prog.vert > i{background:var(--vert)}
.barre-prog.att > i{background:var(--jaune)}
.barre-prog.dep > i{background:var(--rose)}
.barre-prog.fine{height:5px;margin-top:6px}
.barre-prog{position:relative}
.barre-prog .repere{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--texte);opacity:.75}
.anim .barre-prog > i{animation:remplit 1s cubic-bezier(.22,.8,.3,1) .2s both}
@keyframes remplit{from{width:0}}
.ligne-budget{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--texte-doux);margin-top:10px}

/* ==========================================================================
   6. LISTES, TÂCHES, CASES À COCHER
   ========================================================================== */
.liste{list-style:none;margin:0;padding:0}
.liste > li{display:flex;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid var(--trait-doux);min-width:0}
.liste > li:first-child{border-top:0;padding-top:2px}
/* Ligne avec des boutons (échéances, Inbox, corbeille…) : quand la place manque, les boutons passent
   sous le texte au lieu de l'écraser (sur téléphone, le texte n'avait plus que quelques pixels) */
.liste > li:has(> .boutons){flex-wrap:wrap}
.liste > li:has(> .boutons) > .corps{flex:1 1 190px}
.liste > li:has(> .boutons) > .boutons{margin-left:auto}
.liste .corps{flex:1;min-width:0;display:flex;flex-direction:column}
.liste .corps .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liste .corps .s{font-size:11.5px;color:var(--texte-faible);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;overflow-wrap:anywhere}
.liste .corps a.t:hover{color:var(--i-bleu)}
.liste .pct{font-family:var(--mono);font-size:12px;color:var(--texte-doux);font-variant-numeric:tabular-nums;white-space:nowrap}
.liste .num{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vignette{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.vignette.mini{width:30px;height:30px;border-radius:9px}
.tache .corps .t{display:flex;align-items:center;gap:7px;white-space:normal}
.tache .corps .t > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tache.faite .corps .t > span:first-child{text-decoration:line-through;color:var(--texte-faible)}
.tache .s .retard{color:var(--i-rose)}
.tache .s .auj{color:var(--i-vert)}
.actions-ligne{display:flex;gap:2px;flex-shrink:0}
@media (hover:hover){
  .actions-ligne .icone-btn{opacity:.35}
  li:hover .actions-ligne .icone-btn,.actions-ligne .icone-btn:focus-visible{opacity:1}
}
.case{appearance:none;-webkit-appearance:none;margin:0;flex-shrink:0;width:18px;height:18px;border-radius:6px;border:1.6px solid #4c4c54;background:transparent;cursor:pointer;display:grid;place-items:center;transition:border-color .18s,background .18s,transform .12s}
.case:hover{border-color:var(--i-bleu)}
.case:active{transform:scale(.86)}
.case:checked{background:var(--vert);border-color:var(--vert)}
.case:checked::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:translate(0,-1px) rotate(-45deg)}
.priorite{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid transparent;font-weight:650;letter-spacing:.02em;white-space:nowrap;flex-shrink:0}
.priorite.p1{color:var(--i-rose);background:#d5518118;border-color:#d5518138}
.priorite.p2{color:var(--i-jaune);background:#c9850015;border-color:#c9850035}
.priorite.p3{color:var(--texte-faible);background:#ffffff07;border-color:var(--trait)}
.groupe-titre{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.groupe-titre:first-child{margin-top:0}
.groupe-titre.retard .etiq{color:var(--i-rose)}

/* ==========================================================================
   7. BOUTONS, ÉTIQUETTES, CHAMPS
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#ffffff0d;border:1px solid var(--trait);color:var(--texte);padding:8px 14px;border-radius:9px;font-size:13.5px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .12s}
.btn:hover{background:#ffffff16;border-color:#55555f}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:#d7d7da;border-color:#d7d7da;color:#1d1d20;font-weight:600}
.btn.p:hover{background:#e6e6e8;border-color:#e6e6e8}
.btn.f{background:transparent;border-color:transparent;color:var(--texte-doux);padding:6px 9px}
.btn.f:hover{color:var(--texte);background:#ffffff0d}
.btn.ghost{background:#3987e512;border-color:#3987e538;color:var(--i-bleu)}
.btn.ghost:hover{background:#3987e522;border-color:#3987e560}
.btn.danger:hover{color:var(--i-rose);background:#d551811a;border-color:#d5518155}
.btn.p.danger{background:#c9476f;border-color:#c9476f;color:#fff}
.btn.p.danger:hover{background:var(--rose);border-color:var(--rose)}
.btn.compact{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.actif{background:#3987e522;border-color:#3987e560;color:var(--i-bleu)}
.icone-btn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--texte-faible);display:inline-grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s,opacity .15s}
.icone-btn:hover{background:#ffffff12;color:var(--texte)}
.icone-btn.danger:hover{color:var(--i-rose);background:#d551811a}
.puce{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--trait);background:#ffffff08;color:var(--texte-doux);white-space:nowrap;line-height:1.5}
button.puce{cursor:pointer}
.puce.alerte{border-color:#c985004d;background:#c9850022;color:var(--i-jaune)}
button.puce.alerte:hover{filter:brightness(1.2)}
.puce.proj{transition:filter .15s}
a.puce.proj:hover{filter:brightness(1.2)}
.puces{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.barre-outils{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.barre-outils .filtre{flex:0 1 360px}
.filtre{display:flex;align-items:center;gap:8px;background:var(--champ);border:1px solid var(--trait);border-radius:9px;padding:7px 10px;color:var(--texte-faible);min-width:220px;transition:border-color .18s,box-shadow .18s}
.filtre:focus-within{border-color:#4a80c8;box-shadow:0 0 0 3px #3987e526}
.filtre input{border:0;background:transparent;outline:0;color:var(--texte);font-size:13.5px;width:100%;min-width:0}
.champ{display:block;margin-bottom:13px;min-width:0}
.champ > span{display:block;font-size:12.5px;color:var(--texte-doux);margin-bottom:6px}
.champ em{font-style:normal;color:var(--texte-faible)}
.champ input,.champ select,.champ textarea,.saisie{width:100%;background:var(--champ);border:1px solid var(--trait);color:var(--texte);border-radius:9px;padding:9px 11px;outline:0;transition:border-color .15s,box-shadow .15s}
.champ input:focus,.champ select:focus,.champ textarea:focus,.saisie:focus{border-color:#5a80be;box-shadow:0 0 0 3px #3987e520}
.champ textarea{min-height:100px;resize:vertical;line-height:1.5}
.champ textarea.code{font-family:var(--mono);font-size:13px;min-height:220px}
.form-grille{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.form-grille > *{grid-column:span 2}
.form-grille > .champ.demi{grid-column:span 1}
.segment{display:inline-flex;background:var(--champ);border:1px solid var(--trait);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.segment label{position:relative}
.segment input{position:absolute;opacity:0;pointer-events:none}
.segment span{display:block;padding:5px 13px;border-radius:7px;font-size:13px;color:var(--texte-doux);cursor:pointer;transition:background .15s,color .15s}
.segment input:checked + span{background:#ffffff18;color:var(--texte)}
.segment input:focus-visible + span{box-shadow:0 0 0 2px var(--i-bleu)}
.onglets{display:flex;gap:4px;margin-bottom:6px}
.onglets button{border:0;background:transparent;color:var(--texte-faible);padding:4px 10px;border-radius:7px;font-size:12.5px}
.onglets button.actif{background:#ffffff12;color:var(--texte)}
.apercu{min-height:220px;border:1px solid var(--trait-doux);border-radius:9px;padding:12px 14px;background:var(--champ);font-size:14px}
.erreur{color:var(--i-rose);font-size:12.5px;margin:-4px 0 12px}

/* ==========================================================================
   8. DÉPLIABLES, TUILES, CONTACTS, NOTES, FICHES
   ========================================================================== */
/* Tuile dépliable : titre = ouvrir (fiche ou modification), flèche ou reste de l'en-tête = déplier */
.depliable{padding:0;overflow:hidden}
.depliable-tete{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 16px;cursor:pointer;transition:background .18s}
.depliable-tete:hover{background:#ffffff06}
.depliable-tete .titre{flex:1;min-width:0;display:flex}
.nom-lien{border:0;background:transparent;padding:2px 0;margin:0;text-align:left;font-size:14.5px;font-weight:550;color:var(--texte);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px;transition:color .15s}
.nom-lien:hover{color:var(--i-bleu);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#7ab0f070}
.chevron{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--texte-faible);display:grid;place-items:center;flex-shrink:0;transition:background .15s,color .15s}
.chevron:hover{background:#ffffff12;color:var(--texte)}
.chevron svg{transition:transform .25s ease}
.ouvert > .depliable-tete .chevron svg,.ouvert > .entete-carte .chevron svg,.ouvert > .groupe-titre .chevron svg{transform:rotate(180deg)}
.depliable-corps{display:none;padding:14px 16px;border-top:1px solid var(--trait-doux)}
.depliable.ouvert .depliable-corps{display:block}
/* Carte classique dont le contenu se replie (ex. Mouvements) */
.pliable > .entete-carte{cursor:pointer;margin:-16px -17px 0;padding:14px 12px 14px 17px;border-radius:var(--rayon);transition:background .18s}
.pliable > .entete-carte:hover{background:#ffffff05}
.pliable-corps{display:none;padding-top:4px}
.pliable.ouvert .pliable-corps{display:block}
.pliable:not(.ouvert){padding-bottom:0}
/* Bloc repliable dans une carte (archives des tâches) */
.bloc-pliable > .groupe-titre{cursor:pointer;border-radius:8px;margin-left:-6px;margin-right:-6px;padding:2px 2px 2px 6px;transition:background .15s}
.bloc-pliable > .groupe-titre:hover{background:#ffffff06}
.bloc-pliable > .groupe-titre .chevron{margin-left:auto;width:26px;height:26px}
.bloc-pliable.ouvert > .pliable-corps{display:block}
.bloc-pliable > .pliable-corps{padding-top:0}
.lien-texte{color:var(--i-bleu);text-decoration:underline;text-underline-offset:2px}
button.bouton-texte{border:0;background:transparent;padding:0;font:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:650;flex-shrink:0;letter-spacing:.02em}
.avatar.grand{width:52px;height:52px;font-size:17px}
.adresse-contact{display:flex;gap:7px;align-items:flex-start;margin:10px 0 0;font-size:13px;color:var(--texte-doux);white-space:pre-line}
.adresse-contact svg{flex-shrink:0;margin-top:2px}
a.puce.lien-tel{color:var(--texte);text-decoration:none;max-width:100%;white-space:normal;overflow-wrap:anywhere}
a.puce.lien-tel:hover{border-color:var(--i-bleu)}
.nouvelles{margin:10px 0 2px;padding:10px 12px;border-radius:10px;background:#ffffff07;border:1px solid var(--trait-doux);font-size:13.5px}
.sous-titre{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--texte-faible);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px;min-height:30px}
.items li .t{flex:1;min-width:0}
.items li.fait .t{text-decoration:line-through;color:var(--texte-faible)}
@media (hover:hover){.items li .icone-btn{opacity:0}.items li:hover .icone-btn,.items li .icone-btn:focus-visible{opacity:1}}
.ajout{display:flex;align-items:center;gap:10px;margin-top:2px;color:var(--texte-faible)}
.ajout input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--trait);padding:6px 2px;font-size:13px;color:var(--texte);outline:0}
.ajout input:focus{border-bottom:1px solid var(--i-bleu)}
/* Notes : dossiers à gauche, titres dépliables à droite */
.notes-cadre{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.dossiers{position:sticky;top:76px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.dossiers .etiq{padding:2px 8px 8px}
.dossier-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:9px;font-size:13.5px;color:var(--texte-doux);transition:background .15s,color .15s}
.dossier-btn svg{color:var(--i-jaune);flex-shrink:0}
.dossier-btn:first-of-type svg{color:var(--texte-faible)}
.dossier-btn:hover{background:#ffffff0b;color:var(--texte)}
.dossier-btn.actif{background:#c985001f;color:var(--texte);box-shadow:inset 0 0 0 1px #c9850045}
.dossier-btn .nom-d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dossier-btn .nb{font-family:var(--mono);font-size:11px;color:var(--texte-faible)}
.dossier-btn.archives{margin-top:8px}
.dossier-btn.archives svg{color:var(--texte-faible)}
.dossier-actif{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--texte-doux)}
.dossier-actif svg{color:var(--i-jaune)}
.mosaique.notes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.carte-note .depliable-tete{gap:11px}
.date-t{font-size:11.5px;color:var(--texte-faible);white-space:nowrap}
.md-extrait{font-size:14px;max-height:260px;overflow:auto;padding-right:4px}
/* Fiches en grand (contact, note) */
.modale.fiche{width:min(900px,100%);padding:22px 24px 20px}
.fiche-tete{align-items:flex-start;gap:14px;margin-bottom:18px}
.fiche-titre{flex:1;min-width:0}
.fiche-titre h3{font-size:21px;line-height:1.25;overflow-wrap:anywhere}
.fiche-titre .puces{margin-top:8px}
.fiche-grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 26px}
.fiche-col > .sous-titre:first-child{margin-top:0}
.fiche-col .champ textarea{min-height:130px}
.fiche-pied{align-items:center;border-top:1px solid var(--trait-doux);padding-top:14px;margin-top:14px}
.fiche-pied .aide{margin:0 auto 0 0}
.md.fiche-md{max-height:min(62vh,640px);overflow:auto;padding:16px 18px;border-radius:12px;background:var(--champ);border:1px solid var(--trait-doux);max-width:none}
.item-texte{flex:1;min-width:0;border-bottom:1px solid transparent;padding:3px 2px;font-size:13.5px;color:var(--texte);outline:0;cursor:text;overflow-wrap:anywhere;border-radius:3px 3px 0 0;transition:border-color .15s,background .15s}
.item-texte:focus{background:#ffffff08}
.item-texte:hover{border-bottom-color:var(--trait)}
.item-texte:focus{border-bottom-color:var(--i-bleu)}
.items li.fait .item-texte{text-decoration:line-through;color:var(--texte-faible)}
.liste.docs .corps .s{flex-wrap:nowrap;min-width:0}
/* Documents : échéances, fiche, tags communs */
/* Comptes : cases « pris en compte dans les statistiques » en haut de Finances */
.barre-comptes{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-6px 0 16px}
.barre-comptes .etiq{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-faible);margin-right:2px}
.puce-compte{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 7px;border-radius:99px;border:1px solid var(--trait);background:#ffffff06;color:var(--texte-faible);font-size:13px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;text-align:left;transition:background .15s,border-color .15s,color .15s}
.puce-compte:hover{border-color:#ffffff30;color:var(--texte-doux)}
.puce-compte .boite{width:16px;height:16px;flex-shrink:0;border-radius:5px;border:1.5px solid #ffffff40;display:grid;place-items:center}
.puce-compte.on{color:var(--texte);border-color:#4ec89b55;background:#4ec89b12}
.puce-compte.on .boite{background:var(--i-vert);border-color:var(--i-vert);color:#0f241b}
/* Fenêtre « Comptes et budgets » / « Catégories » */
.liste.gestion > li{gap:8px;padding:8px 0}
.ligne-gestion .saisie{width:auto;padding:8px 10px}
.ligne-gestion input[name="nom"]{flex:1 1 150px;min-width:0}
.budget-gestion{display:flex;gap:6px;flex:0 1 230px;min-width:0}
.budget-gestion input{flex:1 1 90px;min-width:0}
.budget-gestion select{flex:0 0 auto}
.nb-gestion{font-size:11.5px;color:var(--texte-faible);white-space:nowrap;min-width:88px;text-align:right}
.case-stats{display:grid;place-items:center;width:26px;flex-shrink:0;cursor:pointer}
.case-stats input,.ligne-sans input{width:18px;height:18px;accent-color:var(--i-vert);cursor:pointer}
.ligne-gestion.supprimee{opacity:.55}
.ligne-gestion.supprimee input[name="nom"]{text-decoration:line-through}
.ligne-sans{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--texte-doux);margin:10px 0 0;cursor:pointer}
.champ .nouveau-nom{margin-top:8px}
tr.hors-stats td{opacity:.5}
.plus-notes{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.titre-doc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.titre-doc .titre{width:100%}
.titre-doc .badge-echeance{font-size:11px;padding:1px 8px}
.badge-echeance{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--trait);background:#ffffff08;color:var(--texte-doux);white-space:nowrap;line-height:1.5;flex-shrink:0}
.badge-echeance.preavis{color:var(--i-jaune);background:#c9850024;border-color:#c9850055}
.badge-echeance.expire{color:var(--i-rose);background:#d5518124;border-color:#d5518160;font-weight:600}
.liste > li.echeance{position:relative;padding-left:12px;border-radius:10px;background:linear-gradient(90deg,#c985001a,transparent 70%)}
.liste > li.echeance::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--jaune)}
.liste > li.echeance.expire{background:linear-gradient(90deg,#d551811c,transparent 70%)}
.liste > li.echeance.expire::before{background:var(--rose)}
.liste > li.echeance + li.echeance{margin-top:4px;border-top:0}
.liste.echeances{margin-bottom:6px}
.liste.echeances + .liste{border-top:1px solid var(--trait-doux);padding-top:6px}
.liste .corps .t.nom-lien{font-size:14px;font-weight:500;text-align:left;display:block}
.infos-doc{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px 12px;font-size:13.5px;margin:0 0 4px}
.infos-doc dt{color:var(--texte-faible)}
.infos-doc dd{margin:0;min-width:0;overflow-wrap:anywhere}
.texte-libre{white-space:pre-wrap}
.ouvrir-doc{margin:-2px 0 16px}
.puce.tag{color:var(--i-violet);border-color:#9085e944;background:#9085e914;transition:filter .15s}
a.puce.tag:hover{filter:brightness(1.25)}
.tags-dispo{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;max-height:88px;overflow:auto}
.tags-dispo .puce{cursor:pointer}
.tags-dispo .puce.actif{color:var(--i-violet);border-color:#9085e970;background:#9085e926}
.filtre-projet{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texte-doux);border:1px solid #9085e955;background:#9085e914;border-radius:99px;padding:1px 2px 1px 10px}
.filtre-projet .icone-btn{width:24px;height:24px}
.dossiers-docs .etiq{padding:12px 8px 6px}
.dossier-btn.etat-expire svg{color:var(--i-rose)} .dossier-btn.etat-preavis svg{color:var(--i-jaune)}
.dossier-btn.etat-plus-tard svg{color:var(--i-vert)} .dossier-btn.etat-sans svg{color:var(--texte-faible)}
.dossier-btn.etat-expire .nb{color:var(--i-rose)} .dossier-btn.etat-preavis .nb{color:var(--i-jaune)}
.md{font-size:15px;line-height:1.65;max-width:78ch}
.md > :first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;font-weight:650;color:var(--texte)}   /* # à ###### : six tailles */
.md h1{font-size:23px;font-weight:700;margin:24px 0 10px} .md h2{font-size:20px;font-weight:700;margin:22px 0 9px}
.md h3{font-size:17.5px;margin:20px 0 8px} .md h4{font-size:15.5px;margin:16px 0 6px}
.md h5{font-size:14.5px;margin:14px 0 6px} .md h6{font-size:13.5px;margin:14px 0 6px;color:var(--texte-doux)}
.md p{margin:0 0 12px} .md ul,.md ol{margin:0 0 12px;padding-left:22px} .md li{margin:3px 0}
.md a{color:var(--i-bleu);text-decoration:underline}
/* Listes de cases à cocher (« - [ ] » / « - [x] ») et texte barré (« ~~ ») */
.md li.tache-md{list-style:none;margin-left:-20px;display:flex;align-items:flex-start;gap:8px}
.md .case-md{flex-shrink:0;width:15px;height:15px;margin:.3em 0 0;accent-color:var(--bleu);cursor:pointer}
.md .case-md:disabled{cursor:default}
.md li.tache-md.faite > span{color:var(--texte-doux)}
.md del{color:var(--texte-faible)}
/* Tableaux, citations et séparateurs Markdown */
.md .table-md{overflow-x:auto;margin:0 0 14px;max-width:100%;padding:1px}   /* 1 px : la bordure extérieure n'est pas rognée */
.md tbody tr:last-child td{border-bottom:1px solid var(--trait)}   /* la règle générale des tableaux l'enlève */
.md table{width:auto;min-width:50%;border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--trait);padding:6px 11px;vertical-align:top;white-space:normal}
.md th{background:#ffffff0a;color:var(--texte);font-size:13.5px;font-weight:650;text-transform:none;letter-spacing:normal;text-align:left}
.md tbody tr:nth-child(even) td{background:#ffffff04}
.md blockquote{margin:0 0 14px;padding:9px 14px;border-left:3px solid var(--i-bleu);background:#ffffff06;border-radius:0 8px 8px 0;color:var(--texte-doux)}
.md blockquote p{margin:0 0 8px}.md blockquote p:last-child{margin:0}
.md hr{border:0;border-top:1px solid var(--trait);margin:18px 0}
/* Listes imbriquées, suites d'éléments, blocs de code */
.md li > ul,.md li > ol{margin:3px 0 0} .md li > p{margin:6px 0 0} .md li > pre{margin:6px 0 4px}
.md li.md-ecart{margin-top:10px}   /* élément précédé d'une ligne vide */
.md li.tache-md{flex-wrap:wrap;row-gap:2px} .md li.tache-md > span{flex:1;min-width:0}
.md li.tache-md > :not(input):not(span){flex-basis:calc(100% - 23px);margin-left:23px;min-width:0}
.md pre{margin:0 0 12px;padding:10px 13px;background:#ffffff08;border:1px solid var(--trait-doux);border-radius:8px;overflow-x:auto;max-width:100%;
  font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre;tab-size:4}
.md pre code{background:none;padding:0;border-radius:0;font-size:inherit}
.carte-projet{display:flex;flex-direction:column}
.carte-projet .haut{display:flex;align-items:center;gap:12px}
.carte-projet .haut .corps{flex:1;min-width:0}
.carte-projet strong{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carte-projet .resume{font-size:12.5px;color:var(--texte-faible);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.carte-projet .prochaine{font-size:12.5px;color:var(--texte-doux);margin-top:10px}
.carte-projet .meta-p{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--texte-faible);margin-top:10px}
.archive{opacity:.75}
.etape{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--trait-doux)}
.etape:first-child{border-top:0;padding-top:2px}
.etape .num-etape{width:28px;height:28px;border-radius:9px;background:#ffffff0a;border:1px solid var(--trait);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--texte-doux)}
.etape h3{font-size:14px;margin:0 0 4px}
.etape p{font-size:12.5px;color:var(--texte-doux);margin:0}
.etat-dossier{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:-4px 0 14px;color:var(--texte-doux)}
.etat-dossier svg{flex-shrink:0;margin-top:2px}
.etat-dossier.ok svg{color:var(--i-vert)} .etat-dossier.cours svg{color:var(--i-bleu)} .etat-dossier.erreur svg{color:var(--i-rouge)} .etat-dossier.hors svg{color:var(--i-jaune)}
/* Synchronisation GitHub (page Données) */
.etat-github{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:-4px 0 14px;color:var(--texte-doux)}
.etat-github svg{flex-shrink:0;margin-top:2px}
.etat-github.ok svg{color:var(--i-vert)} .etat-github.cours svg{color:var(--i-bleu)} .etat-github.erreur svg{color:var(--i-rouge)} .etat-github.hors svg{color:var(--i-jaune)}
.etat-github.erreur span{color:var(--i-rouge)}
/* Dossier Google Drive : explorateur en lecture seule (projets, page Documents, formulaires) */
.drive-explo{min-width:0}
.drive-fil{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;margin:0 0 8px;min-width:0}
.drive-fil .puce{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.drive-sep{color:var(--texte-faible);font-size:12px}
.drive-outils{margin-left:auto;display:flex;gap:6px;align-items:center}
.liste.drive-liste > li{padding:5px 2px;gap:8px}
.drive-nom{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--texte);padding:4px 0;font:inherit;font-size:13.5px;text-align:left;min-width:0;flex:1;cursor:pointer;border-radius:6px}
.drive-nom > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.drive-nom:hover > span{color:var(--i-bleu);text-decoration:underline;text-underline-offset:3px}
.drive-nom.inactif{cursor:default;color:var(--texte-faible)} .drive-nom.inactif:hover > span{color:inherit;text-decoration:none}
.drive-nom svg{flex-shrink:0}
.drive-suivi{display:flex;align-items:center;gap:4px;flex-shrink:0}
.drive-projet{margin-top:14px;padding-top:12px;border-top:1px solid var(--trait-doux);min-width:0}
.drive-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--texte-doux);margin:0 0 10px;min-width:0}
.drive-tete b{font-weight:600;color:var(--texte)}
.drive-tete .drive-chemin{font-family:var(--mono);font-size:11.5px;color:var(--texte-faible);overflow-wrap:anywhere;min-width:0}
.drive-tete .boutons{margin-left:auto}
.drive-form{margin:-4px 0 13px}
#drive-form-zone{margin-top:8px;padding:10px 12px;border:1px solid var(--trait);border-radius:10px;max-height:340px;overflow:auto;background:var(--champ)}
.modale .drive-explo{max-height:min(52vh,460px);overflow:auto;margin:0 0 6px}
.choix-priorites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}

/* ==========================================================================
   9. FINANCES — graphiques, calendriers, tableau
   ========================================================================== */
.nav-mois{display:flex;align-items:center;gap:6px;margin:-6px 0 18px;flex-wrap:wrap}
.nav-mois strong{font-size:16px;font-weight:600;min-width:160px;text-align:center}
.segment button{display:block;border:0;background:transparent;padding:5px 13px;border-radius:7px;font-size:13px;color:var(--texte-doux);transition:background .15s,color .15s}
.segment button:hover{color:var(--texte)}
.segment button.on{background:#ffffff18;color:var(--texte)}
.vue-fin{margin-right:8px;flex-wrap:nowrap}
.graph svg{display:block;width:100%;height:auto;overflow:visible}
.graph text{fill:var(--texte-faible);font-family:var(--mono);font-size:10.5px}
.graph .barre-mois{cursor:pointer}
.graph .barre-mois .fond{fill:transparent;transition:fill .15s}
.graph .barre-mois:hover .fond{fill:#ffffff0a}
.graph .barre-mois.sel .fond{fill:#3987e514}
.legende-graph{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--texte-doux);margin-top:8px}
.legende-graph i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px;background:var(--bleu)}
.legende-graph i.tirets{background:repeating-linear-gradient(90deg,var(--vert) 0 5px,transparent 5px 9px)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.anneau{position:relative;width:200px;height:200px;flex-shrink:0}
.anneau svg{transform:rotate(-90deg);display:block}
.anneau .arc{transition:opacity .18s ease,stroke-width .18s ease;cursor:pointer}
.anim .anneau .arc{animation:arc 1s cubic-bezier(.22,.8,.3,1) .25s both}
@keyframes arc{from{stroke-dasharray:0 516}}
.anneau .centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 36px}
.anneau .centre b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.anneau .centre span{font-size:11.5px;color:var(--texte-faible);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legende{list-style:none;margin:0;padding:0;flex:1;min-width:190px}
.legende li{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:8px;font-size:13px;transition:background .15s}
.legende li:hover,.legende li.actif{background:#ffffff0a}
.legende .pt,.pt-cat{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--c)}
/* Couleur « rayée » : même teinte que la couleur unie, en rayures (9e à 16e catégorie) */
.legende .pt.ray,.pt-cat.ray{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1.5px var(--c)}
.pt-cat{display:inline-block;margin-right:2px}
/* « Par catégorie » de la page Finances : anneau + tableau des catégories, sur toute la largeur */
.donut.large{align-items:flex-start;gap:28px}
.tableau-cat{flex:1 1 360px;min-width:0}
.entete-cat .ct{display:none}
.entete-cat,.ligne-cat{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(60px,2fr) 100px 56px 88px;align-items:center;gap:14px}
.entete-cat{font-size:11px;color:var(--texte-faible);text-transform:uppercase;letter-spacing:.05em;padding:0 8px 7px;border-bottom:1px solid var(--trait-doux);margin-bottom:4px}
.entete-cat span:nth-child(n+3){text-align:right}
.legende.cats li{padding:0}
.ligne-cat{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer}
.legende.cats li.choisie .ligne-cat{background:#ffffff12;box-shadow:inset 0 0 0 1px var(--trait)}
.ligne-cat .nom-c{display:flex;align-items:center;gap:9px;min-width:0}
.ligne-cat .eu,.ligne-cat .pc,.ligne-cat .nb{min-width:0;text-align:right;font-family:var(--mono);font-size:12.5px}
.ligne-cat .nb{color:var(--texte-doux)}
.barre-cat{display:block;height:8px;border-radius:4px;background:#ffffff08;overflow:hidden}
.barre-cat i{display:block;height:100%;border-radius:4px;background:var(--c)}
.barre-cat i.ray{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--c)}
.bloc-anneau .arc[data-action]{cursor:pointer}
[data-depliable="mouvements"]{scroll-margin-top:84px}
/* En-têtes triables du tableau des mouvements (Finances) */
th.triable .tri{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;white-space:nowrap}
th.triable.num .tri{flex-direction:row-reverse}
th.triable .tri:hover,th.triable.actif .tri{color:var(--texte)}
th.triable .fleche{display:inline-block;min-width:.8em;font-size:1.15em;line-height:1}
.legende .nom-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legende .pc{font-family:var(--mono);font-size:12px;color:var(--texte-faible);min-width:38px;text-align:right}
.legende .eu{font-family:var(--mono);font-size:12.5px;min-width:78px;text-align:right;white-space:nowrap}
.cal-tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-titre{border:0;background:transparent;font-size:15px;font-weight:600;padding:3px 6px;margin-left:-6px;border-radius:7px;color:var(--texte)}
.cal-titre:hover{background:#ffffff0d}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:8px;border:1px solid var(--trait-doux);background:transparent;color:var(--texte-doux);display:grid;place-items:center;transition:background .15s,color .15s}
.cal-nav button:hover{background:var(--carte-survol);color:var(--texte)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .js{text-align:center;font-size:10.5px;color:var(--texte-faible);padding:4px 0 6px}
.cal .jour{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:12.5px;border-radius:8px;border:0;background:transparent;padding:0;color:var(--texte-doux);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.cal .jour:hover{background:#ffffff10;color:var(--texte)}
.cal .jour.auj{background:var(--bleu);color:#fff;font-weight:650}
.cal .pts{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .pts i{width:4px;height:4px;border-radius:50%}
.cal .jour.auj .pts i{background:#fff !important}
.cal .pts i.doc,.cal-leg i.doc{width:6px;height:6px;border-radius:1px;transform:rotate(45deg);background:var(--i-jaune)}
.cal .pts i.doc.expire{background:var(--i-rose)}
.cal .jour.a-echeance{box-shadow:inset 0 0 0 1.5px #e5b54a90}
.cal .jour.auj.a-echeance{box-shadow:inset 0 0 0 2px #e5b54a}
.cal.chaleur .jour{font-size:11.5px}
.cal.chaleur .jour.auj{background:transparent;box-shadow:inset 0 0 0 1.5px var(--i-bleu);color:var(--texte)}
.cal.chaleur .jour.fort{color:#fff}
.cal-leg{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:11px;color:var(--texte-faible)}
.cal-leg span{display:flex;align-items:center;gap:5px}
.cal-leg i{width:7px;height:7px;border-radius:50%}
.cal-leg .gamme{display:flex;gap:2px}
.cal-leg .gamme i{width:12px;height:8px;border-radius:2px}
.defile{position:relative;overflow-x:auto;margin:0 -6px}   /* position : garde le texte « sr » du tableau dans la zone qui défile */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--texte-faible);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--trait);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--trait-doux);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ffffff05}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.date{white-space:nowrap;color:var(--texte-doux);font-family:var(--mono);font-size:12.5px}
td.act{text-align:right;white-space:nowrap;width:1%}
@media (hover:hover){td.act .icone-btn{opacity:.4}tr:hover td.act .icone-btn{opacity:1}}
.table-simple td{padding:8px 4px}

/* ==========================================================================
   10. ÉTAT VIDE, FENÊTRES, MESSAGE, FOCUS, PALETTE, PIED
   ========================================================================== */
.vide{border:1px dashed var(--trait);border-radius:12px;padding:22px 18px;text-align:center;color:var(--texte-doux);font-size:13.5px}
.vide p{margin:0 auto 12px;max-width:52ch}
.vide .boutons{justify-content:center}
.voile{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:#101012cc;backdrop-filter:blur(3px)}
.voile.on{display:flex}
.modale{width:min(540px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--carte-survol);border:1px solid var(--trait);border-radius:16px;padding:20px 22px 22px;box-shadow:0 30px 70px #000000a6;animation:ouvre .22s cubic-bezier(.2,.9,.3,1)}
.modale.large{width:min(760px,100%)}
.modale:focus{outline:none}
@keyframes ouvre{from{opacity:0;transform:translateY(12px) scale(.97)}}
.modale-tete{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modale-tete h3{margin:0;font-size:18px;font-weight:600}
.modale-tete .fermer{margin-left:auto}
.modale .texte{color:var(--texte-doux);font-size:13.5px;margin:0 0 16px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.choix-migration{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.choix-migration button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--trait);background:#ffffff08;transition:border-color .15s,background .15s}
.choix-migration button:hover{border-color:#3987e566;background:#3987e512}
.choix-migration strong{font-size:14px}
.choix-migration span{font-size:12.5px;color:var(--texte-doux)}
.toast{position:fixed;left:50%;bottom:26px;z-index:80;transform:translate(-50%,14px);opacity:0;padding:10px 16px;border-radius:10px;border:1px solid var(--trait);border-left:3px solid var(--i-vert);background:var(--carte-survol);font-size:13px;box-shadow:0 14px 34px #00000080;transition:transform .25s ease,opacity .25s ease;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.focus-flottant{position:fixed;right:20px;bottom:20px;z-index:65;width:300px;border:1px solid #3987e560;background:var(--carte-survol);box-shadow:0 18px 45px #00000066;border-radius:14px;padding:12px 14px}
.focus-flottant .ligne{display:flex;align-items:center;gap:10px}
.focus-flottant .nom-f{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-flottant .minuteur{font-family:var(--mono);font-size:17px;color:var(--i-bleu);font-variant-numeric:tabular-nums}
.focus-flottant .boutons{margin-top:10px;justify-content:flex-end}
.palette{position:fixed;inset:0;z-index:90;background:#101012b8;backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:10vh 20px 20px}
.palette.on{display:flex}
.palette-boite{width:min(620px,100%);background:var(--carte-survol);border:1px solid var(--trait);border-radius:16px;box-shadow:0 30px 80px #000000a6;overflow:hidden}
.palette-boite input{width:100%;border:0;border-bottom:1px solid var(--trait);background:transparent;padding:16px 18px;font-size:16px;outline:0;color:var(--texte)}
.palette-liste{max-height:50vh;overflow:auto;padding:7px}
.commande{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:transparent;width:100%;text-align:left;color:var(--texte)}
.commande.sel,.commande:hover{background:#ffffff0d}
.commande .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#ffffff08;flex-shrink:0}
.commande .txt{flex:1;min-width:0}
.commande strong{display:block;font-size:13.5px;font-weight:550}
.commande .txt span{display:block;font-size:11.5px;color:var(--texte-faible)}
.palette-pied{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--trait-doux);font-size:11.5px;color:var(--texte-faible)}
.pied{max-width:1560px;margin:0 auto;padding:14px 24px 26px;display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--texte-faible)}
.pied .e{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:0;font:inherit;color:inherit}
.pied button.e:hover,.pied a.e:hover{color:var(--texte-doux)}
.pied .led{width:6px;height:6px;border-radius:50%;background:var(--i-vert);flex-shrink:0}
.pied .led.j{background:var(--i-jaune)} .pied .led.b{background:var(--i-bleu)} .pied .led.r{background:var(--i-rouge)}
.pied .droite{margin-left:auto}

/* ==========================================================================
   11. ÉCRANS PLUS PETITS
   ========================================================================== */
/* Barre du haut : les 10 entrées du menu gardent toujours icône + nom.
   On libère d'abord de la place (nom « Life Panel », recherche), puis on resserre le menu ;
   quand tout ne tient plus, la ligne des modules défile (doigt, molette ou pavé tactile). */
@media (max-width:1720px){
  .marque-txt{display:none}
  .recherche{width:200px}
}
@media (max-width:1520px){
  .barre{gap:10px}
  .menu{gap:1px}
  .menu a{padding:7px;gap:5px;font-size:13px}
  .recherche{width:170px}
  .recherche kbd{display:none}
}
@media (max-width:1365px){
  .barre{gap:8px}
  .menu{gap:0}
  .menu a{padding:7px 6px;font-size:12.5px}
  .recherche{width:150px}

<script>
'use strict';
/* ==========================================================================
   A. DONNÉES — un seul modèle, une seule clé
   ========================================================================== */
const VERSION = 16;  /* 8 : archives et corbeille · 9 : module Documents, tags communs · 10 : liste des comptes (statistiques, budgets) · 11 : couleur de chaque catégorie · 12 : téléphone et adresse des contacts · 13 : autre téléphone des contacts · 14 : e-mail des contacts · 15 : dossier Drive des projets, versions remplacées par la synchro (corbeille) · 16 : date de modification des mouvements et de l'Inbox (fusion de la synchro) */
const CLE = 'lifepanel';                   /* copie légère dans localStorage (voir « Stockage dans le navigateur ») */
const CLE_SECOURS = 'lifepanel.secours';   /* ancienne place de la copie de secours (v3.3 à v3.8), reprise dans IndexedDB */
const MIROIR_MAX = 2e6;                    /* au-delà de 2 millions de caractères, pas de copie dans localStorage */
const CLE_FOCUS = 'lifepanel.focus';
const CLES_ANCIENNES = [
  {cle:'lifepanel.v1', nom:'la v1 à v3.2'},
  {cle:'lifepanel.v6', nom:'life-panel.html'}
];
const CATEGORIES_DEFAUT = ['Courses','Restaurants','Transport','Logement','Santé','Soins perso','Loisirs','Voyages','Formation','Cadeaux','Abonnements','Divers'];
const LISTES_DONNEES = ['projets','taches','notes','documents','mouvements','contacts','inbox'];
const JOURS_CORBEILLE = 30;
const PREAVIS_DEFAUT = 30;   /* jours avant l'échéance d'un document où il passe « à renouveler » */
const LIENS_PROJET = ['taches', 'notes', 'documents', 'mouvements', 'contacts'];   /* ce qu'un projet peut rassembler */
/* Il y a quelque chose à protéger (données ou corbeille) */
const aDesDonnees = d => !!d && (compter(d) > 0 || (Array.isArray(d.corbeille) && d.corbeille.length > 0));

const DBVide = () => ({
  version: VERSION, prenom: 'Alexis',
  projets: [], taches: [], notes: [], documents: [], mouvements: [], contacts: [], inbox: [], corbeille: [],
  categories: CATEGORIES_DEFAUT.slice(),
  couleursCategories: [],   /* {nom, couleur} : couleur gardée par chaque catégorie (graphique « Par catégorie ») */
  comptes: [],   /* {nom, stats, budget, periode} : stats = pris en compte dans les statistiques ; budget par mois ou par an */
  reglages: {focusProjets: [], lastReview: null, demo: false, maj: null, sansCompteStats: true}
});

let DB = DBVide();
let versionDonnees = 0;         /* augmente à chaque enregistrement : sert à savoir quand recalculer (index de recherche) */
let dossier = null;             /* dossier LIFE PANEL relié (Chrome, Edge, Opera) */
let dossierMemorise = null;     /* dossier relié lors d'une session précédente */
let derniereSauvegarde = null;

/* Forme de chaque élément : UNE seule définition, utilisée à la lecture (normaliser)
   ET à la création (ajouter). Un élément créé a donc toujours tous ses champs. */
const txt = v => (v === null || v === undefined) ? '' : String(v);
const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const itemsContact = a => Array.isArray(a) ? a.filter(i => i && i.t).map(i => ({t:txt(i.t), ok:!!i.ok})) : [];
/* Date « AAAA-MM-JJ » (ou « JJ/MM/AAAA ») qui existe vraiment : « 31/02/2026 » ou « 2026-13-01 » sont refusées ('') */
const dateReelle = (a, m, j) => { const d = new Date(Date.UTC(a, m - 1, j)); return d.getUTCFullYear() === a && d.getUTCMonth() === m - 1 && d.getUTCDate() === j; };
const dateISO = v => { const s = txt(v).trim(), m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  const r = /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
  return r && dateReelle(Number(r.slice(0, 4)), Number(r.slice(5, 7)), Number(r.slice(8, 10))) ? r : ''; };
const archivage = x => x.archive ? {archive:true, archiveLe:txt(x.archiveLe) || maintenant()} : {archive:false, archiveLe:''};
/* Tags : communs à toutes les listes. « #Révision, révision , permis de conduire » → ['Révision', 'permis-de-conduire']
   (sans #, sans doublon, casse gardée ; un espace devient un tiret pour que « #tag » se cherche d'un seul mot) */
function nettoyerTags(v){
  const l = (Array.isArray(v) ? v : txt(v).split(',')).map(s => txt(s).trim().replace(/^#+/, '').trim().replace(/\s+/g, '-')).filter(Boolean);
  const vus = new Set();
  return l.filter(t => { const k = norm(t); if(vus.has(k)) return false; vus.add(k); return true; });
}
/* Noms de comptes et de catégories : « Revolut », « revolut » et « Revolut  » sont le même nom */
const propreNom = s => txt(s).trim().replace(/\s+/g, ' ');
const cleNom = s => { const p = propreNom(s); return p ? norm(p) || p.toLowerCase() : ''; };   /* un nom fait d'un seul accent garde une clé */
const MAX_BUDGET = 1e9;
const MAX_MONTANT = 1e6;   /* une dépense ou une entrée d'argent : au plus 1 000 000 € */
/* Montant d'un mouvement : positif, fini, au plus MAX_MONTANT (un « 1e400 » importé ne devient plus ∞) */
const montantValide = v => { const n = Math.abs(Number(v)); return Number.isNaN(n) ? 0 : Math.min(MAX_MONTANT, n); };
/* Nombre positif (budget d'un projet, durée estimée), au plus max ; sinon null */
const positif = (v, max) => { const n = num(v); return n !== null && n >= 0 ? Math.min(max, n) : null; };
const arrondiBudget = v => { const b = num(v); if(b === null) return null; const r = Math.min(MAX_BUDGET, Math.round(b * 100) / 100); return r > 0 ? r : null; };
function formeCompte(c){
  const b = arrondiBudget(c.budget);
  return {nom:propreNom(c.nom), stats:c.stats !== false, budget:b, periode:c.periode === 'an' ? 'an' : 'mois'};
}
const FORMES = {
  projets:p => ({id:txt(p.id) || uid(), nom:txt(p.nom) || 'Sans nom', resume:txt(p.resume),
    budget:positif(p.budget, MAX_BUDGET), prochaineAction:txt(p.prochaineAction), echeance:dateISO(p.echeance),
    couleur:COULEURS.includes(p.couleur) ? p.couleur : '', dossier:cheminDrive(p.dossier), archive:!!p.archive, modif:txt(p.modif) || maintenant()}),
  taches:t => ({id:txt(t.id) || uid(), nom:txt(t.nom) || 'Sans titre', date:dateISO(t.date), heure:/^\d{2}:\d{2}$/.test(txt(t.heure)) ? txt(t.heure) : '',
    projet:t.projet || null, fait:!!t.fait, faitLe:t.fait ? txt(t.faitLe || t.modif) : '',
    priorite:['p1','p2','p3'].includes(t.priorite) ? t.priorite : 'p2', estimation:positif(t.estimation, 100000), tags:nettoyerTags(t.tags), modif:txt(t.modif) || maintenant(),
    ...archivage({...t, archive:t.archive && t.fait})}),   /* seule une tâche terminée peut être archivée */
  notes:n => { const cree = txt(n.cree || n.modif) || maintenant();   /* une seule heure : une note neuve n'est pas « modifiée » */
    return {id:txt(n.id) || uid(), titre:txt(n.titre) || 'Sans titre', contenu:txt(n.contenu),
      projet:n.projet || null, tags:nettoyerTags(n.tags), cree, modif:txt(n.modif) || cree, ...archivage(n)}; },
  /* Document : un lien (facultatif) et/ou une échéance à surveiller. L'url passe par le même contrôle que le
     formulaire (jamais de « javascript: » venu d'un fichier importé). Les anciens documents de projet sont repris tels quels. */
  documents:x => { const url = x.url ? normaliserLien(x.url) : '', pre = num(x.preavis), ajoute = txt(x.ajoute) || maintenant();
    return {id:txt(x.id) || uid(), titre:txt(x.titre).trim() || (url ? titreDepuisLien(url) : 'Sans titre'), url,
      echeance:dateISO(x.echeance), preavis:pre === null ? PREAVIS_DEFAUT : Math.max(0, Math.min(3650, Math.round(pre))),
      tags:nettoyerTags(x.tags), projet:x.projet || null, note:txt(x.note),
      ajoute, modif:txt(x.modif) || ajoute, ...archivage(x)}; },
  mouvements:m => ({id:txt(m.id) || uid(), date:dateISO(m.date) || aujourdhui(),
    montant:montantValide(m.montant), type:m.type === 'revenu' ? 'revenu' : 'depense',
    libelle:txt(m.libelle), categorie:txt(m.categorie), projet:m.projet || null, compte:txt(m.compte), cree:txt(m.cree),
    modif:txt(m.modif) || txt(m.cree)}),   /* VERSION 16 : sans date de modification, celle de la saisie (vide pour un relevé importé) */
  contacts:c => ({id:txt(c.id) || uid(), nom:txt(c.nom) || 'Sans nom', telephone:txt(c.telephone), autreTelephone:txt(c.autreTelephone), email:txt(c.email), adresse:txt(c.adresse), anniversaire:dateISO(c.anniversaire),
    derniereConversation:dateISO(c.derniereConversation), nouvelles:txt(c.nouvelles), projet:c.projet || null,
    aDire:itemsContact(c.aDire), aRepondre:itemsContact(c.aRepondre), idees:itemsContact(c.idees), tags:nettoyerTags(c.tags), modif:txt(c.modif), ...archivage(c)}),
  inbox:x => { const created = txt(x.created) || maintenant();
    return {id:txt(x.id) || uid(), text:txt(x.text), created, status:x.status === 'archived' ? 'archived' : 'open', archived:txt(x.archived), modif:txt(x.modif) || created}; }
};
/* Crée un élément complet dans la liste voulue (en tête pour l'Inbox) et le renvoie */
function ajouter(liste, brut){
  const x = FORMES[liste](brut);
  if(liste === 'projets' && !x.couleur) x.couleur = couleurLibre(DB.projets);
  DB[liste][liste === 'inbox' ? 'unshift' : 'push'](x);
  return x;
}

/* Remet n'importe quel jeu de données (v1, v3.2, v6, import, démo) au format actuel.
   Doit donner exactement le même résultat à chaque passage (aucune date ni id tirés au hasard
   pour des données déjà au format) : c'est ce qui permet de reconnaître un donnees.json identique. */
function normaliser(brut){
  const d = DBVide();
  if(!brut || typeof brut !== 'object') return d;
  const tab = k => Array.isArray(brut[k]) ? brut[k].filter(x => x && typeof x === 'object') : [];
  if(typeof brut.prenom === 'string') d.prenom = brut.prenom;
  LISTES_DONNEES.forEach(k => { d[k] = tab(k).map(FORMES[k]); });
  d.inbox = d.inbox.filter(x => x.text);
  d.projets.forEach(p => { if(!p.couleur) p.couleur = couleurLibre(d.projets); });   /* une couleur par projet, gardée */
  /* v3.4 à v3.7 : les documents étaient rangés dans leur projet → ils rejoignent la liste unique (projet conservé) */
  const dejaLa = new Set(d.documents.map(x => x.id));
  const reprendre = (liste, projetId) => (Array.isArray(liste) ? liste : []).filter(x => x && typeof x === 'object')
    .map(x => FORMES.documents({...x, projet:x.projet || projetId})).filter(x => !dejaLa.has(x.id) && dejaLa.add(x.id));
  tab('projets').forEach(p => { d.documents.push(...reprendre(p.documents, txt(p.id))); });
  /* Corbeille : chaque élément garde sa forme ; un projet garde ses liens pour être restauré avec eux */
  const liensValides = l => Object.fromEntries(LIENS_PROJET.map(k => [k, Array.isArray(l && l[k]) ? l[k].filter(v => typeof v === 'string') : []]));
  const brute = (Array.isArray(brut.corbeille) ? brut.corbeille : []).filter(e => e && FORMES[e.type] && e.element && typeof e.element === 'object');
  brute.forEach(e => {
    const quand = !e.supprimeLe || isNaN(new Date(e.supprimeLe)) ? maintenant() : txt(e.supprimeLe);
    const element = e.type === 'documents' ? {...e.element, projet:e.element.projet || e.projet || null} : e.element;   /* ancien format : projet à côté */
    const entree = {id:txt(e.id) || uid(), type:e.type, supprimeLe:quand, element:FORMES[e.type](element)};
    if(e.remplacee === true) entree.remplacee = true;   /* version écartée par la synchronisation (même élément modifié sur deux appareils) */
    if(e.type === 'projets'){
      entree.liens = liensValides(e.liens);
      /* ancien projet supprimé avec ses documents dedans : chaque document devient une entrée à part, liée au projet */
      (Array.isArray(e.element.documents) ? e.element.documents : []).filter(x => x && typeof x === 'object').forEach(x => {
        const doc = FORMES.documents({...x, projet:entree.element.id});
        d.corbeille.push({id:'c-' + doc.id, type:'documents', supprimeLe:quand, element:doc}); entree.liens.documents.push(doc.id);
      });
    }
    d.corbeille.push(entree);
  });
  /* Catégories : une seule écriture par catégorie (« Courses » = « courses ») ; celles des dépenses font partie de la liste */
  const vusC = new Map(); d.categories = [];
  const categorie = s => { const nom = propreNom(s), k = cleNom(nom); if(!k) return '';
    if(!vusC.has(k)){ vusC.set(k, nom); d.categories.push(nom); } return vusC.get(k); };
  (Array.isArray(brut.categories) ? brut.categories : []).forEach(categorie);
  if(!d.categories.length) CATEGORIES_DEFAUT.forEach(categorie);
  d.mouvements.forEach(m => { m.categorie = m.categorie ? categorie(m.categorie) : ''; });
  d.couleursCategories = colorerCategories(d.categories, brut.couleursCategories, d.mouvements);
  /* Comptes : liste gérée comme les catégories. Ceux qui n'existent que dans les dépenses y sont ajoutés
     (à l'écriture la plus fréquente : Revolut ×100 et revolut ×2 donnent « Revolut ») */
  const vusK = new Map(); d.comptes = [];
  const compte = c => { const k = cleNom(c.nom); if(!k) return; if(!vusK.has(k)){ vusK.set(k, c); d.comptes.push(c); } };
  (Array.isArray(brut.comptes) ? brut.comptes : []).filter(c => c && typeof c === 'object').map(formeCompte).forEach(compte);
  const ecritures = new Map();
  d.mouvements.forEach(m => { m.compte = propreNom(m.compte); if(!m.compte) return; const k = cleNom(m.compte);
    if(!ecritures.has(k)) ecritures.set(k, new Map()); const e = ecritures.get(k); e.set(m.compte, (e.get(m.compte) || 0) + 1); });
  ecritures.forEach((e, k) => { if(vusK.has(k)) return; let nom = '', n = 0; e.forEach((v, s) => { if(v > n){ nom = s; n = v; } }); compte(formeCompte({nom})); });
  d.mouvements.forEach(m => { const c = m.compte && vusK.get(cleNom(m.compte)); m.compte = c ? c.nom : ''; });
  /* Mouvements de la corbeille : mêmes noms que la liste quand ils y figurent (la liste n'est pas agrandie pour eux) */
  d.corbeille.forEach(e => { if(e.type !== 'mouvements') return; const el = e.element;
    const c = el.compte && vusK.get(cleNom(el.compte)); if(c) el.compte = c.nom;
    const k = el.categorie && cleNom(el.categorie); if(k && vusC.has(k)) el.categorie = vusC.get(k); });
  const r = brut.reglages || {};
  /* Jusqu'à la v3.9 : un seul budget mensuel. Il devient le budget du compte le plus utilisé */
  const ancienBudget = arrondiBudget(r.budgetMensuel);
  if(ancienBudget && !d.comptes.some(c => c.budget)){
    if(!d.comptes.length){ compte(formeCompte({nom:'Compte principal'})); d.mouvements.forEach(m => { m.compte = 'Compte principal'; }); }
    const usage = new Map(); d.mouvements.forEach(m => usage.set(m.compte, (usage.get(m.compte) || 0) + 1));
    const cible = d.comptes.reduce((a, c) => (usage.get(c.nom) || 0) > (usage.get(a.nom) || 0) ? c : a, d.comptes[0]);
    cible.budget = ancienBudget; cible.periode = 'mois';
  }
  d.reglages = {focusProjets:Array.isArray(r.focusProjets) ? r.focusProjets.slice(0,3) : [], lastReview:r.lastReview || null, demo:!!(r.demo),
    maj:typeof r.maj === 'string' ? r.maj : null,   /* maj : dernière modification, toutes données confondues */
    sansCompteStats:r.sansCompteStats !== false};    /* dépenses sans compte : prises en compte dans les statistiques */

  /* Plus de références fantômes vers un projet supprimé */
  const ids = new Set(d.projets.map(p => p.id));

}
/* Couleur de chaque catégorie : gardée d'une fois sur l'autre, jamais recalculée d'après le classement.
   ancien = [{nom, couleur}] (repris à la casse près). Une catégorie sans couleur prend la couleur la moins
   utilisée, dans l'ordre de la palette (8 teintes unies, puis les mêmes rayées) ; s'il y en a plusieurs,
   les plus dépensières d'abord. Même résultat à chaque passage : normaliser reste idempotent. */
function colorerCategories(categories, ancien, mouvements = []){
  const connues = new Map();
  (Array.isArray(ancien) ? ancien : []).forEach(x => {
    if(!x || typeof x !== 'object' || !COULEURS_CAT.includes(x.couleur)) return;
    const k = cleNom(x.nom); if(k && !connues.has(k)) connues.set(k, x.couleur);
  });
  const res = new Map(), usage = new Map(COULEURS_CAT.map(c => [c, 0]));
  const prendre = (nom, c) => { res.set(nom, c); usage.set(c, usage.get(c) + 1); };
  categories.forEach(nom => { const c = connues.get(cleNom(nom)); if(c && !res.has(nom)) prendre(nom, c); });
  const total = new Map();
  mouvements.forEach(m => { if(m.type !== 'revenu' && m.categorie) total.set(m.categorie, (total.get(m.categorie) || 0) + (Number(m.montant) || 0)); });
  categories.map((nom, i) => ({nom, i, t:total.get(nom) || 0})).filter(x => !res.has(x.nom))
    .sort((a, b) => b.t - a.t || a.i - b.i)
    .forEach(({nom}) => { if(!res.has(nom)) prendre(nom, COULEURS_CAT.reduce((m, c) => usage.get(c) < usage.get(m) ? c : m, COULEURS_CAT[0])); });
  return categories.map(nom => ({nom, couleur:res.get(nom)}));
}
