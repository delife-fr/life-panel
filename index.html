/* --- Stockage dans le navigateur (v3.9) ---
   La mémoire principale est IndexedDB : sa capacité se compte en centaines de Mo et l'écriture ne fige pas la page.
   (localStorage, utilisé jusqu'à la v3.8, plafonne vers 4,5 millions de caractères, soit un donnees.json de 5 à 6 Mo.)
   Tant que les données sont petites, une copie est aussi gardée dans localStorage : elle s'écrit instantanément,
   protège une modification faite juste avant de fermer l'onglet et prévient les autres onglets.
   Au démarrage, on prend la plus récente des deux. La copie de secours vit aussi dans IndexedDB.
   Le magasin s'appelle « poignees » parce qu'il gardait d'abord le seul dossier relié : le garder évite
   toute mise à jour de la base, que les versions précédentes ne sauraient pas ouvrir. */
const stockage = {idb:'indexedDB' in window, enAttente:0, erreur:false, taille:0, miroirAJour:false, canal:null};
let baseIdb = null;
function idb(){
  if(!baseIdb) baseIdb = new Promise((ok, ko) => {
    const r = indexedDB.open('lifepanel', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('poignees');
    r.onsuccess = () => { const db = r.result; db.onversionchange = () => { db.close(); baseIdb = null; }; db.onclose = () => { baseIdb = null; }; ok(db); };
    r.onerror = () => { baseIdb = null; ko(r.error); };
  });
  return baseIdb;
}
async function idbLire(k){ const db = await idb(); return new Promise((ok, ko) => { const q = db.transaction('poignees').objectStore('poignees').get(k); q.onsuccess = () => ok(q.result ?? null); q.onerror = () => ko(q.error); }); }
async function idbEcrire(k, v){ const db = await idb(); return new Promise((ok, ko) => { const tx = db.transaction('poignees', 'readwrite'); tx.objectStore('poignees').put(v, k); tx.oncomplete = () => ok(); tx.onerror = tx.onabort = () => ko(tx.error); }); }
async function idbSupprimer(k){ const db = await idb(); return new Promise((ok, ko) => { const tx = db.transaction('poignees', 'readwrite'); tx.objectStore('poignees').delete(k); tx.oncomplete = () => ok(); tx.onerror = tx.onabort = () => ko(tx.error); }); }

/* Écrit le texte JSON des données dans le navigateur (copie légère tout de suite, IndexedDB juste après) */
function enregistrerNavigateur(texte){
  const maj = DB.reglages.maj;
  stockage.taille = texte.length;
  let miroir = false;
  try { if(texte.length <= MIROIR_MAX){ localStorage.setItem(CLE, texte); miroir = true; } else localStorage.removeItem(CLE); }
  catch(e){ try { localStorage.removeItem(CLE); } catch(e2){} }   /* pas de place : jamais de copie périmée */
  stockage.miroirAJour = miroir;
  if(!stockage.idb){   /* navigateur sans IndexedDB : seule la copie légère existe (un seul message, pas à chaque modification) */
    if(miroir){ derniereSauvegarde = new Date(); stockage.erreur = false; }
    else if(!stockage.erreur){ stockage.erreur = true; toast('Le navigateur refuse d’enregistrer. Relie ton dossier LIFE PANEL ou exporte tes données (page Données).'); }
    return;
  }
  stockage.enAttente++;
  idbEcrire('donnees', texte).then(() => {
    derniereSauvegarde = new Date(); stockage.erreur = false;
    if(stockage.canal) try { stockage.canal.postMessage({maj}); } catch(e){}   /* les autres onglets se mettent à jour */
  }).catch(() => {
    if(!stockage.erreur) toast(miroir ? 'Le navigateur n’a pas pu enregistrer dans sa mémoire principale (une copie est gardée).' : 'Le navigateur refuse d’enregistrer. Relie ton dossier LIFE PANEL ou exporte tes données (page Données).');
    stockage.erreur = true;
  }).finally(() => { stockage.enAttente--; majPied(); });
}
/* Données gardées par le navigateur : la plus récente entre IndexedDB et la copie légère (null s'il n'y a rien) */
async function chargerNavigateur(){
  let texteMiroir = null, textePrincipal = null;
  try { texteMiroir = localStorage.getItem(CLE); } catch(e){}
  if(stockage.idb){ try { textePrincipal = await idbLire('donnees'); } catch(e){ stockage.idb = false; } }
  if(stockage.idb){
    /* Première ouverture de la v3.9 : les données de localStorage sont recopiées dans IndexedDB */
    if(!textePrincipal && texteMiroir) idbEcrire('donnees', texteMiroir).catch(() => {});
    /* Copie de secours des versions précédentes : rangée dans IndexedDB, place libérée dans localStorage */
    try { const ancien = localStorage.getItem(CLE_SECOURS);
      if(ancien){ if(!(await idbLire('secours'))) await idbEcrire('secours', ancien); localStorage.removeItem(CLE_SECOURS); } } catch(e){}
    try { secoursTexte = await idbLire('secours'); } catch(e){}
  } else { try { secoursTexte = localStorage.getItem(CLE_SECOURS); } catch(e){} }
  const lire = t => { try { return t ? JSON.parse(t) : null; } catch(e){ return null; } };
  const miroir = lire(texteMiroir), principal = lire(textePrincipal);
  const maj = d => (d && d.reglages && typeof d.reglages.maj === 'string') ? d.reglages.maj : '';
  const choix = principal && miroir ? (maj(miroir) > maj(principal) ? miroir : principal) : principal || miroir;
  stockage.taille = choix === miroir ? (texteMiroir || '').length : (textePrincipal || '').length;
  stockage.miroirAJour = !!miroir && choix === miroir || (!!miroir && maj(miroir) === maj(principal));
  return choix;
}

/* Chaque modification : navigateur tout de suite, puis fichier donnees.json du dossier relié */
function sauver({entretien = false} = {}){

}

/* Markdown : titres # à ######, **gras**, *italique*, ~~barré~~, `code`, blocs de code ``` ou ~~~, listes à puces
   et numérotées (imbriquées par retrait, numéro de départ respecté, lignes vides entre les éléments acceptées),
   cases à cocher, liens, tableaux, citations « > », séparateurs « --- ».
   analyseMd() découpe le texte en blocs : le même découpage sert à l'affichage (md) et au clic sur une case (basculerCaseMd). */
const QUOTE_MD = /^\s*>\s?(.*)$/, TRAIT_MD = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/, BLOC_MD = /^(\s*)(`{3,}|~{3,})(.*)$/;
const TITRE_MD = /^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/, ITEM_MD = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/, CASE_MD = /^\[( |x|X)\](?:\s+(.*))?$/;
/* Adresse e-mail : vide, ou « texte@domaine.ext » sans espace */
const emailValide = v => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
/* Cellules d'une ligne de tableau « | a | b | » (« \| » = barre dans une cellule) ; ligne de séparation « |---|:-:| » */
const cellulesMd = l => l.trim().replace(/^\|/, '').replace(/(^|[^\\])\|$/, '$1').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
const separationMd = l => { if(!l.includes('-')) return null; const c = cellulesMd(l); return c.length && c.every(x => /^:?-+:?$/.test(x)) ? c : null; };
function analyseMd(txt){
  const L = String(txt || '').replace(/\u0000/g, '').replace(/\r\n?/g, '\n').split('\n');
  const blocs = [], cases = [];   /* cases : numéro de ligne de chaque case à cocher, dans l'ordre */
  const retrait = s => s.match(/^\s*/)[0].replace(/\t/g, '    ').length;
  let para = null, pile = [], blanc = false;   /* pile : listes ouvertes, de la plus externe à la plus interne */
  const finListe = () => { pile = []; blanc = false; };
  /* Élément qui reçoit une ligne en retrait de c espaces : dernier élément de la liste la plus profonde assez à gauche */
  const itemPour = c => { for(let k = pile.length - 1; k >= 0; k--) if(c >= pile[k].indent + 2){ pile.length = k + 1; return pile[k].items[pile[k].items.length - 1]; } return null; };
  const finTableau = l => !l.trim() || !l.includes('|') || (ITEM_MD.test(l) && !TRAIT_MD.test(l)) || QUOTE_MD.test(l) || BLOC_MD.test(l) || TITRE_MD.test(l);
  for(let i = 0; i < L.length; i++){
    const l = L[i]; let m, sep;
    if((m = l.match(BLOC_MD)) && !(m[2][0] === '`' && m[3].includes('`'))){   /* bloc de code ``` ou ~~~ (jusqu'à la clôture, ou la fin) */
      const r = retrait(m[1]), fin = new RegExp('^\\s*' + m[2][0] + '{' + m[2].length + ',}\\s*$'), code = [];
      for(i++; i < L.length && !fin.test(L[i]); i++) code.push(L[i].replace(new RegExp('^ {0,' + r + '}'), ''));
      const b = {t:'code', code:code.join('\n')}, it = pile.length && r >= 2 ? itemPour(r) : null;
      para = null; if(it){ it.parts.push(b); blanc = false; } else { finListe(); blocs.push(b); }
      continue;
    }
    if(l.includes('|') && i + 1 < L.length && (sep = separationMd(L[i + 1])) && sep.length === cellulesMd(l).length){   /* tableau */
      para = null; finListe(); const entete = cellulesMd(l), corps = [];
      for(i += 2; i < L.length && !finTableau(L[i]); i++) corps.push(cellulesMd(L[i]));
      i--; blocs.push({t:'table', entete, sep, corps}); continue;
    }
    if(QUOTE_MD.test(l)){   /* citation : lignes « > » consécutives */
      para = null; finListe(); const lignes = [];
      for(; i < L.length && QUOTE_MD.test(L[i]); i++) lignes.push(L[i].replace(QUOTE_MD, '$1'));
      i--; blocs.push({t:'quote', lignes}); continue;
    }
    if(TRAIT_MD.test(l)){ para = null; finListe(); blocs.push({t:'hr'}); continue; }   /* séparateur « --- » */
    if((m = l.match(TITRE_MD))){ para = null; finListe(); blocs.push({t:'titre', n:m[1].length, texte:m[2]}); continue; }
    if((m = l.match(ITEM_MD))){   /* élément de liste */
      para = null;
      const ind = retrait(m[1]), type = /\d/.test(m[2]) ? 'ol' : 'ul', c = m[3].match(CASE_MD), debut = type === 'ol' ? parseInt(m[2], 10) : 1;
      const it = {coche:c ? c[1] !== ' ' : null, nCase:c ? cases.push(i) - 1 : -1, ecart:blanc, parts:[{t:'txt', lignes:[c ? c[2] || '' : m[3]]}]};
      while(pile.length > 1 && ind < pile[pile.length - 1].indent) pile.pop();
      const haut = pile[pile.length - 1];
      if(haut && ind >= haut.indent + 2){   /* sous-liste du dernier élément */
        const parent = haut.items[haut.items.length - 1], der = parent.parts[parent.parts.length - 1];
        const sous = der.t === 'liste' && der.type === type ? der : {t:'liste', type, debut, indent:ind, items:[]};
        if(sous !== der) parent.parts.push(sous); else sous.indent = Math.min(sous.indent, ind);
        sous.items.push(it); pile.push(sous);
      } else if(haut && haut.type === type) haut.items.push(it);   /* élément suivant, même après une ligne vide */
      else {   /* nouvelle liste (ou passage puces ↔ numéros au même niveau) */
        const nv = {t:'liste', type, debut, indent:ind, items:[it]};
        if(pile.length > 1){ pile[pile.length - 2].items[pile[pile.length - 2].items.length - 1].parts.push(nv); pile[pile.length - 1] = nv; }
        else { blocs.push(nv); pile = [nv]; }
      }
      blanc = false; continue;
    }
    if(!l.trim()){ para = null; if(pile.length) blanc = true; continue; }
    if(pile.length){   /* ligne en retrait sous un élément : suite de cet élément */
      const it = retrait(l) >= 2 ? itemPour(retrait(l)) : null;
      if(it){ const der = it.parts[it.parts.length - 1];
        if(der.t === 'txt' && !blanc) der.lignes.push(l.trim()); else it.parts.push({t:'txt', lignes:[l.trim()]});
        blanc = false; continue; }
      finListe();
    }
    if(!para){ para = {t:'para', lignes:[]}; blocs.push(para); }
    para.lignes.push(l);
  }
  return {blocs, cases};
}
/* Coche ou décoche la i-ème case à cocher d'un texte Markdown (dans l'ordre du texte) */
function basculerCaseMd(txt, i, coche){
  const L = String(txt || '').replace(/\r\n?/g, '\n').split('\n'), n = analyseMd(txt).cases[i];
  if(n !== undefined) L[n] = L[n].replace(/\[( |x|X)\]/, coche ? '[x]' : '[ ]');
  return L.join('\n');
}
/* Mise en forme d'une ligne : `code` et liens d'abord mis à l'abri, puis gras / italique / barré.
   « * » entouré d'espaces (ex. 3 * 4) n'est pas de l'italique. */
function enLigneMd(s){
  const abri = [], garde = h => '\u0000' + (abri.push(h) - 1) + '\u0000';
  const emph = t => t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\*\*\*(?=[^\s*])(.+?)(?<=[^\s*])\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(?=[^\s*])(.+?)(?<=[^\s*])\*\*/g, '<strong>$1</strong>')
    .replace(/\*(?=[^\s*])([^*]*?)(?<=[^\s*])\*/g, '<em>$1</em>');
  s = String(s).replace(/(`+)(.+?)\1(?!`)/g, (_, b, c) => garde('<code>' + esc(c.replace(/^ (.+) $/, '$1')) + '</code>'))
    /* liens : https://…, mailto:…, ou chemin relatif sans « : » (ex. Documents/Garantie.pdf, à côté du fichier HTML) */
    .replace(/\[([^\]]+)\]\(((?:https?:|mailto:)[^)\s]+|[^):\s]+)\)/g, (_, t, u) => garde(`<a href="${esc(u)}" target="_blank" rel="noopener">${emph(esc(t))}</a>`));
  s = emph(esc(s));
  for(let k = 0; k < 4 && s.includes('\u0000'); k++) s = s.replace(/\u0000(\d+)\u0000/g, (_, n) => abri[n]);
  return s;
}
/* cases : true = cases à cocher cliquables (note enregistrée) ; sinon affichées mais inactives (aperçu) */
function md(txt, {cases = false} = {}){
  const lignes = ls => ls.map(enLigneMd).join('<br>');
  const item = (it, k) => {
    const suite = it.parts.slice(1).map(p => p.t === 'txt' ? '<p>' + lignes(p.lignes) + '</p>' : bloc(p)).join('');
    const cl = [it.coche === null ? '' : 'tache-md' + (it.coche ? ' faite' : ''), it.ecart && k ? 'md-ecart' : ''].filter(Boolean).join(' ');
    const li = cl ? `<li class="${cl}">` : '<li>';
    if(it.coche === null) return li + lignes(it.parts[0].lignes) + suite + '</li>';
    return `${li}<input type="checkbox" class="case-md" ${cases ? `data-md-case="${it.nCase}"` : 'disabled'}${it.coche ? ' checked' : ''} aria-label="${it.coche ? 'Fait' : 'À faire'}"><span>${lignes(it.parts[0].lignes)}</span>${suite}</li>`;
  };
  const cellule = (b, v, al) => `<${b}${al ? ` style="text-align:${al}"` : ''}>${enLigneMd(v || '')}</${b}>`;
  const bloc = b => {
    if(b.t === 'para') return '<p>' + lignes(b.lignes) + '</p>';
    if(b.t === 'titre') return `<h${b.n}>${enLigneMd(b.texte)}</h${b.n}>`;
    if(b.t === 'hr') return '<hr>';
    if(b.t === 'code') return `<pre class="code-md"><code>${esc(b.code)}</code></pre>`;
    if(b.t === 'liste') return `<${b.type}${b.type === 'ol' && b.debut !== 1 ? ` start="${b.debut}"` : ''}>${b.items.map(item).join('')}</${b.type}>`;
    if(b.t === 'quote') return '<blockquote>' + b.lignes.join('\n').split(/\n\s*\n/).map(p => '<p>' + p.split('\n').map(enLigneMd).join('<br>') + '</p>').join('') + '</blockquote>';
    const al = b.sep.map(x => x.startsWith(':') && x.endsWith(':') ? 'center' : x.endsWith(':') ? 'right' : '');   /* tableau */
    return `<div class="table-md"><table><thead><tr>${b.entete.map((v, j) => cellule('th', v, al[j])).join('')}</tr></thead><tbody>${
      b.corps.map(r => '<tr>' + b.entete.map((_, j) => cellule('td', r[j], al[j])).join('') + '</tr>').join('')}</tbody></table></div>`;
  };
  return analyseMd(txt).blocs.map(bloc).join('') || '<p class="faible">Note vide.</p>';
}

  (a.fait - b.fait) || (rangPrio(a) - rangPrio(b)) ||
  (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31') || (a.heure || '99:99').localeCompare(b.heure || '99:99'));
const estEnRetard = t => !t.fait && !!t.date && t.date < aujourdhui();

function cocherTache(t, fait){
  t.fait = fait; t.faitLe = fait ? maintenant() : ''; t.modif = maintenant();

/* --- Finances ---
   Les statistiques (page Finances, finances de l'accueil) ne regardent que les comptes cochés.
   Le total d'un projet, la recherche et le journal gardent tous les mouvements. */
const somme = arr => arr.reduce((s, m) => s + (Number(m.montant) || 0), 0);
const unCompte = nom => DB.comptes.find(c => c.nom === nom) || null;
const comptesCoches = () => DB.comptes.filter(c => c.stats);
let cacheStats = null;
function mouvementsStats(){
  const cle = versionDonnees + '|' + DB.comptes.map(c => c.nom + (c.stats ? '+' : '-')).join('') + DB.reglages.sansCompteStats;
  if(cacheStats && cacheStats.cle === cle && cacheStats.db === DB) return cacheStats.l;
  const exclus = new Set(DB.comptes.filter(c => !c.stats).map(c => c.nom)), sans = DB.reglages.sansCompteStats !== false;
  const l = exclus.size || !sans ? DB.mouvements.filter(m => m.compte ? !exclus.has(m.compte) : sans) : DB.mouvements;
  cacheStats = {cle, db:DB, l};
  return l;
}
const dansStats = m => m.compte ? (unCompte(m.compte) || {stats:true}).stats : DB.reglages.sansCompteStats !== false;
const depenses = f => mouvementsStats().filter(m => m.type !== 'revenu' && (!f || f(m)));
const revenus = f => mouvementsStats().filter(m => m.type === 'revenu' && (!f || f(m)));
const duMois = mois => m => (m.date || '').startsWith(mois);
const totalMois = (mois = moisCourant()) => somme(depenses(duMois(mois)));
const revenusMois = (mois = moisCourant()) => somme(revenus(duMois(mois)));
const totalJour = j => somme(depenses(m => m.date === j));
const totalProjet = id => somme(DB.mouvements.filter(m => m.type !== 'revenu' && m.projet === id));   /* tous les comptes */
/* Budgets des comptes cochés, additionnés : un budget annuel compte pour 1/12 chaque mois */
const budgetMensuel = () => comptesCoches().reduce((s, c) => s + (c.budget ? (c.periode === 'an' ? c.budget / 12 : c.budget) : 0), 0);
const budgetAnnuel = () => comptesCoches().reduce((s, c) => s + (c.budget ? (c.periode === 'an' ? c.budget : c.budget * 12) : 0), 0);
const totalAnnee = (annee, jusquA = '9999-12') => somme(depenses(m => (m.date || '').startsWith(annee) && m.date.slice(0, 7) <= jusquA));
const sansCategorie = () => DB.mouvements.filter(m => m.type !== 'revenu' && !m.categorie);   /* à ranger, quel que soit le compte */
const nbMouvementsCompte = nom => DB.mouvements.filter(m => m.compte === nom).length;
const nbMouvementsCategorie = nom => DB.mouvements.filter(m => m.categorie === nom).length;
/* Un nom tapé dans un formulaire : le compte ou la catégorie existant(e) s'il y en a un(e) à la casse près, sinon on le crée */
function assurerCompte(nom){
  const k = cleNom(nom), c = DB.comptes.find(x => cleNom(x.nom) === k);
  if(c) return c.nom;
  const n = formeCompte({nom}); DB.comptes.push(n); return n.nom;
}
function assurerCategorie(nom){
  const k = cleNom(nom), c = DB.categories.find(x => cleNom(x) === k);
  if(c) return c;
  const n = propreNom(nom); DB.categories.push(n);
  DB.couleursCategories = colorerCategories(DB.categories, DB.couleursCategories, DB.mouvements);   /* la nouvelle prend une couleur libre */
  return n;
}
/* Compte proposé pour un nouveau mouvement : celui de la dernière saisie, sinon le premier de la liste */
function compteParDefaut(){
  let dernier = null;
  DB.mouvements.forEach(m => { if(m.cree && (!dernier || m.cree > dernier.cree)) dernier = m; });
  if(dernier && (!dernier.compte || unCompte(dernier.compte))) return dernier.compte;
  return DB.comptes[0] ? DB.comptes[0].nom : '';
}
function joursEcoules(mois){
  const cour = moisCourant();
  return mois === cour ? new Date().getDate() : (mois < cour ? joursDansMois(mois) : 0);
}
function evolution(mois = moisCourant()){
  const prec = decaleMois(mois, -1), actuel = totalMois(mois);
  const avant = mois === moisCourant()
    ? somme(depenses(m => (m.date || '').startsWith(prec) && Number(m.date.slice(8, 10)) <= new Date().getDate()))
    : totalMois(prec);
  return avant ? Math.round((actuel - avant) / avant * 100) : null;
}
/* Couleur d'une catégorie : celle qu'elle garde (DB.couleursCategories), quels que soient le mois,
   l'année et les comptes cochés. Filet de sécurité (catégorie hors liste) : une teinte tirée de son nom. */
function couleurCategorie(nom){
  const x = (DB.couleursCategories || []).find(c => c.nom === nom);
  return x ? x.couleur : TEINTES_CAT[hachage(cleNom(nom)) % TEINTES_CAT.length];
}
/* Répartition par catégorie : TOUTES les catégories de la période, de la plus grosse à la plus petite,
   puis « À catégoriser » (gris) à part */
function repartition(liste){
  const t = new Map();   /* catégorie → {val : montant, n : nombre d'opérations} */
  liste.forEach(m => { const c = m.categorie || '', x = t.get(c) || {val:0, n:0}; x.val += Number(m.montant) || 0; x.n++; t.set(c, x); });
  const parts = []; let sans = null;
  t.forEach(({val, n}, nom) => { if(!(val > 0)) return; if(nom) parts.push({nom, val, n, couleur:couleurCategorie(nom)}); else sans = {val, n}; });
  parts.sort((a, b) => b.val - a.val || a.nom.localeCompare(b.nom, 'fr'));
  if(sans) parts.push({nom:'À catégoriser', val:sans.val, n:sans.n, couleur:'gris', sans:true});
  return parts;
}

/* --- Contacts --- */
/* Jour de l'anniversaire (« MM-JJ ») une année donnée : né un 29 février → fêté le 28 février les années non bissextiles
   (la même règle pour les rappels, le calendrier de l'accueil et la fenêtre du jour) */
const bissextile = a => (a % 4 === 0 && a % 100 !== 0) || a % 400 === 0;
const jourAnniv = (s, annee) => { const md = String(s || '').slice(5); return md === '02-29' && !bissextile(Number(annee)) ? '02-28' : md; };
function joursAvantAnniv(s){
  if(!versDate(s)) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  const date = a => { const [m, j] = jourAnniv(s, a).split('-').map(Number); return new Date(a, m - 1, j); };
  let p = date(h.getFullYear());
  if(p < h) p = date(h.getFullYear() + 1);
  return Math.round((p - h) / 86400000);
}
const contactsActifs = () => DB.contacts.filter(c => !c.archive);
const anniversaires = max => contactsActifs().map(c => ({c, j:joursAvantAnniv(c.anniversaire)}))
  .filter(x => x.j !== null && x.j <= max).sort((a, b) => a.j - b.j);
const reponsesEnAttente = () => contactsActifs().reduce((n, c) => n + c.aRepondre.filter(i => !i.ok).length, 0);
const inboxOuverte = () => DB.inbox.filter(x => x.status !== 'archived');

/* --- Documents : échéance et préavis ---
   etat : 'expire' (date passée), 'preavis' (dans le préavis, aujourd'hui compris), 'plus-tard', 'sans' (pas d'échéance) */
const documentsActifs = () => nonArchives(DB.documents);
function etatDocument(x){
  if(!x.echeance) return {etat:'sans', jours:null};
  const ecart = ecartJours(x.echeance);
  if(ecart === null) return {etat:'sans', jours:null};
  const jours = -ecart;   /* jours restants avant l'échéance */
  return {etat:jours < 0 ? 'expire' : jours <= x.preavis ? 'preavis' : 'plus-tard', jours};
}
/* À renouveler : dans le préavis ou déjà expirés, les plus urgents d'abord */
const documentsARenouveler = () => documentsActifs().map(x => ({x, ...etatDocument(x)})).filter(e => e.etat === 'expire' || e.etat === 'preavis').sort((a, b) => a.jours - b.jours);
function texteEcheance(jours){
  if(jours < -1) return 'expiré depuis ' + pluriel(-jours, 'jour');
  if(jours === -1) return 'expiré depuis hier';
  if(jours === 0) return 'expire aujourd’hui';
  if(jours === 1) return 'expire demain';
  return 'expire dans ' + pluriel(jours, 'jour');
}
/* Tags d'une liste d'éléments, sans doublon d'accent ni de casse (« Santé » et « santé » ne font qu'un : la première écriture sert de nom) */
function tagsDe(l){
  const vus = new Map();
  l.forEach(x => x.tags.forEach(t => { const c = norm(t); if(!vus.has(c)) vus.set(c, t); }));
  return [...vus.values()].sort((a, b) => a.localeCompare(b, 'fr'));
}
const aLeTag = (x, t) => { const c = norm(t); return x.tags.some(y => norm(y) === c); };
/* Tous les tags utilisés, toutes listes confondues (tâches, notes, documents, contacts) */
const LISTES_TAGS = ['taches', 'notes', 'documents', 'contacts'];
const tousLesTags = () => tagsDe(LISTES_TAGS.flatMap(k => DB[k]));

/* --- Ce que l'accueil doit signaler (une seule liste, plus de doublons) --- */
function rappels(){
  const r = [], mois = totalMois(), bm = budgetMensuel(), hier = totalJour(decaleJour(-1));
  const retard = tachesEnRetard().length, inbox = inboxOuverte().length, sc = sansCategorie().length, rep = reponsesEnAttente();
  if(retard) r.push({icone:'alerte', couleur:'rose', html:`<b>${pluriel(retard, 'tâche')}</b> en retard.`, label:'Voir', href:'#/taches'});
  /* Documents : signalés à part (style « échéance »), le plus urgent en premier */
  documentsARenouveler().forEach(({x, etat, jours}) => r.push({icone:'document', couleur:etat === 'expire' ? 'rose' : 'jaune', cls:'echeance ' + etat,
    html:`<b>${esc(x.titre)}</b> ${texteEcheance(jours)}${jours >= 0 ? ' (' + esc(dateCourte(x.echeance)) + ')' : ''}.`, label:'Voir', href:href('document', x.id)}));
  if(inbox) r.push({icone:'ampoule', couleur:'jaune', html:`<b>${pluriel(inbox, 'élément')}</b> dans l’Inbox.`, label:'Trier', href:'#/inbox'});
  if(hier > 0) r.push({icone:'euro', couleur:'vert', html:`Tu as dépensé <b>${eur(hier)}</b> hier.`, label:'Voir', href:'#/finances'});
  if(bm && mois > bm) r.push({icone:'alerte', couleur:'rose', html:`Budget du mois dépassé de <b>${eur(mois - bm)}</b>.`, label:'Voir', href:'#/finances'});
  else if(bm && mois > bm * .8) r.push({icone:'alerte', couleur:'jaune', html:`Il reste <b>${eur(bm - mois)}</b> sur le budget du mois.`, label:'Voir', href:'#/finances'});
  if(sc) r.push({icone:'tag', couleur:'jaune', html:`<b>${pluriel(sc, 'dépense')}</b> ${sc > 1 ? 'attendent' : 'attend'} une catégorie.`, label:'Catégoriser', action:'categoriser'});
  anniversaires(30).forEach(({c, j}) => r.push({icone:'cadeau', couleur:'rose',
    html:`Anniversaire de <b>${esc(c.nom)}</b> ${j === 0 ? 'aujourd’hui' : j === 1 ? 'demain' : `dans <b>${j} jours</b>`}.`, label:'Fiche', href:href('contact', c.id)}));
  if(rep) r.push({icone:'bulle', couleur:'violet', html:`<b>${pluriel(rep, 'message')}</b> en attente de réponse.`, label:'Voir', href:'#/contacts'});
  projetsActifs().filter(p => p.budget && totalProjet(p.id) > p.budget).forEach(p => r.push({icone:'dossier', couleur:'orange',
    html:`Le projet <b>${esc(p.nom)}</b> dépasse son budget de <b>${eur(totalProjet(p.id) - p.budget)}</b>.`, label:'Ouvrir', href:href('projet', p.id)}));
  const derniere = DB.reglages.lastReview;
  if(compter(DB) && (!derniere || ecartJours(derniere) >= 7))
    r.push({icone:'calendrier', couleur:'violet', html:derniere ? `Dernière revue hebdo ${ilya(derniere)}.` : 'Aucune revue hebdo pour l’instant.', label:'Faire la revue', href:'#/revue'});
  return r;
}

/* --- Archives et corbeille ---
   Archiver = ranger sans supprimer (tâches terminées, notes, contacts).
   Supprimer = mettre à la corbeille, d'où l'on peut restaurer pendant 30 jours. */
const nonArchives = l => l.filter(x => !x.archive);
/* (la date de modification n'est pas touchée : archiver ne change pas le contenu) */
function basculerArchive(x){ x.archive = !x.archive; x.archiveLe = x.archive ? maintenant() : ''; return x.archive; }
/* Une tâche terminée part aux archives le lendemain */
function archiverTachesTerminees(){
  const auj = aujourdhui(); let n = 0;
  DB.taches.forEach(t => { if(t.fait && !t.archive && (jourDe(t.faitLe) || '') < auj){ t.archive = true; t.archiveLe = maintenant(); n++; } });
  return n;
}
function mettreCorbeille(type, element, extra = {}){
  DB.corbeille.unshift({id:uid(), type, supprimeLe:maintenant(), element:JSON.parse(JSON.stringify(element)), ...extra});
}
const ageCorbeille = e => (Date.now() - new Date(e.supprimeLe).getTime()) / 86400000;
const joursRestants = e => { const r = Math.ceil(JOURS_CORBEILLE - ageCorbeille(e)); return isFinite(r) ? Math.max(0, r) : JOURS_CORBEILLE; };
function purgerCorbeille(){
  const avant = DB.corbeille.length;
  DB.corbeille = DB.corbeille.filter(e => !(ageCorbeille(e) >= JOURS_CORBEILLE));
  return avant - DB.corbeille.length;
}
/* Restaure un élément de la corbeille ; renvoie le nom du projet encore à la corbeille auquel il sera rattaché ('' sinon) */
function restaurer(e){
  const x = JSON.parse(JSON.stringify(e.element));
  if(DB[e.type].some(y => y.id === x.id)) x.id = uid();
  const projetEnCorbeille = x.projet && !projet(x.projet) ? DB.corbeille.find(c => c.type === 'projets' && c.element.id === x.projet) : null;
  if(x.projet && !projet(x.projet)) x.projet = null;
  if(e.type === 'mouvements'){ x.compte = propreNom(x.compte) ? assurerCompte(x.compte) : ''; x.categorie = propreNom(x.categorie) ? assurerCategorie(x.categorie) : ''; }
  const el = ajouter(e.type, x);
  /* Son projet est aussi à la corbeille : il le retrouvera quand le projet sera restauré */
  if(projetEnCorbeille && LIENS_PROJET.includes(e.type)) projetEnCorbeille.liens[e.type].push(el.id);
  /* Un projet restauré retrouve ses tâches, notes, documents, dépenses et contacts (s'ils n'ont pas été rattachés
     ailleurs) — y compris ceux qui sont encore dans la corbeille : ils reviendront rattachés, dans n'importe quel ordre */
  if(e.type === 'projets') LIENS_PROJET.forEach(k => { const ids = (e.liens && e.liens[k]) || [];
    DB[k].forEach(y => { if(ids.includes(y.id) && !y.projet) y.projet = el.id; });
    DB.corbeille.forEach(c => { if(c.type === k && ids.includes(c.element.id) && !c.element.projet) c.element.projet = el.id; }); });
  toucherProjet(el.projet);
  DB.corbeille = DB.corbeille.filter(c => c !== e);
  return projetEnCorbeille ? projetEnCorbeille.element.nom : '';   /* projet qu'il retrouvera à sa restauration */
}
/* Entretien au démarrage et à minuit : archivage des tâches de la veille, corbeille de plus de 30 jours */
function entretien(){ if(archiverTachesTerminees() + purgerCorbeille()) sauver({entretien:true}); }

/* --- Journal : ce qui a été saisi ou fait récemment (jamais les échéances futures) ---
   Chaque source donne la date de l'entrée (texte ISO) et, seulement si elle est retenue, l'entrée elle-même. */
const SOURCES_JOURNAL = [
  [() => DB.mouvements, m => m.cree || (m.date ? m.date + 'T12:00:00' : ''), m => ({icone:m.type === 'revenu' ? 'haut' : 'euro', couleur:'vert',
    titre:(m.type === 'revenu' ? 'Entrée — ' : 'Dépense — ') + eur(m.montant), sous:(m.libelle || m.categorie || 'Sans libellé') + ' · ' + dateCourte(m.date),
    href:m.projet ? href('projet', m.projet) : '#/finances'})],
  [() => DB.notes, x => x.modif, x => ({icone:'doc', couleur:'orange', titre:(x.modif !== x.cree ? 'Note modifiée' : 'Note créée'), sous:x.titre, href:href('note', x.id)})],
  [() => DB.documents, x => x.modif, x => ({icone:'document', couleur:'bleu', titre:x.modif !== x.ajoute ? 'Document modifié' : 'Document ajouté', sous:x.titre, href:href('document', x.id)})],
  [() => DB.taches, t => t.fait ? t.faitLe : '', t => ({icone:'coche', couleur:'bleu', titre:'Tâche terminée', sous:t.nom, href:'#/taches'})],
  [() => DB.contacts, c => c.derniereConversation ? c.derniereConversation + 'T12:00:00' : '', c => ({icone:'bulle', couleur:'rose', titre:'Échange avec ' + c.nom, sous:dateCourte(c.derniereConversation), href:href('contact', c.id)})],
  [inboxOuverte, x => x.created, x => ({icone:'ampoule', couleur:'jaune', titre:'Capture dans l’Inbox', sous:x.text, href:'#/inbox'})]
];
/* Les n entrées les plus récentes. On ne regarde d'abord que les 30 derniers jours (puis 240, puis tout) :
   un élément plus ancien ne peut pas passer devant, même avec l'écart entre heure locale et heure UTC (marge de 2 jours). */
function journal(n = 6){
  const now = Date.now(), JOUR = 86400000;
  for(let jours = 30; ; jours *= 8){
    const tout = jours > 20000, limite = tout ? '' : iso(new Date(now - jours * JOUR));
    const l = [];
    SOURCES_JOURNAL.forEach(([liste, quand, entree]) => liste().forEach(x => {
      const t = quand(x); if(!t || (!tout && t < limite)) return;
      const d = versDate(t), ms = d ? d.getTime() : 0;
      if(ms && ms <= now) l.push({t, ms, x, entree});
    }));
    l.sort((a, b) => b.ms - a.ms);
    if(tout || (l.length >= n && l[n - 1].ms >= now - (jours - 2) * JOUR)) return l.slice(0, n).map(e => ({t:e.t, ...e.entree(e.x)}));
  }
}

/* --- Pastilles du calendrier de l'accueil : un seul passage sur les données pour tout le mois --- */
function marqueursMois(ym){
  const r = {taches:new Set(), mvts:new Set(), anniv:new Set(), docs:new Map()}, mm = ym.slice(5) + '-';
  DB.taches.forEach(t => { if(!t.fait && t.date && t.date.startsWith(ym)) r.taches.add(t.date); });
  mouvementsStats().forEach(m => { if(m.date && m.date.startsWith(ym)) r.mvts.add(m.date); });
  contactsActifs().forEach(c => { const md = c.anniversaire ? jourAnniv(c.anniversaire, ym.slice(0, 4)) : ''; if(md.startsWith(mm)) r.anniv.add(md); });
  documentsActifs().forEach(x => { if(!x.echeance || !x.echeance.startsWith(ym)) return;
    const e = etatDocument(x).etat; if(e !== 'preavis' && e !== 'expire') return;   /* signalé dès l'entrée dans le préavis */
    if(!r.docs.has(x.echeance)) r.docs.set(x.echeance, []); r.docs.get(x.echeance).push({x, etat:e}); });
  return r;
}
/* --- Ce qui concerne un jour donné (calendriers) --- */
function evenementsJour(j){
  const md = j.slice(5);
  return {
    taches: trierTaches(DB.taches.filter(t => t.date === j)),
    anniv: contactsActifs().filter(c => c.anniversaire && jourAnniv(c.anniversaire, j.slice(0, 4)) === md),
    mvts: mouvementsStats().filter(m => m.date === j),
    notes: DB.notes.filter(n => jourDe(n.cree) === j),
    documents: DB.documents.filter(x => x.echeance === j && !x.archive)
  };
}

/* ==========================================================================
   E. BRIQUES D'AFFICHAGE
   ========================================================================== */
const enteteCarte = (icone, couleur, titre, droite = '') =>
  `<div class="entete-carte">${pastille(icone, couleur)}<h2>${titre}</h2>${droite ? `<div class="droite">${droite}</div>` : ''}</div>`;
const lienSous = (txt, h) => `<a class="lien-sous" href="${h}">${txt}${ico('fleche', 13)}</a>`;
const btnAction = (action, txt, cls = 'btn', data = '') => `<button type="button" class="${cls}" data-action="${action}" ${data}>${txt}</button>`;
const vide = (texte, boutons = '') => `<div class="vide"><p>${texte}</p>${boutons ? `<div class="boutons">${boutons}</div>` : ''}</div>`;
const barre = (pct, cls = '', couleur = '') =>
  `<span class="barre-prog ${cls}"><i style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%${couleur ? ';background:' + couleur : ''}"></i></span>`;
const barreBudget = (part, total, extra = '') => total ? barre(part / total * 100, (part > total ? 'dep' : part > total * .8 ? 'att' : '') + ' ' + extra) : '';
/* Même barre, avec un trait à l'endroit où l'on devrait en être si l'on suit le budget */
const barreRythme = (part, total, rythme) => !total ? '' : barreBudget(part, total).replace(/<\/span>$/,
  `<b class="repere" style="left:${Math.min(100, rythme / total * 100).toFixed(1)}%" title="Rythme du budget : ${esc(eur(rythme))} à ce stade de l’année"></b></span>`);
function noteBudget(dep, budget){
  if(!budget) return {note:'aucun budget défini', cls:''};
  if(dep > budget) return {note:'dépassé de ' + eur(dep - budget), cls:'dep'};
  return {note:'reste ' + eur(budget - dep) + ' sur ' + eur(budget), cls:dep > budget * .8 ? 'att' : ''};
}
function kpi({icone, couleur, libelle, valeur, note = '', cls = '', prog = '', lien = ''}){
  const b = lien ? 'a' : 'div';
  return `<${b} class="carte kpi${lien ? ' cliquable' : ''}"${lien ? ` href="${lien}"` : ''}>
    <div class="haut">${pastille(icone, couleur)}<span>${libelle}</span></div>
    <div class="valeur">${valeur}</div><div class="note ${cls}">${note}</div>${prog}</${b}>`;
}
function tagProjet(id, lien = true){
  const p = projet(id); if(!p) return '';
  const c = couleurDe(p.id), style = `color:var(${VAR[c]});background:${FOND[c]};border-color:${BORD[c]}`;
  return lien ? `<a class="puce proj" href="${href('projet', p.id)}" style="${style}">${esc(p.nom)}</a>`
              : `<span class="puce proj" style="${style}">${esc(p.nom)}</span>`;
}
const vignetteProjet = (p, taille = 38, ti = 18) => { const c = couleurDe(p.id);
  return `<span class="vignette" style="width:${taille}px;height:${taille}px;background:${FOND[c]}">${ico('dossier', ti, 'var(' + VAR[c] + ')')}</span>`; };
/* Tag : commun à tous les modules ; un clic montre tout ce qui le porte (page Recherche « #tag ») */
const puceTag = t => `<a class="puce tag" href="#/recherche?q=${encodeURIComponent('#' + t)}" title="Tout ce qui porte le tag #${esc(t)}">#${esc(t)}</a>`;
const pucesTags = tags => tags.map(puceTag).join('');
const badgePrio = t => `<span class="priorite ${t.priorite}" title="Priorité ${t.priorite.slice(1)}">P${t.priorite.slice(1)}</span>`;

/* Une ligne de tâche — la même partout (accueil, Aujourd'hui, Tâches, projet, calendrier) */
function ligneTache(t, {date = true} = {}){
  const meta = [];
  if(t.heure) meta.push(esc(t.heure));
  if(estEnRetard(t)) meta.push(`<span class="retard">En retard · ${esc(labelJour(t.date))}</span>`);
  else if(date && t.date && t.date !== aujourdhui()) meta.push(esc(labelJour(t.date)));
  if(t.estimation) meta.push(t.estimation + ' min');
  if(t.fait && t.faitLe) meta.push('terminée ' + ilya(t.faitLe) + (t.archive ? ' · archivée' : ''));
  const enFocus = focusEnCours && focusEnCours.taskId === t.id;
  return `<li class="tache${t.fait ? ' faite' : ''}">
    <input type="checkbox" class="case" data-coche="tache" data-id="${esc(t.id)}" ${t.fait ? 'checked' : ''} aria-label="${t.fait ? 'Rouvrir' : 'Terminer'} : ${esc(t.nom)}">
    <div class="corps"><div class="t"><span>${esc(t.nom)}</span>${t.fait ? '' : badgePrio(t)}</div>

    <div class="actions-ligne">
      ${t.fait ? '' : `<button class="icone-btn" data-action="focus" data-id="${esc(t.id)}" title="${enFocus ? 'Focus en cours' : 'Focus de 25 min'}" aria-label="Focus"${enFocus ? ' style="color:var(--i-bleu);opacity:1"' : ''}>${ico('horloge', 15)}</button>`}

}

/* --- Anneau des dépenses + légende (survol : la part s'affiche au centre) ---
   Toutes les catégories y figurent. Une toute petite part garde une longueur minimale pour rester visible
   (les chiffres exacts sont dans la légende). Couleurs rayées : motif SVG propre à chaque anneau. */
const ANNEAU = {cote:200, r:82, ep:26, epSurvol:32};
let nAnneaux = 0;
/* tableau : version de la page Finances — légende en tableau (barre, montant, %, nombre d'opérations),
   lignes et parts cliquables (filtre des mouvements, action « fin-cat ») */
const cleCat = p => p.sans ? SANS_CAT : p.nom;
function donut(parts, total, libelle, {tableau = false} = {}){
  const {cote, r:R, ep} = ANNEAU, m = cote / 2, C = 2 * Math.PI * R, n = parts.length, id = 'ray' + (++nAnneaux);
  const base = parts.reduce((s, p) => s + p.val, 0) || 1;
  const ecart = n > 1 ? Math.min(3, C * .25 / n) : 0, dispo = C - n * ecart, MIN = 3;
  const brutes = parts.map(p => p.val / base * dispo);
  const nbPetites = brutes.filter(l => l < MIN).length, grandes = brutes.reduce((s, l) => s + (l < MIN ? 0 : l), 0);
  const reste = dispo - nbPetites * MIN;
  const longs = brutes.map(l => reste > 0 && grandes > 0 ? (l < MIN ? MIN : l * reste / grandes) : l);
  const trait = c => rayeeCat(c) ? `url(#${id}-${teinteCat(c)})` : PLEIN[c] || PLEIN.gris;
  const rayures = [...new Set(parts.filter(p => rayeeCat(p.couleur)).map(p => teinteCat(p.couleur)))].map(t =>
    `<pattern id="${id}-${t}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:${PLEIN[t]};fill-opacity:.35"/><rect width="3" height="6" style="fill:${PLEIN[t]}"/></pattern>`).join('');
  let cumul = 0;
  const arcs = parts.map((p, i) => {
    const clic = tableau ? ` data-action="fin-cat" data-cat="${esc(cleCat(p))}"` : '';
    const s = `<circle class="arc" data-i="${i}"${clic} cx="${m}" cy="${m}" r="${R}" fill="none" style="stroke:${trait(p.couleur)}" stroke-width="${ep}" stroke-dasharray="${longs[i].toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-cumul).toFixed(2)}"><title>${esc(p.nom)} : ${eur(p.val)}</title></circle>`;
    cumul += longs[i] + ecart; return s;
  }).join('');
  const pc = v => { const x = v / total * 100; return x > 0 && x < .5 ? '< 1 %' : Math.round(x) + ' %'; };
  const max = Math.max(...parts.map(p => p.val)) || 1;
  const ligneTableau = (p, i) => { const choisie = filtreCatFin === cleCat(p);
    return `<li data-i="${i}" data-val="${esc(eur(p.val))}" data-nom="${esc(p.nom)}"${choisie ? ' class="choisie"' : ''}><button type="button" class="ligne-cat" data-action="fin-cat" data-cat="${esc(cleCat(p))}" aria-pressed="${choisie}"
      title="${choisie ? 'Afficher toutes les catégories' : esc(`N’afficher que les mouvements « ${p.nom} »`)}"><span class="nom-c">${pastilleCat(p.couleur, 'pt')}<span class="nom-l">${esc(p.nom)}</span></span>
      <span class="barre-cat" aria-hidden="true"><i class="${rayeeCat(p.couleur) ? 'ray' : ''}" style="width:${Math.max(1, p.val / max * 100).toFixed(1)}%;--c:${PLEIN[teinteCat(p.couleur)] || PLEIN.gris}"></i></span>
      <span class="eu">${eur(p.val)}</span><span class="pc">${pc(p.val)}</span><span class="nb">${p.n}</span></button></li>`; };
  const legende = tableau
    ? `<div class="tableau-cat"><div class="entete-cat" aria-hidden="true"><span>Catégorie</span><span></span><span>Montant</span><span>%</span><span><span class="lg">Opérations</span><span class="ct">Nb</span></span></div>
      <ul class="legende cats">${parts.map(ligneTableau).join('')}</ul></div>`
    : `<ul class="legende">${parts.map((p, i) => `<li data-i="${i}" data-val="${esc(eur(p.val))}" data-nom="${esc(p.nom)}">${pastilleCat(p.couleur, 'pt')}<span class="nom-l">${esc(p.nom)}</span><span class="pc">${pc(p.val)}</span><span class="eu">${eur(p.val)}</span></li>`).join('')}</ul>`;
  return `<div class="donut bloc-anneau${tableau ? ' large' : ''}">
    <div class="anneau" data-total="${esc(eur(total))}" data-lib="${esc(libelle)}">
      <svg width="${cote}" height="${cote}" viewBox="0 0 ${cote} ${cote}" role="img" aria-label="Répartition des dépenses par catégorie">${rayures ? `<defs>${rayures}</defs>` : ''}<circle cx="${m}" cy="${m}" r="${R}" fill="none" stroke="#ffffff10" stroke-width="${ep}"/>${arcs}</svg>
      <div class="centre"><b>${eur(total)}</b><span>${esc(libelle)}</span></div></div>
    ${legende}</div>`;
}
function surligner(bloc, i){
  $$('.arc', bloc).forEach(a => { a.style.opacity = (i !== null && a.dataset.i !== i) ? .3 : 1; a.style.strokeWidth = a.dataset.i === i ? ANNEAU.epSurvol : ANNEAU.ep; });
  $$('.legende li', bloc).forEach(l => l.classList.toggle('actif', l.dataset.i === i));
  const an = $('.anneau', bloc); if(!an) return;
  const li = i !== null ? $(`.legende li[data-i="${i}"]`, bloc) : null;
  $('.centre b', an).textContent = li ? li.dataset.val : an.dataset.total;
  $('.centre span', an).textContent = li ? li.dataset.nom : an.dataset.lib;
}

/* --- Graphiques finances (SVG, sans bibliothèque) --- */
function echelle(v){
  const haut = Math.max(v, 10), brut = haut / 3, mag = Math.pow(10, Math.floor(Math.log10(brut))), n = brut / mag;
  const pas = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return {pas, max:Math.ceil(haut / pas) * pas};
}
function grilleY(e, G, W, D, y){
  let s = '';
  for(let v = 0; v <= e.max + 1e-9; v += e.pas){
    const yy = y(v).toFixed(1);
    s += `<line x1="${G}" x2="${W - D}" y1="${yy}" y2="${yy}" stroke="#34343a"/><text x="${G - 8}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end">${eurCourt(v)}</text>`;
  }
  return s;
}
const barreArrondie = (x, y, w, h) => { const r = Math.min(4, h, w / 2);
  return `M${x.toFixed(1)},${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`; };

/* Barres : six mois (clic sur une barre = afficher ce mois).
   La fenêtre reste fixe (les 6 derniers mois) tant que le mois choisi est dedans :
   un clic ne fait plus « glisser » le graphique, il déplace seulement la sélection. */
function finFenetreMois(ym){
  const cour = moisCourant();
  return ym > cour ? ym : ym <= decaleMois(cour, -6) ? decaleMois(ym, 5) : cour;
}
function graphSixMois(ym){
  const fin = finFenetreMois(ym), mois = [-5, -4, -3, -2, -1, 0].map(k => decaleMois(fin, k)), vals = mois.map(m => totalMois(m)), bm = budgetMensuel();
  const W = 560, H = 210, G = 50, D = 16, T = 22, B = 24;
  const e = echelle(Math.max(...vals, bm) * 1.12), y = v => H - B - v / e.max * (H - B - T), pas = (W - G - D) / 6, lb = Math.min(46, pas * .55);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses des six derniers mois">` + grilleY(e, G, W, D, y);
  vals.forEach((v, i) => {
    const x0 = G + i * pas + (pas - lb) / 2, yy = y(v), h = Math.max(0, H - B - yy), sel = mois[i] === ym;
    const coul = bm && v > bm ? 'var(--rose)' : sel ? 'var(--bleu)' : '#55555e';
    s += `<g class="barre-mois${sel ? ' sel' : ''}" data-action="fin-mois" data-m="${mois[i]}"><rect class="fond" x="${(G + i * pas + 3).toFixed(1)}" y="${T - 14}" width="${(pas - 6).toFixed(1)}" height="${H - T + 14}" rx="8"/>` +
         (h > .5 ? `<path d="${barreArrondie(x0, yy, lb, h)}" style="fill:${coul}"/>` : `<rect x="${x0.toFixed(1)}" y="${(H - B - 3).toFixed(1)}" width="${lb.toFixed(1)}" height="3" rx="1.5" style="fill:${sel ? 'var(--bleu)' : '#4a4a52'}"/>`) +
         `<title>${nomMois(mois[i])} : ${eur(v)}${sel ? ' (affiché)' : ' — clic pour afficher ce mois'}</title></g>`;
    if(v > 0) s += `<text x="${(x0 + lb / 2).toFixed(1)}" y="${(yy - 6).toFixed(1)}" text-anchor="middle" style="fill:${sel ? 'var(--texte)' : 'var(--texte-doux)'}">${eurCourt(v)}</text>`;
    s += `<text x="${(x0 + lb / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${sel ? 'fill:var(--texte);font-weight:700' : ''}">${nomMois(mois[i], true)}</text>`;
  });
  if(bm) s += `<line x1="${G}" x2="${W - D}" y1="${y(bm).toFixed(1)}" y2="${y(bm).toFixed(1)}" style="stroke:var(--vert)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return s + '</svg>';
}

/* Vue par année : une colonne par mois (clic = afficher ce mois) */
function graphDouzeMois(an, parMois, bm){
  const cour = moisCourant(), mois = parMois.map((_, i) => an + '-' + pad(i + 1));
  const W = 560, H = 210, G = 50, D = 16, T = 22, B = 24;
  const e = echelle(Math.max(...parMois, bm) * 1.12), y = v => H - B - v / e.max * (H - B - T), pas = (W - G - D) / 12, lb = Math.min(28, pas * .6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses mois par mois en ${an}">` + grilleY(e, G, W, D, y);
  parMois.forEach((v, i) => {
    const m = mois[i], x0 = G + i * pas + (pas - lb) / 2, yy = y(v), h = Math.max(0, H - B - yy), enCours = m === cour;
    const coul = bm && v > bm ? 'var(--rose)' : 'var(--bleu)';
    s += `<g class="barre-mois" data-action="fin-mois" data-m="${m}"><rect class="fond" x="${(G + i * pas + 2).toFixed(1)}" y="${T - 14}" width="${(pas - 4).toFixed(1)}" height="${H - T + 14}" rx="7"/>` +
         (h > .5 ? `<path d="${barreArrondie(x0, yy, lb, h)}" style="fill:${coul}"/>` : `<rect x="${x0.toFixed(1)}" y="${(H - B - 3).toFixed(1)}" width="${lb.toFixed(1)}" height="3" rx="1.5" style="fill:#4a4a52"/>`) +
         `<title>${nomMois(m)} : ${eur(v)}${enCours ? ' (mois en cours)' : ''} — clic pour afficher ce mois</title></g>`;
    if(v > 0) s += `<text x="${(x0 + lb / 2).toFixed(1)}" y="${(yy - 6).toFixed(1)}" text-anchor="middle" style="font-size:9.5px">${eurCourt(v)}</text>`;
    s += `<text x="${(x0 + lb / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${enCours ? 'fill:var(--texte);font-weight:700' : ''}">${nomMois(m, true)}</text>`;
  });
  if(bm) s += `<line x1="${G}" x2="${W - D}" y1="${y(bm).toFixed(1)}" y2="${y(bm).toFixed(1)}" style="stroke:var(--vert)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return s + '</svg>';
}

/* Calendrier des dépenses : intensité du bleu = montant du jour */
function calendrierChaleur(ym){
  const [a, m] = ym.split('-').map(Number), n = joursDansMois(ym), dec = (new Date(a, m - 1, 1).getDay() + 6) % 7, auj = aujourdhui();
  const parJour = {};
  depenses(duMois(ym)).forEach(x => { const j = Number(x.date.slice(8, 10)); parJour[j] = (parJour[j] || 0) + (Number(x.montant) || 0); });
  const max = Math.max(1, ...Object.values(parJour));
  let cases = '';
  for(let i = 0; i < dec; i++) cases += '<span></span>';
  for(let j = 1; j <= n; j++){
    const jIso = ym + '-' + pad(j), v = parJour[j] || 0, t = v ? .18 + Math.sqrt(v / max) * .67 : 0;
    cases += `<button class="jour${jIso === auj ? ' auj' : ''}${t > .5 ? ' fort' : ''}" data-action="jour" data-j="${jIso}"${v ? ` style="background:rgba(57,135,229,${t.toFixed(2)})"` : ''} title="${j} : ${v ? esc(eur(v)) : 'aucune dépense'}">${j}</button>`;
  }
  return `<div class="cal chaleur">${['L','M','M','J','V','S','D'].map(x => `<span class="js">${x}</span>`).join('')}${cases}</div>
    <div class="cal-leg"><span>moins</span><span class="gamme">${[.22,.42,.62,.85].map(o => `<i style="background:rgba(57,135,229,${o})"></i>`).join('')}</span><span>plus</span><span style="margin-left:auto">clic = détail du jour</span></div>`;
}

/* Tableau de mouvements (finances, projet, jour) */
/* tri : {col, sens} → en-têtes cliquables (page Finances, action « fin-tri ») ; sans tri : en-têtes simples */

const FILTRES = {taches:'', projets:'', finances:'', notes:'', documents:'', contacts:''};
/* Filtre « projet » posé par un lien de la page d'un projet (ex. ses notes archivées) ; retiré en quittant la page */
let filtreProjet = null;
const PAGES_FILTRE_PROJET = ['taches', 'notes', 'documents', 'contacts'];
const projetFiltre = page => filtreProjet && filtreProjet.page === page ? filtreProjet.id : null;
const puceFiltreProjet = page => { const id = projetFiltre(page); return id ? `<span class="filtre-projet">${ico('dossier', 13)}<span>Projet : <b>${esc(nomProjet(id) || 'supprimé')}</b></span>
  <button class="icone-btn" data-action="filtre-projet-retirer" title="Retirer ce filtre" aria-label="Retirer le filtre projet">${ico('croix', 13)}</button></span>` : ''; };
/* « 2 notes archivées · voir » */
const ligneArchives = (n, sing, plur, lien, fem = true) => n ? `<p class="aide" style="margin:10px 0 0">${ico('archive', 13)} ${pluriel(n, sing, plur)} archivé${fem ? 'e' : ''}${n > 1 ? 's' : ''} · <a class="lien-texte" href="${lien}">voir</a></p>` : '';
let filtreTag = '';
let moisFin = moisCourant();
let vueFin = 'mois';   /* Finances : « mois » ou « an » (l'année du mois affiché) */
const MVTS_PAR_PAGE = 20;   /* tableau des mouvements : les 20 plus récents, puis 20 de plus à la demande */
let limiteMvts = MVTS_PAR_PAGE;
/* Finances : catégorie choisie dans « Par catégorie » (null = toutes ; SANS_CAT = « À catégoriser ») */
const SANS_CAT = '§sans';
let filtreCatFin = null;
/* Tri du tableau des mouvements de Finances (clic sur un en-tête ; nouveau clic = sens inverse).
   sens : 1 = croissant, -1 = décroissant. Premier clic : date et montant du plus grand au plus petit, textes de A à Z.
   Montant : valeur absolue (les plus gros mouvements, entrées comme dépenses). Cases vides toujours en dernier ;
   à égalité, les plus récents d'abord. Gardé pendant la session. */
let triMvts = {col:'date', sens:-1};
const TRI_DEFAUT = {date:-1, montant:-1, libelle:1, categorie:1, projet:1, compte:1};
const cleTriMvt = {
  date:m => m.date || '', montant:m => Math.abs(Number(m.montant) || 0), libelle:m => m.libelle || '',
  categorie:m => m.type === 'revenu' ? 'entrée' : m.categorie || 'à catégoriser', projet:m => nomProjet(m.projet), compte:m => m.compte || ''
};
const plusRecent = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.cree || '').localeCompare(a.cree || '');
function comparerMvts(a, b){
  const {col, sens} = triMvts, cle = cleTriMvt[col] || cleTriMvt.date, x = cle(a), y = cle(b);
  if(typeof x === 'number') return (x - y) * sens || plusRecent(a, b);
  if(!x !== !y) return x ? -1 : 1;   /* cases vides en dernier */
  return x.localeCompare(y, 'fr', {sensitivity:'base', numeric:true}) * sens || plusRecent(a, b);
}
function texteTri(){
  const {col, sens} = triMvts, noms = {libelle:'libellé', categorie:'catégorie', projet:'projet', compte:'compte'};

const TACHES_PAR_PAGE = 20;   /* « File d'exécution » : les 20 premières tâches (ordre de la file), puis 20 de plus à la demande */
let limiteTaches = TACHES_PAR_PAGE;
function pageTaches(){
  const ouvertes = DB.taches.filter(t => !t.fait), retard = tachesEnRetard().length, faites = DB.taches.length - ouvertes.length;
  return titre('Tâches', 'Coche pour terminer, l’horloge lance un Focus de 25 min.', btnAction('tache-nouvelle', ico('plus', 14) + 'Nouvelle tâche', 'btn p')) + `
    <div class="chiffres trois">
      ${kpi({icone:'coche', couleur:'bleu', libelle:'À traiter', valeur:ouvertes.length, note:'non terminées'})}
      ${kpi({icone:'alerte', couleur:'rose', libelle:'En retard', valeur:retard, note:retard ? 'à faire, reporter ou supprimer' : 'aucune', cls:retard ? 'dep' : 'bien'})}
      ${kpi({icone:'check', couleur:'vert', libelle:'Terminées', valeur:faites, note:'au total'})}
    </div>
    <section class="carte">${enteteCarte('cible', 'bleu', 'File d’exécution', puceFiltreProjet('taches') + champFiltre('taches', 'Filtrer…'))}<div id="liste-taches">${listeTaches()}</div></section>`;
}
function listeTaches(){
  const q = FILTRES.taches, auj = aujourdhui(), dem = decaleJour(1), fp = projetFiltre('taches');
  const l = DB.taches.filter(t => (!fp || t.projet === fp) && correspond(q, t.nom, t.date, labelJour(t.date), nomProjet(t.projet), t.tags));
  if(!l.length) return q ? vide(`Aucune tâche ne correspond à « ${esc(q)} ».`) : vide('Aucune tâche pour l’instant.', btnAction('tache-nouvelle', 'Créer une tâche', 'btn p'));
  const ouvertes = l.filter(t => !t.fait), groupes = new Map(), nbGroupe = new Map();
  const cle = t => !t.date ? 'z' : t.date < auj ? '0' : t.date;
  const parFin = (a, b) => (b.faitLe || '').localeCompare(a.faitLe || '');
  const faites = l.filter(t => t.fait && !t.archive).sort(parFin), archives = l.filter(t => t.archive).sort(parFin);
  /* Ordre de la file : en retard, puis par jour, sans date en dernier (dans un même jour : priorité, puis heure) ; puis les terminées.
     Seules les limiteTaches premières sont affichées ; chaque groupe garde son nombre total. */
  const file = trierTaches(ouvertes).sort((a, b) => cle(a).localeCompare(cle(b)));
  const total = file.length + faites.length, visibles = new Set([...file, ...faites].slice(0, limiteTaches));
  file.forEach(t => { const k = cle(t); nbGroupe.set(k, (nbGroupe.get(k) || 0) + 1); if(!visibles.has(t)) return; if(!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(t); });
  let html = '';
  groupes.forEach((ts, k) => {
    const nom = k === '0' ? 'En retard' : k === 'z' ? 'Sans date' : k === auj ? 'Aujourd’hui' : k === dem ? 'Demain' : labelJour(k);
    html += `<div class="groupe-titre${k === '0' ? ' retard' : ''}"><span class="etiq">${nom}</span><span class="compte">${nbGroupe.get(k)}</span></div><ul class="liste">${ts.map(t => ligneTache(t, {date:k === '0'})).join('')}</ul>`;
  });
  const faitesVues = faites.filter(t => visibles.has(t));
  if(faitesVues.length) html += `<div class="groupe-titre"><span class="etiq">Terminées</span><span class="compte">${faites.length}</span><span class="aide" style="margin:0 0 0 4px">archivées automatiquement demain</span></div><ul class="liste">${faitesVues.map(t => ligneTache(t)).join('')}</ul>`;
  const reste = total - limiteTaches;
  if(reste > 0) html += `<div class="plus-notes"><span class="aide">${limiteTaches} tâches affichées sur ${total}, dans l’ordre de la file</span>${btnAction('taches-plus', `Afficher ${Math.min(TACHES_PAR_PAGE, reste)} de plus`, 'btn')}</div>`;
  /* Archives : repliées, dépliées d'office quand le filtre y trouve quelque chose */
  if(archives.length){ const max = q ? archives.length : 100;
    html += blocPliable('taches-archives', `<span class="etiq">Archives</span><span class="compte">${archives.length}</span>`,
      `<ul class="liste">${archives.slice(0, max).map(t => ligneTache(t)).join('')}</ul>` +
      (archives.length > max ? `<p class="aide" style="margin-top:8px">Les ${archives.length - max} plus anciennes sont masquées : utilise le filtre pour les retrouver.</p>` : ''), !!q.trim() || !!fp); }
  return html || vide('Toutes les tâches sont terminées.');
}

/* --- DOCUMENTS : briques communes (module Documents, projet, Aujourd'hui, recherche) ---
   Un document = un titre, un lien facultatif (Google Drive, site, fichier local) et/ou une échéance à surveiller. */
/* Lien vers un fichier du dossier Drive relié : « drive:Habitation/Assurance.pdf » (chemin depuis ce dossier) */
const estDrive = url => typeof url === 'string' && url.startsWith('drive:');
const cheminDe = url => url.slice(6);
const nomFichier = chemin => String(chemin).split('/').pop() || String(chemin);
const extensionDe = nom => ((String(nom).match(/\.([a-z0-9]{1,7})$/i) || [])[1] || '').toLowerCase();
const sansExtension = nom => String(nom).replace(/\.[a-z0-9]{1,7}$/i, '') || String(nom);
function typeDocument(url){
  if(!url) return {icone:'document', couleur:'gris', nom:'Sans lien'};
  if(estDrive(url)){ const x = extensionDe(nomFichier(cheminDe(url)));
    if(x === 'pdf') return {icone:'doc', couleur:'rose', nom:'PDF du Drive'};
    if(/^(jpe?g|png|gif|webp|heic|bmp|svg)$/.test(x)) return {icone:'image', couleur:'violet', nom:'Image du Drive'};
    if(/^g(doc|sheet|slides|draw|form)$/.test(x)) return {icone:'dossier', couleur:'vert', nom:'Google Docs'};
    return {icone:'dossier', couleur:'vert', nom:'Fichier du Drive'}; }
  const u = url.toLowerCase(), chemin = u.split(/[?#]/)[0];
  if(/\.pdf$/.test(chemin)) return {icone:'doc', couleur:'rose', nom:'PDF'};
  if(/\.(jpe?g|png|gif|webp|heic|bmp|svg)$/.test(chemin)) return {icone:'image', couleur:'violet', nom:'Image'};
  if(/^https?:\/\/(drive|docs)\.google\.com\//.test(u)) return {icone:'dossier', couleur:'vert', nom:/docs\.google/.test(u) ? 'Google Docs' : 'Google Drive'};
  if(u.startsWith('file:')) return {icone:'doc', couleur:'jaune', nom:'Fichier sur l’ordinateur'};
  return {icone:'lien', couleur:'bleu', nom:'Lien'};
}
function hoteLien(url){
  if(estDrive(url)){ const c = cheminDe(url), i = c.lastIndexOf('/'); return i > 0 ? c.slice(0, i) : 'dossier Drive'; }
  try { const x = new URL(url); return x.protocol === 'file:' ? decodeURIComponent(x.pathname).replace(/^\//, '').replace(/\//g, '\\') : x.hostname.replace(/^www\./, ''); }
  catch(e){ return url; }
}
function titreDepuisLien(url){
  if(estDrive(url)) return sansExtension(nomFichier(cheminDe(url)));
  try {
    const x = new URL(url);
    if(/(drive|docs)\.google\.com$/.test(x.hostname)) return 'Document Google Drive';
    const dernier = decodeURIComponent(x.pathname.split('/').filter(Boolean).pop() || '');
    return dernier || x.hostname.replace(/^www\./, '') || url;
  } catch(e){ return url || 'Sans titre'; }
}
const unDocument = id => DB.documents.find(x => x.id === id) || null;
/* Ordre d'urgence : expirés, à renouveler, plus tard (échéance la plus proche d'abord), puis sans échéance */
const RANG_ETAT = {expire:0, preavis:1, 'plus-tard':2, sans:3};
const ordreDocuments = (a, b) => { const ea = etatDocument(a), eb = etatDocument(b);
  return RANG_ETAT[ea.etat] - RANG_ETAT[eb.etat] || (ea.jours ?? 0) - (eb.jours ?? 0) || a.titre.localeCompare(b.titre, 'fr'); };
/* Titre d'un document : avec un lien, il l'ouvre dans un nouvel onglet ; sans lien, il ouvre sa fiche */

/* Badge d'échéance : rose = expiré, jaune = dans le préavis, discret sinon */

function listeFinances(){

  const nomCat = fc === SANS_CAT ? 'À catégoriser' : fc;
  const tous = (q ? DB.mouvements.filter(m => correspond(q, m.libelle, m.categorie, m.compte, nomProjet(m.projet), String(m.montant), dateCourte(m.date)))
                  : DB.mouvements.filter(duMois(periode))).filter(dansCat);
  /* Le mois affiché suit les cases cochées ; une recherche trouve tout (les comptes décochés apparaissent en grisé) */
  const l = (q ? tous.slice() : tous.filter(dansStats)).sort(comparerMvts);
  const caches = tous.length - l.length, gris = q ? l.filter(m => !dansStats(m)).length : 0;

/* --- NOTES : dossiers (tags) à gauche, titres dépliables à droite, fenêtre au clic sur un titre --- */
const SANS_TAG = '∅', ARCHIVES = '§archives';   /* dossiers virtuels : notes sans tag, notes archivées */

  const actives = nonArchives(base), archivees = base.length - actives.length, tags = tagsDe(actives);
  const l = [{v:'', nom:'Toutes les notes', n:actives.length}];
  const sans = actives.filter(n => !n.tags.length).length;
  tags.forEach(t => l.push({v:t, nom:t, n:actives.filter(n => aLeTag(n, t)).length}));
  if(sans && tags.length) l.push({v:SANS_TAG, nom:'Sans dossier', n:sans});
  if(archivees) l.push({v:ARCHIVES, nom:'Archives', n:archivees});
  return l;
}
const dansDossier = n => (!projetFiltre('notes') || n.projet === projetFiltre('notes')) &&

function listeNotes(){

  const tete = titre('Documents', vueDrive ? 'Les fichiers de ton dossier Google Drive, en lecture seule. Clic sur un fichier : il s’ouvre dans un nouvel onglet. L’icône calendrier crée une fiche pour suivre son échéance.'

function listeContacts(){
  if(!DB.contacts.length) return vide('Aucune fiche. Ce module sert de mémoire : anniversaires, nouvelles, messages en attente.', btnAction('contact-nouveau', 'Créer une fiche', 'btn p'));
  const q = FILTRES.contacts, cherche = !!q.trim();
  const fp = projetFiltre('contacts');
  const l = DB.contacts.filter(c => (!fp || c.projet === fp) && correspond(q, c.nom, c.telephone, c.autreTelephone, c.email, c.adresse, c.nouvelles, c.aDire.map(i => i.t), c.aRepondre.map(i => i.t), c.idees.map(i => i.t), nomProjet(c.projet), c.tags))
    .sort((a, b) => { const ja = joursAvantAnniv(a.anniversaire), jb = joursAvantAnniv(b.anniversaire); return (ja ?? 999) - (jb ?? 999) || a.nom.localeCompare(b.nom, 'fr'); });
  const actifs = l.filter(c => !c.archive), archives = l.filter(c => c.archive);
  const html = actifs.length ? `<div class="mosaique">${actifs.map(c => carteContact(c, cherche)).join('')}</div>`
    : vide(cherche ? `Aucune fiche ne correspond à « ${esc(q)} »${archives.length ? ' parmi les fiches actives' : ''}.` : 'Toutes les fiches sont archivées.');
  if(!archives.length) return html;
  return `<div class="pile">${html}${cartePliable('contacts-archives', 'archive', 'gris', 'Archivés', `<span class="compte">${archives.length}</span>`, '',
    `<div class="mosaique">${archives.map(c => carteContact(c, false)).join('')}</div>`, cherche || !!fp)}</div>`;
}
const avatarContact = (c, cls = '') => `<span class="avatar${cls}" style="background:linear-gradient(135deg,${DEGRADE[couleurDe(c.id)]})">${esc(initiales(c.nom))}</span>`;
function pucesContact(c){
  const e = ecartJours(c.derniereConversation);
  const puceTel = (num, titre) => { if(!num) return ''; const t = num.replace(/[^\d+]/g, '');
    return `<a class="puce lien-tel" href="${t ? 'tel:' + esc(t) : '#'}" title="${titre}">${ico('telephone', 12)}${esc(num)}</a>`; };
  return (c.archive ? `<span class="puce">${ico('archive', 12)}archivée</span>` : '') +
    puceTel(c.telephone, 'Appeler') + puceTel(c.autreTelephone, 'Appeler (autre numéro)') +
    (c.email ? `<a class="puce lien-tel" href="mailto:${esc(c.email)}" title="Écrire un e-mail">${ico('courriel', 12)}${esc(c.email)}</a>` : '') + (c.anniversaire ? `<span class="puce">${ico('cadeau', 12)}${esc(dateCourte(c.anniversaire))}</span>` : '') +
    `<span class="puce">${ico('bulle', 12)}${e === null ? 'aucun échange noté' : e === 0 ? 'échange aujourd’hui' : e === 1 ? 'échange hier' : 'échange il y a ' + e + ' j'}</span>${tagProjet(c.projet)}${pucesTags(c.tags)}`;
}
/* Listes d'une fiche (à lui dire, à répondre, idées) ; « modifiable » = texte éditable (fenêtre) */
function blocItems(c, libelle, cle, icone, modifiable = false){
  const base = `data-id="${esc(c.id)}" data-cle="${cle}"`;
  return `<div class="sous-titre">${ico(icone, 12)}${libelle}${c[cle].length ? `<span class="compte">${c[cle].filter(i => !i.ok).length}</span>` : ''}</div><ul class="items">${c[cle].map((it, i) => `<li class="${it.ok ? 'fait' : ''}">
      <input type="checkbox" class="case" data-coche="item" ${base} data-i="${i}" ${it.ok ? 'checked' : ''} aria-label="Fait : ${esc(it.t)}">
      ${modifiable ? `<span class="item-texte" contenteditable="true" role="textbox" spellcheck="true" data-item-texte ${base} data-i="${i}" title="Clique pour modifier" aria-label="${esc(libelle)} : élément ${i + 1}">${esc(it.t)}</span>` : `<span class="t">${esc(it.t)}</span>`}
      <button class="icone-btn danger" data-action="item-supprimer" ${base} data-i="${i}" title="Retirer" aria-label="Retirer">${ico('croix', 13)}</button></li>`).join('')}</ul>
    <form class="ajout" data-form="item" ${base}>${ico('plus', 13)}<input name="t" placeholder="Ajouter…" autocomplete="off" aria-label="Ajouter à ${esc(libelle)}"></form>`;
}
const blocsContact = (c, modifiable) => blocItems(c, 'À lui dire', 'aDire', 'bulle', modifiable) + blocItems(c, 'À répondre', 'aRepondre', 'retour', modifiable) + blocItems(c, 'Idées de cadeaux', 'idees', 'cadeau', modifiable);
function carteContact(c, forcerOuvert){
  const j = joursAvantAnniv(c.anniversaire), k = 'contact-' + c.id, ouvert = forcerOuvert || !!etatDepliage[k], d = `data-id="${esc(c.id)}"`;
  const attente = c.aRepondre.filter(i => !i.ok).length;
  const badge = c.archive ? '' : j !== null && j <= 30 ? `<span class="puce alerte">${ico('cadeau', 12)}${j === 0 ? 'aujourd’hui' : j === 1 ? 'demain' : 'dans ' + j + ' j'}</span>` : attente ? `<span class="compte" title="Réponses en attente">${attente}</span>` : '';
  return `<article class="carte depliable${ouvert ? ' ouvert' : ''}" data-depliable="${esc(k)}">
    <div class="depliable-tete" data-action="deplier">${avatarContact(c)}
      <span class="titre"><button class="nom-lien" data-action="contact-ouvrir" ${d} title="Ouvrir la fiche en grand">${esc(c.nom)}</button></span>${badge}
      <button class="chevron" data-action="deplier" aria-expanded="${ouvert}" aria-label="Déplier : ${esc(c.nom)}">${ico('chevronB', 14)}</button></div>
    <div class="depliable-corps">
      <div class="puces">${pucesContact(c)}</div>

      ${c.nouvelles ? `<div class="nouvelles"><span class="etiq">Ses nouvelles</span><div style="margin-top:3px">${esc(c.nouvelles)}</div></div>` : ''}
      ${blocsContact(c)}

        ${btnAction('contact-ouvrir', ico('agrandir', 13) + 'Ouvrir la fiche', 'btn f compact', d)}${boutonArchive('contact', c)}${btnAction('contact-supprimer', ico('corbeille', 13) + 'Supprimer', 'btn f compact danger', d)}</div>

}
